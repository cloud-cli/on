<template component="app-header">
  <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
  <header class="mx-auto flex w-full max-w-[78rem] items-center justify-between gap-4 border-b border-app-border pb-5">
    <div class="flex min-w-0 items-start gap-3">
      <template if="back">
        <a
          class="mt-0.5 inline-flex h-9 w-9 items-center justify-center rounded-lg border border-app-border text-app-muted no-underline outline-none hover:border-app-primary hover:text-app-primary focus-visible:ring-2 focus-visible:ring-app-primary/60"
          attr-href="back"
          attr-aria-label="backLabel || 'Back'"
          attr-title="backLabel || 'Back'"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            width="17"
            height="17"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m15 18-6-6 6-6"></path>
          </svg>
        </a>
      </template>
      <div>
        <div class="text-[.7rem] font-bold uppercase tracking-[.16em] text-app-primary">Runner engine</div>
        <h1 class="mt-1 text-2xl font-bold tracking-tight text-app-foreground">{{ title }}</h1>
        <template if="subtitle"><p class="mt-1 text-xs text-app-muted">{{ subtitle }}</p></template>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <template if="!authenticated">
        <a
          class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-app-border text-app-secondary no-underline outline-none hover:border-app-primary hover:bg-app-background hover:text-app-primary focus-visible:ring-2 focus-visible:ring-app-primary/60"
          href="/ui/settings"
          aria-label="Settings"
          title="Settings"
        >
          <lucide-icon icon="user-round" size="16"></lucide-icon>
        </a>
      </template>
      <template if="authenticated">
        <a
          class="text-xs text-app-primary hover:text-app-foreground"
          href="/ui/operations"
          class-hidden="!canViewOperations"
          >Operations</a
        >
        <select
          class="max-w-40 rounded-lg border border-app-border bg-app-card px-2 py-2 text-xs text-app-foreground outline-none focus:border-app-primary"
          bind-value="activeTeamId"
          on-change="switchTeam($event)"
          attr-aria-label="Current team"
          class-hidden="teams.length < 2"
        >
          <template for="team of teams"><option attr-value="team.id">{{ team.name }}</option></template>
        </select>
        <span class="hidden text-xs text-app-muted sm:inline">{{ userName }}</span>
        <a class="text-xs text-app-primary hover:text-app-foreground" href="/auth/logout">Sign out</a>
      </template>
      <a
        class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-app-border text-app-secondary no-underline outline-none hover:border-app-primary hover:bg-app-background hover:text-app-primary focus-visible:ring-2 focus-visible:ring-app-primary/60"
        href="/ui/help"
        aria-label="Help"
        title="Help"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M9.6 9a2.5 2.5 0 1 1 4.2 1.8c-1.2 1-1.8 1.4-1.8 2.7"></path>
          <path d="M12 17h.01"></path>
        </svg>
      </a>
      <template if="authenticated">
        <a
          class="inline-flex h-9 w-9 items-center justify-center overflow-hidden rounded-full border border-app-border text-app-secondary no-underline outline-none hover:border-app-primary hover:bg-app-background hover:text-app-primary focus-visible:ring-2 focus-visible:ring-app-primary/60"
          href="/ui/settings"
          aria-label="Settings"
          title="Settings"
        >
          <template if="userPhoto"><img attr-src="userPhoto" alt="" class="h-full w-full object-cover" /></template>
          <template if="!userPhoto"><lucide-icon icon="circle-user-round" size="16"></lucide-icon></template>
        </a>
      </template>
    </div>
  </header>
  <script setup src="/assets/app-header.mjs"></script>
</template>
