<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace Connectors</title>
  </head>
  <body class="min-h-screen bg-app-background text-app-foreground">
    <link rel="stylesheet" href="/assets/on.css" />
    <link rel="component" href="https://sodium.static.apphor.de/code-editor.html" />
    <template app>
      <main class="w-full space-y-5">
        <p role="alert" class="text-sm text-app-error" class-hidden="!error">{{ error }}</p>
        <p role="status" aria-live="polite" class="text-sm text-app-secondary" class-hidden="!loading">
          Loading connectors…
        </p>
        <template if="oneTimeUrl"
          ><div role="status" class="break-all rounded-lg border border-app-warning/50 p-4">
            <p class="font-semibold">Private ingress URL — shown only once</p>
            <code>{{ oneTimeUrl }}</code>
            <button type="button" on-click="copyUrl()" class="ml-3 underline">Copy URL</button>
            <button type="button" on-click="dismissUrl()" class="ml-3 underline">Dismiss</button>
          </div></template
        >
        <template if="oneTimeSigningSecret"
          ><div role="status" class="break-all rounded-lg border border-app-warning/50 p-4">
            <p class="font-semibold">Signing secret — shown only once</p>
            <code>{{ oneTimeSigningSecret }}</code>
            <button type="button" on-click="copySigningSecret()" class="ml-3 underline">Copy secret</button>
            <button type="button" on-click="dismissSigningSecret()" class="ml-3 underline">Dismiss</button>
          </div></template
        >
        <section
          class="rounded-2xl border border-app-border bg-app-card p-4 shadow-sm shadow-app-foreground/5"
          class-hidden="editing"
          aria-labelledby="connectors-title"
        >
          <div class="mb-4 flex items-end justify-between gap-3">
            <h1 id="connectors-title" class="mt-1 text-lg font-semibold text-app-foreground">Connectors</h1>
            <a
              class="inline-flex min-h-10 items-center justify-center gap-2 rounded-lg bg-app-primary px-3 py-2 text-sm font-semibold text-white outline-none transition hover:bg-app-primary focus-visible:ring-2 focus-visible:ring-app-primary/40"
              attr-href="basePath + '/new'"
              ><lucide-icon icon="plus" size="16"></lucide-icon>New connector</a
            >
          </div>
          <ul class="divide-y divide-app-border" aria-label="Workspace connectors">
            <template for="item of connectors"
              ><li class="flex min-h-14 items-center gap-3 px-2 py-2">
                <a
                  class="min-w-0 flex-1 text-left text-sm text-app-secondary outline-none hover:text-app-primary focus-visible:rounded focus-visible:ring-2 focus-visible:ring-app-primary/40"
                  attr-href="basePath + '/' + encodeURIComponent(item.id)"
                >
                  <span class="flex min-w-0 items-center gap-3">
                    <span class="truncate text-base font-semibold text-app-foreground">{{ item.name }}</span>
                    <span class="shrink-0 font-mono text-xs text-app-secondary">v{{ item.version }}</span>
                  </span>
                </a>
                <span class="hidden text-xs text-app-secondary sm:inline"
                  >{{ item.id }} · {{ item.enabled ? 'Enabled' : item.published ? 'Disabled' : 'Unpublished' }}<template
                    if="item.hasDraft"
                  >
                    · Draft</template
                  ></span
                >
                <a
                  class="cursor-pointer rounded-lg bg-green-50 px-3 py-1.5 text-xs font-medium text-green-700 hover:bg-green-100 focus-visible:ring-2 focus-visible:ring-green-700/40"
                  attr-href="basePath + '/' + encodeURIComponent(item.id)"
                  attr-aria-label="'Edit ' + item.name"
                  >Edit</a
                >
                <button
                  type="button"
                  on-click="remove(item)"
                  attr-aria-label="'Delete ' + item.name"
                  bind-disabled="busy"
                  class="cursor-pointer rounded-lg bg-red-50 px-3 py-1.5 text-xs font-medium text-red-700 hover:bg-red-100 focus-visible:ring-2 focus-visible:ring-red-700/40 disabled:opacity-50"
                >
                  Delete
                </button>
              </li></template
            >
          </ul>
          <div
            class="rounded-xl border border-dashed border-app-border px-4 py-8 text-center"
            class-hidden="loading || connectors.length"
          >
            <p class="text-sm font-medium text-app-secondary">No connectors yet</p>
            <p class="mt-1 text-xs text-app-secondary">Create a connector to accept incoming events.</p>
          </div>
        </section>
        <section
          class="min-w-0 rounded-2xl border border-app-border bg-app-card p-4 shadow-sm shadow-app-foreground/5 sm:p-5"
          aria-labelledby="editor-title"
          class-hidden="!editing"
        >
          <a class="text-sm text-app-primary underline" attr-href="basePath">Back to connectors</a>
          <h2 id="editor-title" class="mt-3 text-lg font-semibold">
            {{ selectedId ? 'Edit connector' : 'New connector' }}
          </h2>
          <div class="mt-4 grid gap-3 sm:grid-cols-2">
            <label class="grid gap-1 text-sm"
              >Connector ID<input
                bind-value="id"
                on-input="setId($event)"
                maxlength="64"
                pattern="[a-z0-9]+(?:-[a-z0-9]+)*"
                required
                bind-disabled="Boolean(selectedId)"
                class="min-h-11 rounded border border-app-border bg-app-panel px-3"
            /></label>
            <label class="grid gap-1 text-sm"
              >Name<input
                bind-value="name"
                on-input="setName($event)"
                maxlength="200"
                required
                class="min-h-11 rounded border border-app-border bg-app-panel px-3"
            /></label>
          </div>
          <label class="mt-4 inline-flex min-h-11 items-center gap-2 text-sm"
            ><input
              type="checkbox"
              bind-checked="enabled"
              on-change="toggleEnabled($event)"
              bind-disabled="busy || !selectedId || !published"
              class="h-4 w-4"
            />Enabled</label
          >
          <p class="text-xs text-app-secondary">
            This controls the published connector. Saving a draft does not change live ingress behavior.
          </p>
          <section
            class="mt-4 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-app-border bg-app-panel p-4"
            aria-labelledby="connector-credentials-title"
            class-hidden="!selectedId"
          >
            <div class="min-w-0">
              <h3 id="connector-credentials-title" class="font-semibold">Webhook credentials</h3>
              <p class="mt-1 text-xs text-app-secondary">
                The private webhook URL and webhook secret are separate credentials. Connector YAML defines how incoming
                requests are verified and mapped to events.
              </p>
              <p class="mt-1 text-xs text-app-secondary">
                Webhook secret: {{ hasSigningSecret ? 'Configured' : 'Not configured' }}
              </p>
            </div>
            <button
              type="button"
              on-click="rotateSigningSecret()"
              bind-disabled="busy || !published"
              class="min-h-11 shrink-0 rounded-lg border border-app-primary px-4 text-sm font-semibold text-app-primary disabled:opacity-50"
            >
              {{ hasSigningSecret ? 'Rotate webhook secret' : 'Generate webhook secret' }}
            </button>
          </section>
          <label class="sr-only" for="connector-yaml">Connector YAML</label>
          <textarea
            id="connector-yaml"
            bind-value="source"
            on-input="setSource($event)"
            rows="20"
            spellcheck="false"
            class="mt-3 min-h-80 w-full resize-y rounded-lg border border-app-border bg-app-panel p-3 font-mono text-sm"
            aria-label="Connector YAML"
          ></textarea>
          <div class="mt-3 flex flex-wrap gap-2">
            <button
              type="button"
              on-click="save()"
              bind-disabled="busy"
              class="min-h-11 rounded-lg border border-app-primary px-4 text-sm font-semibold text-app-primary"
            >
              Save draft
            </button>
            <button
              type="button"
              on-click="publish()"
              bind-disabled="busy || !selectedId || !hasDraft"
              class="min-h-11 rounded-lg bg-app-success px-4 text-sm font-semibold text-white"
            >
              Publish
            </button>
            <button
              type="button"
              on-click="remove()"
              bind-disabled="busy || !selectedId"
              class="min-h-11 rounded-lg border border-app-error px-4 text-sm text-app-error"
            >
              Delete
            </button>
          </div>
        </section>
      </main>
      <script setup src="/assets/connectors-ui.mjs"></script>
    </template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
