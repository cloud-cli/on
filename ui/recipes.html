<template app>
  <link rel="component" href="https://sodium.static.apphor.de/code-editor.html" />
  <main class="mx-auto max-w-5xl space-y-6" data-recipes-root>
    <section data-marketplace>
      <header class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p class="text-sm font-semibold uppercase tracking-wide text-app-primary">Global registry</p>
          <h1 class="mt-1 text-3xl font-semibold">Recipes</h1>
          <p class="mt-2 text-app-secondary">Browse immutable workflow recipes and shareable connector templates.</p>
          <p class="mt-2 text-sm font-medium text-amber-800">
            Recipes contain executable code. Review a recipe before pinning it in a workflow.
          </p>
        </div>
        <button type="button" data-create class="rounded-lg bg-app-primary px-4 py-2 font-semibold text-white">
          Publish recipe
        </button>
      </header>
      <div role="group" aria-label="Filter recipe catalog" class="mt-5 flex gap-2">
        <button
          type="button"
          aria-pressed="true"
          data-kind="recipes"
          class="rounded-lg bg-app-primary px-3 py-2 text-white"
        >
          Workflow recipes
        </button>
        <button
          type="button"
          aria-pressed="false"
          data-kind="connectors"
          class="rounded-lg border border-app-border px-3 py-2"
        >
          Connector templates
        </button>
      </div>
      <p data-list-status role="status" aria-live="polite" class="mt-4 text-sm text-app-secondary"></p>
      <section data-list class="mt-2 grid min-w-0 gap-4 sm:grid-cols-2 [&_*]:[overflow-wrap:anywhere]"></section>
      <p data-list-error role="alert" class="hidden mt-3 text-sm text-rose-700"></p>
    </section>

    <section data-editor-page class="hidden">
      <h1 class="text-2xl font-semibold" data-editor-title>New recipe version</h1>
      <p class="mt-1 text-sm text-app-secondary" data-editor-reference></p>
      <form data-form class="mt-4 space-y-4">
        <label data-source-label for="recipe-source" class="block text-sm font-medium">Recipe YAML</label>
        <code-editor
          id="recipe-source"
          data-source
          language="yaml"
          theme="googlecode"
          nostatus="true"
          aria-label="Recipe YAML source"
          class="mt-1 block h-[60vh] min-h-[28rem] overflow-hidden rounded-lg border border-app-border bg-app-card"
        ></code-editor>
        <p data-validation role="status" aria-live="polite" class="text-sm text-app-secondary"></p>
        <label data-description-wrap class="hidden block text-sm font-medium"
          >Description<textarea
            data-template-description
            maxlength="2000"
            class="mt-1 block w-full rounded-lg border border-app-border px-3 py-2"
          ></textarea>
        </label>
        <p data-error role="alert" class="hidden text-sm text-rose-700"></p>
        <div class="flex gap-3">
          <button data-save type="submit" class="rounded-lg bg-app-primary px-4 py-2 font-semibold text-white" disabled>
            Save version
          </button>
          <button type="button" data-cancel class="rounded-lg border border-app-border px-4 py-2">Cancel</button>
        </div>
      </form>
    </section>

    <dialog
      data-create-dialog
      aria-labelledby="create-recipe-title"
      class="fixed left-1/2 top-1/2 m-0 max-h-[calc(100dvh-2rem)] w-[min(32rem,calc(100%-2rem))] -translate-x-1/2 -translate-y-1/2 overflow-y-auto rounded-xl p-6 shadow-xl backdrop:bg-black/40"
    >
      <form method="dialog" data-create-form class="space-y-4">
        <h2 id="create-recipe-title" data-create-dialog-title class="text-xl font-semibold">Create recipe</h2>
        <label class="block text-sm font-medium"
          >Slug<input
            data-slug
            required
            pattern="[a-z0-9][a-z0-9-]{0,62}"
            class="mt-1 block w-full rounded-lg border border-app-border px-3 py-2"
            placeholder="docker-build"
          />
        </label>
        <label data-create-description-wrap class="hidden block text-sm font-medium"
          >Description<textarea
            data-description
            maxlength="2000"
            class="mt-1 block w-full rounded-lg border border-app-border px-3 py-2"
          ></textarea>
        </label>
        <label class="block text-sm font-medium"
          >Display name<input
            data-name
            required
            maxlength="100"
            class="mt-1 block w-full rounded-lg border border-app-border px-3 py-2"
            placeholder="Docker build"
          />
        </label>
        <p data-create-error role="alert" class="hidden text-sm text-rose-700"></p>
        <div class="flex gap-3">
          <button type="submit" value="create" class="rounded-lg bg-app-primary px-4 py-2 font-semibold text-white">
            Continue
          </button>
          <button type="submit" value="cancel" formnovalidate class="rounded-lg border border-app-border px-4 py-2">
            Cancel
          </button>
        </div>
      </form>
    </dialog>
    <dialog
      data-install-dialog
      aria-labelledby="install-title"
      class="fixed left-1/2 top-1/2 m-0 max-h-[calc(100dvh-2rem)] w-[min(32rem,calc(100%-2rem))] -translate-x-1/2 -translate-y-1/2 overflow-y-auto rounded-xl p-6 shadow-xl backdrop:bg-black/40"
    >
      <form method="dialog" data-install-form class="space-y-4">
        <h2 id="install-title" class="text-xl font-semibold">Install connector template</h2>
        <label class="block text-sm font-medium"
          >Workspace
          <select
            data-workspace
            required
            class="mt-1 block w-full rounded-lg border border-app-border px-3 py-2"
          ></select>
        </label>
        <p data-install-error role="alert" class="hidden text-sm text-rose-700"></p>
        <div class="flex gap-3">
          <button type="submit" class="rounded-lg bg-app-primary px-4 py-2 font-semibold text-white">Install</button
          ><button type="button" data-install-cancel class="rounded-lg border border-app-border px-4 py-2">
            Cancel
          </button>
        </div>
      </form>
    </dialog>
    <dialog
      data-secret-dialog
      aria-labelledby="secret-title"
      class="fixed left-1/2 top-1/2 m-0 max-h-[calc(100dvh-2rem)] w-[min(36rem,calc(100%-2rem))] -translate-x-1/2 -translate-y-1/2 overflow-y-auto rounded-xl p-6 shadow-xl backdrop:bg-black/40"
    >
      <h2 id="secret-title" class="text-xl font-semibold">Connector installed</h2>
      <p class="mt-2 text-sm">
        The signing secret does not expire, but it is shown only once. Save it securely before dismissing.
      </p>
      <label class="mt-4 block text-sm font-medium"
        >Webhook URL<input
          data-secret-url
          readonly
          class="mt-1 block w-full min-w-0 rounded-lg border border-app-border px-3 py-2 font-mono text-xs"
      /></label>
      <button type="button" data-copy-url class="mt-1 rounded border px-3 py-1 text-sm">Copy webhook URL</button
      ><span data-url-copy-status role="status" aria-live="polite" class="ml-2 text-sm"></span>
      <label class="mt-4 block text-sm font-medium"
        >Signing secret<input
          data-secret-value
          readonly
          class="mt-1 block w-full min-w-0 rounded-lg border border-app-border px-3 py-2 font-mono text-xs"
      /></label>
      <button type="button" data-copy-secret class="mt-1 rounded border px-3 py-1 text-sm">Copy signing secret</button
      ><span data-secret-copy-status role="status" aria-live="polite" class="ml-2 text-sm"></span>
      <p class="mt-4 text-sm">Dismissal permanently clears these values from this page. Confirm you have saved them.</p>
      <button
        type="button"
        data-secret-dismiss
        class="mt-3 rounded-lg bg-app-primary px-4 py-2 font-semibold text-white"
      >
        I saved these values — dismiss
      </button>
    </dialog>
    <script setup src="/assets/pages/recipes-ui.mjs"></script>
  </main>
</template>
