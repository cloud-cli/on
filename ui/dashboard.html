<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef2ec" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/on.css" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <link rel="component" href="/assets/app-header.html" />
    <title>Runs · Flow</title>
    <script type="importmap">
      { "imports": { "@app/": "/assets/", "@li3/": "https://at-li3.static.apphor.de/" } }
    </script>
  </head>
  <body class="bg-flow-background text-flow-foreground min-h-screen p-4 md:p-6 font-sans">
    <template app>
      <main class="w-full space-y-6 py-2">
        <section class="space-y-4 rounded-2xl border border-flow-border bg-white p-4 md:p-5">
          <template if="refreshError"
            ><p role="status" class="text-sm text-rose-700">Could not refresh runs</p></template
          >
          <template if="workflowsError"
            ><div class="rounded-xl border border-rose-200 bg-rose-50 p-6 text-center" role="alert">
              <h2 class="font-semibold text-rose-900">Could not load workflows</h2>
              <p class="mt-2 text-sm text-rose-800">Try again to check whether this workspace has any workflows.</p>
              <button
                type="button"
                on-click="retryWorkflows()"
                class="mt-4 rounded-lg border border-rose-300 px-4 py-2 text-sm font-medium text-rose-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-flow-primary/40"
              >
                Retry
              </button>
            </div></template
          >
          <template if="!workflowsLoading && !workflowsError && workflows.length === 0"
            ><div class="px-2 py-8 text-center sm:px-6 sm:py-10" aria-labelledby="first-workflow-title" role="region">
              <p class="text-sm font-semibold uppercase tracking-wide text-flow-primary">A fresh start</p>
              <h2 id="first-workflow-title" class="mt-3 text-2xl font-semibold">Create your first workflow</h2>
              <p class="mx-auto mt-2 max-w-lg text-sm leading-6 text-flow-secondary">
                Workflows define the steps your runner executes. Create one to get started, then your runs will appear
                here.
              </p>
              <a
                href="/ui/workflows/new"
                class="mt-6 mb-6 inline-flex rounded-lg bg-flow-primary px-5 py-3 text-sm font-semibold text-white hover:opacity-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-flow-primary/40"
                >Create workflow</a
              >
            </div></template
          >
          <template if="workflowsLoading"
            ><p class="p-8 text-center text-sm text-flow-secondary" role="status">Loading workflows…</p></template
          >
          <template if="!workflowsLoading && !workflowsError && workflows.length > 0">
            <form
              class="grid min-w-0 grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-[minmax(0,1fr)_12rem_12rem_auto]"
              on-submit.prevent="applyFilter()"
            >
              <label class="sr-only" for="job-filter">Search runs</label>
              <input
                id="job-filter"
                bind-value="filter"
                on-input="setFilter($event)"
                class="w-full min-w-0 max-w-full rounded-lg border border-flow-border bg-white px-3 py-2 text-sm outline-none focus:border-flow-primary"
                placeholder="Search runs, workflows, or workers"
              />
              <label class="sr-only" for="workflow-filter">Workflow</label>
              <select
                id="workflow-filter"
                bind-value="workflowFilter"
                on-change="setWorkflowFilter($event)"
                class="w-full min-w-0 max-w-full rounded-lg border border-flow-border bg-white px-3 py-2 text-sm"
              >
                <option value="">All workflows</option>
                <template for="workflow of workflows"
                  ><option attr-value="workflow.id">{{ workflow.name }}</option></template
                >
              </select>
              <label class="sr-only" for="worker-filter">Worker</label>
              <select
                id="worker-filter"
                bind-value="workerFilter"
                on-change="setWorkerFilter($event)"
                class="w-full min-w-0 max-w-full rounded-lg border border-flow-border bg-white px-3 py-2 text-sm"
              >
                <option value="">All workers</option>
                <template for="worker of workers"><option attr-value="worker.id">{{ worker.name }}</option></template>
              </select>
              <button type="submit" class="rounded-lg bg-flow-primary px-4 py-2 text-sm font-medium text-white">
                Search
              </button>
            </form>
            <nav class="flex flex-wrap gap-2" aria-label="Filter runs by status">
              <template for="tab of statusTabs()"
                ><button
                  type="button"
                  on-click="setStatusFilter(tab.status)"
                  attr-aria-pressed="tab.isActive ? 'true' : 'false'"
                  class="relative rounded-full border border-flow-border bg-white px-3 py-1.5 text-sm text-flow-secondary transition-colors hover:bg-flow-panel hover:text-flow-primary aria-[pressed=true]:border-flow-primary aria-[pressed=true]:bg-flow-primary aria-[pressed=true]:text-white aria-[pressed=true]:shadow-sm"
                  attr-aria-label="'Filter by ' + tab.label + ' (' + tab.count + ')'"
                >
                  {{ tab.label }}
                  <span
                    class="ml-2 inline-flex items-center gap-1 rounded-full bg-flow-panel px-2 py-0.5 text-xs text-flow-foreground [[aria-pressed=true]_&]:bg-white/20 [[aria-pressed=true]_&]:text-white"
                    ><span>{{ tab.count }}</span></span
                  >
                </button></template
              >
            </nav>
            <div
              class="min-w-0 max-w-full overflow-x-auto focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-flow-primary"
              role="region"
              aria-label="Runs table"
              tabindex="0"
            >
              <table class="w-full min-w-[680px] text-left text-sm">
                <thead class="border-b border-flow-border text-xs text-flow-secondary">
                  <tr>
                    <th class="px-3 py-3 font-medium">Workflow</th>
                    <th class="px-3 py-3 font-medium">Status</th>
                    <th class="px-3 py-3 font-medium">Worker / queued</th>
                    <th class="px-3 py-3 font-medium">Created</th>
                    <th class="px-3 py-3 font-medium">Updated</th>
                  </tr>
                </thead>
                <tbody>
                  <template for="job of visibleJobs()"
                    ><tr class="border-b border-flow-border last:border-0 hover:bg-flow-panel">
                      <td class="px-3 py-3">
                        <a
                          attr-href="'/ui/runs/' + job.id"
                          class="font-medium text-flow-foreground hover:underline [overflow-wrap:anywhere]"
                          >{{ workflowName(job.workflowId) }}</a
                        >
                      </td>
                      <td class="px-3 py-3">
                        <span
                          class="inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs font-semibold"
                          bind-class="statusClass(job.status)"
                          role="status"
                          ><lucide-icon
                            bind-icon="statusIcon(job.status)"
                            bind-class="job.status === 'running' ? 'animate-spin' : ''"
                            size="14"
                          ></lucide-icon
                          ><span>{{ job.statusLabel }}</span></span
                        >
                      </td>
                      <td class="px-3 py-3 text-flow-secondary">{{ job.workerName || job.workerId || 'Queued' }}</td>
                      <td class="px-3 py-3 text-flow-secondary">{{ formatDate(job.createdAt) }}</td>
                      <td class="px-3 py-3 text-flow-secondary">{{ formatDate(job.updatedAt) }}</td>
                    </tr></template
                  >
                </tbody>
              </table>
              <template if="visibleJobs().length === 0"
                ><p class="p-8 text-center text-sm text-flow-secondary">No runs match these filters.</p></template
              >
            </div>
            <div class="flex items-center justify-between gap-3 border-t border-flow-border pt-3">
              <button
                type="button"
                on-click="previousPage()"
                bind-disabled="page <= 1"
                aria-label="Previous runs"
                class="rounded-lg border border-flow-border bg-white px-3 py-2 text-sm text-flow-foreground disabled:opacity-50"
              >
                Previous
              </button>
              <span class="text-xs text-flow-secondary">Page {{ page }}</span>
              <button
                type="button"
                on-click="nextPage()"
                bind-disabled="!hasNextPage() || loadingMore"
                aria-label="Next runs"
                class="rounded-lg border border-flow-border bg-white px-3 py-2 text-sm text-flow-foreground disabled:opacity-50"
              >
                {{ loadingMore ? 'Loading…' : 'Next' }}
              </button>
            </div>
          </template>
        </section>
      </main>
      <script setup src="/assets/dashboard.mjs"></script>
    </template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
