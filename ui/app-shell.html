<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef2ec" />
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/on.css" />
    <script type="importmap">
      {
        "imports": {
          "@app/": "/assets/",
          "@li3/": "https://at-li3.static.apphor.de/",
          "ansi_up": "https://esm.sh/ansi_up@6.0.6",
          "diff": "https://unpkg.com/diff@9.0.0/libesm/index.js",
          "marked": "https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.esm.js",
          "yaml": "https://esm.sh/yaml@2.9.0"
        }
      }
    </script>
    <link rel="component" href="/assets/app-router.html" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <title>on: · Runs</title>
  </head>
  <body data-teamless="checking" class="min-h-dvh bg-app-background font-sans text-app-foreground">
    <template app>
      <a
        href="#main-content"
        data-skip-to-content
        class="sr-only z-50 rounded-md bg-app-foreground px-4 py-2 text-white focus:not-sr-only focus:fixed focus:left-4 focus:top-4"
      >
        Skip to content
      </a>
      <div data-app-layout class="min-h-dvh md:grid md:grid-cols-[16rem_minmax(0,1fr)]">
        <template if="mobileMenuOpen"
          ><button
            type="button"
            class="fixed inset-0 z-40 bg-black/45 md:hidden"
            aria-label="Close navigation menu"
            on-click="closeMobileMenu()"
          ></button
        ></template>
        <aside
          id="primary-sidebar"
          bind-class="mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'"
          class="fixed inset-y-0 left-0 z-50 flex h-dvh w-72 -translate-x-full flex-col overflow-y-auto border-r border-app-border bg-app-sidebar px-3 py-5 shadow-xl transition-transform duration-200 md:sticky md:z-auto md:w-auto md:translate-x-0 md:border-0 md:shadow-none"
          aria-label="Primary navigation"
        >
          <a
            href="/ui/workspaces"
            on-click="setActive('workspaces')"
            class="mb-8 flex items-center gap-3 rounded-lg p-2 text-app-foreground no-underline outline-none focus-visible:ring-2 focus-visible:ring-app-primary"
            aria-label="on: home"
          >
            <span
              class="mr-0.5 flex h-[34px] w-[31px] -skew-y-[13deg] flex-col justify-center gap-[5px]"
              aria-hidden="true"
              ><i class="block h-[5px] w-[27px] rounded-[2px] bg-[#547d42]"></i
              ><i class="block h-[5px] w-5 rounded-[2px] bg-[#547d42]"></i
              ><i class="block h-[5px] w-[13px] rounded-[2px] bg-[#547d42]"></i
            ></span>
            <span class="text-[33px] font-bold leading-none tracking-[-1.9px] text-app-foreground"
              >on<span class="text-[#729b5b]">:</span></span
            >
          </a>
          <nav class="space-y-1">
            <a
              href="/ui/workspaces"
              on-click="setActive('workspaces')"
              attr-aria-current="activeSection === 'workspaces' ? 'page' : null"
              class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary"
              ><lucide-icon icon="users" size="17"></lucide-icon>Workspaces</a
            >
            <a
              href="/ui/recipes"
              on-click="setActive('recipes')"
              attr-aria-current="activeSection === 'recipes' ? 'page' : null"
              class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary"
              ><lucide-icon icon="book-open" size="17"></lucide-icon>Recipes</a
            >
          </nav>
          <div class="my-4 border-t border-app-border"></div>
          <nav aria-label="Workspace navigation" class="mt-3 space-y-1">
            <p class="px-3 pt-2 text-[10px] font-semibold uppercase tracking-wider text-app-muted">Your workspaces</p>
            <template for="team of teams"
              ><div attr-data-workspace-nav-item="team.id">
                <a
                  attr-href="workspacePath(team.id, 'runs')"
                  on-click="selectWorkspace(team.id)"
                  class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary"
                  attr-aria-current="selectedWorkspaceId === team.id && activeSection === 'workspace-runs' ? 'page' : null"
                  ># {{ team.name }}</a
                >
                <div
                  data-workspace-submenu
                  class-hidden="selectedWorkspaceId !== team.id"
                  class="ml-5 space-y-1 border-l border-app-border pl-2"
                >
                  <a
                    attr-href="workspacePath(team.id, 'workflows')"
                    on-click="selectWorkspace(team.id, 'workflows')"
                    class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:font-semibold aria-[current=page]:text-app-primary"
                    attr-aria-current="activeSection === 'workspace-workflows' ? 'page' : null"
                    ><lucide-icon icon="workflow" size="15"></lucide-icon>Workflows</a
                  >
                  <a
                    attr-href="workspacePath(team.id, 'runs')"
                    on-click="selectWorkspace(team.id, 'runs')"
                    class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:font-semibold aria-[current=page]:text-app-primary"
                    attr-aria-current="activeSection === 'workspace-runs' ? 'page' : null"
                    ><lucide-icon icon="activity" size="15"></lucide-icon>Runs</a
                  >
                </div>
              </div></template
            >
          </nav>
        </aside>
        <div class="min-h-dvh min-w-0">
          <header class="flex items-center gap-2 px-4 pt-4 sm:gap-4 sm:px-6 lg:px-8">
            <button
              type="button"
              data-mobile-menu-button
              class="grid size-10 place-items-center rounded-lg border border-app-border bg-app-card text-app-foreground outline-none focus-visible:ring-2 focus-visible:ring-app-primary md:hidden"
              aria-label="Open navigation menu"
              aria-controls="primary-sidebar"
              attr-aria-expanded="mobileMenuOpen ? 'true' : 'false'"
              on-click="toggleMobileMenu()"
            >
              <lucide-icon icon="menu" size="20" aria-hidden="true"></lucide-icon>
            </button>
            <template if="userAuthenticated"
              ><div class="ml-auto flex shrink-0 items-center gap-2 sm:gap-4">
                <button
                  type="button"
                  on-click="toggleTheme()"
                  attr-aria-label="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
                  attr-title="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
                  class="grid size-10 place-items-center rounded-full border border-app-border bg-app-card text-app-foreground shadow-sm outline-none transition hover:shadow-md focus-visible:ring-2 focus-visible:ring-app-primary"
                >
                  <lucide-icon bind-icon="isDarkTheme ? 'sun' : 'moon'" size="19" aria-hidden="true"></lucide-icon>
                </button>
                <a
                  href="/ui/settings"
                  class="flex min-w-0 max-w-[calc(100vw-4rem)] items-center gap-3 rounded-full outline-none focus-visible:ring-2 focus-visible:ring-app-primary sm:gap-4 sm:border sm:border-gray-200 sm:bg-white sm:px-1.5 sm:py-1.5 sm:shadow-sm sm:transition-shadow sm:hover:shadow-md sm:max-w-none sm:pr-4 dark:sm:border-[#303d34] dark:sm:bg-[#18231b]"
                  attr-aria-label="'Open preferences for ' + (user.name || user.email)"
                >
                  <div
                    class="relative grid size-8 shrink-0 place-items-center overflow-hidden rounded-full bg-app-primary text-sm font-bold text-white"
                  >
                    <img
                      attr-src="user.photo || user.picture || null"
                      referrerpolicy="no-referrer"
                      alt=""
                      class="absolute inset-0 size-full object-cover"
                    />
                    <span aria-hidden="true" attr-class="(user.photo || user.picture) ? 'hidden' : ''"
                      >{{ userInitial }}</span
                    >
                  </div>
                  <span
                    class="hidden min-w-0 max-w-[calc(100vw-7rem)] flex-col justify-center text-app-foreground no-underline outline-none focus-visible:ring-2 focus-visible:ring-app-primary sm:flex sm:max-w-none"
                  >
                    <span class="truncate text-sm font-semibold leading-tight">{{ user.name || user.email }}</span>
                    <span class="truncate text-[10px] leading-tight text-app-secondary">{{ user.email }}</span>
                  </span>
                </a>
              </div></template
            >
          </header>
          <div id="main-content" tabindex="-1" class="min-h-full min-w-0 p-4 sm:p-6 lg:p-8">
            <app-router></app-router>
          </div>
        </div>
      </div>
      <script setup src="/assets/app-shell.mjs"></script>
    </template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
