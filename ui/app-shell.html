<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef2ec" />
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/on.css" />
    <script type="importmap">
      {
        "imports": {
          "@app/": "/assets/",
          "@li3/": "https://at-li3.static.apphor.de/",
          "ansi_up": "https://esm.sh/ansi_up@6.0.6",
          "diff": "https://unpkg.com/diff@9.0.0/libesm/index.js",
          "marked": "https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.esm.js",
          "yaml": "https://esm.sh/yaml@2.9.0"
        }
      }
    </script>
    <link rel="component" href="/assets/app-router.html" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <title>on: · Runs</title>
  </head>
  <body data-teamless="checking" class="min-h-dvh bg-app-background font-sans text-app-foreground">
    <template app>
      <a
        href="#main-content"
        data-skip-to-content
        class="sr-only z-50 rounded-md bg-app-foreground px-4 py-2 text-white focus:not-sr-only focus:fixed focus:left-4 focus:top-4"
      >
        Skip to content
      </a>
      <div
        data-app-layout
        class="min-h-dvh grid grid-rows-[auto_1fr] grid-cols-[4rem_minmax(0,1fr)] md:grid-rows-1 md:grid-cols-[4rem_14rem_minmax(0,1fr)]"
      >
        <aside
          data-workspace-rail
          aria-label="Workspace switcher"
          class="row-span-2 flex min-h-dvh w-16 flex-col items-center gap-3 border-r border-app-border bg-app-sidebar px-2 py-4 md:row-span-1 md:sticky md:top-0 md:h-dvh"
        >
          <a
            href="/ui/workspaces"
            aria-label="on: home"
            class="mb-1 grid size-10 place-items-center rounded-lg text-app-foreground no-underline focus-visible:ring-2 focus-visible:ring-app-primary"
          >
            <span class="flex h-[30px] w-[27px] -skew-y-[13deg] flex-col justify-center gap-[4px]" aria-hidden="true"
              ><i class="block h-[5px] w-[27px] rounded-[2px] bg-[#547d42]"></i
              ><i class="block h-[5px] w-5 rounded-[2px] bg-[#547d42]"></i
              ><i class="block h-[5px] w-[13px] rounded-[2px] bg-[#547d42]"></i
            ></span>
          </a>
          <div role="group" aria-label="Switch workspace" class="flex flex-col items-center gap-2">
            <template for="team of teams"
              ><button
                type="button"
                attr-aria-label="'Switch to ' + team.name"
                attr-aria-pressed="selectedWorkspaceId === team.id ? 'true' : 'false'"
                attr-title="team.name"
                on-click="switchWorkspace(team.id)"
                class="grid size-10 shrink-0 place-items-center rounded-xl border border-app-border bg-app-card font-semibold text-app-primary outline-none hover:bg-white focus-visible:ring-2 focus-visible:ring-app-primary aria-pressed:border-app-primary aria-pressed:ring-2 aria-pressed:ring-app-primary"
                attr-data-workspace-switch="team.id"
              >
                {{ workspaceInitial(team.name) }}
              </button></template
            >
          </div>
        </aside>
        <aside
          id="primary-sidebar"
          class="col-start-2 row-start-1 flex min-w-0 items-center gap-1 overflow-x-auto border-b border-app-border bg-app-sidebar px-2 py-2 md:col-start-2 md:row-span-1 md:flex-col md:items-stretch md:gap-0 md:overflow-y-auto md:border-b-0 md:border-r md:sticky md:top-0 md:h-dvh md:w-56 md:px-3 md:py-5"
          aria-label="Primary navigation"
        >
          <nav
            aria-label="Global navigation"
            class="flex shrink-0 items-center gap-1 md:flex-col md:items-stretch md:gap-1"
          >
            <a
              href="/ui/workspaces"
              on-click="setActive('workspaces')"
              attr-aria-current="activeSection === 'workspaces' ? 'page' : null"
              class="flex min-h-10 shrink-0 items-center gap-2 whitespace-nowrap rounded-lg px-2 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary md:px-3"
              ><lucide-icon icon="users" size="17"></lucide-icon>Workspaces</a
            >
            <a
              href="/ui/recipes"
              on-click="setActive('recipes')"
              attr-aria-current="activeSection === 'recipes' ? 'page' : null"
              class="flex min-h-10 shrink-0 items-center gap-2 whitespace-nowrap rounded-lg px-2 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary md:px-3"
              ><lucide-icon icon="book-open" size="17"></lucide-icon>Recipes</a
            >
          </nav>
          <div class="hidden border-t border-app-border md:my-4 md:block"></div>
          <nav
            aria-label="Workspace navigation"
            class="flex min-w-0 items-center gap-1 md:mt-1 md:flex-col md:items-stretch md:gap-1"
          >
            <template for="team of teams"
              ><template if="selectedWorkspaceId === team.id"
                ><span class="hidden truncate px-3 py-2 text-sm font-semibold text-app-foreground md:block"
                  >{{ team.name }}</span
                ><a
                  attr-href="workspacePath(team.id, 'workflows')"
                  on-click="selectWorkspace(team.id, 'workflows')"
                  class="flex min-h-10 shrink-0 items-center gap-2 whitespace-nowrap rounded-lg px-2 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary md:px-3"
                  attr-aria-current="activeSection === 'workspace-workflows' ? 'page' : null"
                  ><lucide-icon icon="workflow" size="15"></lucide-icon>Workflows</a
                >
                <a
                  attr-href="workspacePath(team.id, 'runs')"
                  on-click="selectWorkspace(team.id, 'runs')"
                  class="flex min-h-10 shrink-0 items-center gap-2 whitespace-nowrap rounded-lg px-2 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary md:px-3"
                  attr-aria-current="activeSection === 'workspace-runs' ? 'page' : null"
                  ><lucide-icon icon="activity" size="15"></lucide-icon>Runs</a
                >
                <template for="channel of workspaceChannels"
                  ><a
                    attr-href="workspacePath(team.id, 'channels') + '/' + encodeURIComponent(channel.id)"
                    class="flex min-h-10 shrink-0 items-center gap-2 whitespace-nowrap rounded-lg px-2 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary md:px-3"
                    attr-aria-current="selectedChannelId === channel.id ? 'page' : null"
                    attr-title="channel.name"
                    ><lucide-icon icon="messages-square" size="15"></lucide-icon>{{ channel.name }}</a
                  ></template
                >
                <p role="status" class="px-3 py-2 text-xs text-app-secondary">{{ channelsStatus }}</p></template
              ></template
            >
          </nav>
        </aside>
        <div
          class="col-start-2 row-start-2 min-h-dvh min-w-0 bg-app-card md:col-start-3 md:row-start-1 md:rounded-tl-xl"
        >
          <header class="flex items-center gap-2 px-4 pt-4 sm:gap-4 sm:px-6 lg:px-8">
            <button
              type="button"
              data-quick-switch-open
              class="min-h-10 min-w-0 flex-1 rounded-lg border border-app-border bg-app-card px-3 text-left text-sm text-app-secondary outline-none focus-visible:ring-2 focus-visible:ring-app-primary sm:max-w-md"
              on-click="openQuickSwitch()"
              aria-keyshortcuts="Meta+K Control+K"
            >
              <span class="truncate">Search workspaces, streams, routes…</span
              ><kbd class="float-right ml-2 rounded border border-app-border px-1.5 text-xs">⌘K</kbd>
            </button>
            <template if="userAuthenticated"
              ><div class="ml-auto flex shrink-0 items-center gap-2 sm:gap-4">
                <button
                  type="button"
                  on-click="toggleTheme()"
                  attr-aria-label="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
                  attr-title="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
                  class="grid size-10 place-items-center rounded-full border border-app-border bg-app-card text-app-foreground shadow-sm outline-none transition hover:shadow-md focus-visible:ring-2 focus-visible:ring-app-primary"
                >
                  <lucide-icon bind-icon="isDarkTheme ? 'sun' : 'moon'" size="19" aria-hidden="true"></lucide-icon>
                </button>
                <a
                  href="/ui/settings"
                  class="flex min-w-0 max-w-[calc(100vw-4rem)] items-center gap-3 rounded-full outline-none focus-visible:ring-2 focus-visible:ring-app-primary sm:gap-4 sm:border sm:border-gray-200 sm:bg-white sm:px-1.5 sm:py-1.5 sm:shadow-sm sm:transition-shadow sm:hover:shadow-md sm:max-w-none sm:pr-4 dark:sm:border-[#303d34] dark:sm:bg-[#18231b]"
                  attr-aria-label="'Open preferences for ' + (user.name || user.email)"
                >
                  <div
                    class="relative grid size-8 shrink-0 place-items-center overflow-hidden rounded-full bg-app-primary text-sm font-bold text-white"
                  >
                    <template if="user.photo || user.picture"
                      ><img
                        attr-src="user.photo || user.picture"
                        referrerpolicy="no-referrer"
                        alt=""
                        class="absolute inset-0 size-full object-cover"
                    /></template>
                    <span aria-hidden="true" attr-class="(user.photo || user.picture) ? 'hidden' : ''"
                      >{{ userInitial }}</span
                    >
                  </div>
                  <span
                    class="hidden min-w-0 max-w-[calc(100vw-7rem)] flex-col justify-center text-app-foreground no-underline outline-none focus-visible:ring-2 focus-visible:ring-app-primary sm:flex sm:max-w-none"
                  >
                    <span class="truncate text-sm font-semibold leading-tight">{{ user.name || user.email }}</span>
                    <span class="truncate text-[10px] leading-tight text-app-secondary">{{ user.email }}</span>
                  </span>
                </a>
              </div></template
            >
          </header>
          <template if="quickSwitchOpen"
            ><div
              class="fixed inset-0 z-[70] grid place-items-start bg-black/50 p-4 pt-[12vh]"
              data-quick-switch-overlay
              on-click="closeQuickSwitch()"
            >
              <section
                role="dialog"
                aria-modal="true"
                aria-labelledby="quick-switch-title"
                class="mx-auto w-full max-w-xl rounded-xl border border-app-border bg-app-card p-4 shadow-2xl"
                on-click="stopQuickSwitchClick(event)"
              >
                <h2 id="quick-switch-title" class="mb-3 text-lg font-semibold">Quick switch</h2>
                <label class="sr-only" for="quick-switch-search">Search workspaces, streams, and routes</label
                ><input
                  id="quick-switch-search"
                  data-quick-switch-search
                  type="search"
                  autocomplete="off"
                  placeholder="Search workspaces, streams, and routes…"
                  class="w-full rounded-lg border border-app-border px-3 py-3 outline-none focus-visible:ring-2 focus-visible:ring-app-primary"
                  on-input="filterQuickSwitch(event.target.value)"
                />
                <div
                  data-quick-switch-results
                  role="group"
                  aria-label="Navigation results"
                  class="mt-3 max-h-[55vh] space-y-1 overflow-y-auto"
                >
                  <template for="item of quickSwitchItems"
                    ><button
                      type="button"
                      role="option"
                      attr-data-quick-switch-index="item.index"
                      class="flex min-h-11 w-full items-center justify-between rounded-lg px-3 text-left text-sm hover:bg-app-panel focus-visible:ring-2 focus-visible:ring-app-primary"
                      on-click="selectQuickSwitchItem(item)"
                    >
                      <span>{{ item.label }}</span>
                      <span class="text-xs text-app-secondary">{{ item.type }}</span>
                    </button></template
                  >
                  <template if="quickSwitchItems.length === 0"
                    ><p class="px-3 py-4 text-sm text-app-secondary">No matching destinations.</p></template
                  >
                </div>
                <p class="mt-3 text-xs text-app-secondary">Use ↑ and ↓ to move, Enter to open, Esc to close.</p>
              </section>
            </div></template
          >
          <div id="main-content" tabindex="-1" class="min-h-full min-w-0 p-4 sm:p-6 lg:p-8">
            <template if="activeSection === 'workspace-channels'"
              ><p
                class="mb-4 rounded-lg border border-app-border bg-app-card px-4 py-3 text-sm text-app-secondary"
                role="note"
              >
                Streams currently use the legacy Channels experience. Messages are not yet modeled as Threads;
                thread-level selection is not available.
              </p></template
            >
            <app-router></app-router>
          </div>
        </div>
      </div>
      <script setup src="/assets/app-shell.mjs"></script>
    </template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
