<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef2ec" />
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/on.css" />
    <script type="importmap">
      {
        "imports": {
          "@app/": "/assets/",
          "@li3/": "https://at-li3.static.apphor.de/",
          "ansi_up": "https://esm.sh/ansi_up@6.0.6",
          "diff": "https://unpkg.com/diff@9.0.0/libesm/index.js",
          "marked": "https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.esm.js",
          "yaml": "https://esm.sh/yaml@2.9.0"
        }
      }
    </script>
    <link rel="component" href="/assets/app-router.html" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <title>dimon · Runs</title>
  </head>
  <body data-teamless="checking" class="min-h-dvh bg-app-background font-sans text-app-foreground">
    <template app>
      <a
        href="#main-content"
        data-skip-to-content
        class="sr-only z-50 rounded-md bg-app-foreground px-4 py-2 text-white focus:not-sr-only focus:fixed focus:left-4 focus:top-4"
      >
        Skip to content
      </a>
      <div
        data-app-layout
        class="h-dvh grid grid-rows-[auto_minmax(0,1fr)] grid-cols-[4rem_minmax(0,1fr)] md:grid-rows-1 md:grid-cols-[4rem_14rem_minmax(0,1fr)]"
      >
        <aside
          data-workspace-rail
          aria-label="Workspace switcher"
          class="workspace-rail relative z-20 row-span-2 flex min-h-dvh w-16 flex-col items-center gap-3 border-r border-app-border bg-app-background px-2 py-4 md:row-span-1 md:sticky md:top-0 md:h-dvh"
        >
          <button
            type="button"
            aria-label="Toggle workspace rail"
            attr-aria-expanded="workspaceRailExpanded ? 'true' : 'false'"
            on-click="toggleWorkspaceRail()"
            class="brand-toggle mb-1 flex min-h-10 w-max items-center gap-3 rounded-lg text-app-foreground outline-none focus-visible:ring-2 focus-visible:ring-app-primary"
          >
            <span
              class="ml-2 flex h-[30px] w-[27px] -skew-y-[13deg] flex-col justify-center gap-[4px]"
              aria-hidden="true"
              ><i class="block h-[5px] w-[27px] rounded-[2px] bg-[#547d42]"></i
              ><i class="block h-[5px] w-5 rounded-[2px] bg-[#547d42]"></i
              ><i class="block h-[5px] w-[13px] rounded-[2px] bg-[#547d42]"></i></span
            ><span class="rail-label">dimon<span class="text-app-primary">.</span></span>
          </button>
          <div role="group" aria-label="Switch workspace" class="flex flex-col items-center gap-2">
            <template for="team of teams"
              ><button
                type="button"
                attr-aria-label="team.name"
                attr-aria-pressed="team.isSelected ? 'true' : 'false'"
                attr-aria-describedby="'workspace-name-' + team.id"
                on-pointerenter="showWorkspacePopover(team.name, $event.currentTarget)"
                on-pointerleave="hideWorkspacePopover($event.currentTarget)"
                on-focus="showWorkspacePopover(team.name, $event.currentTarget)"
                on-blur="hideWorkspacePopover($event.currentTarget)"
                on-click="switchWorkspace(team.id)"
                class="workspace-switch flex h-12 min-h-12 w-10 min-w-0 shrink-0 items-center gap-2 overflow-hidden rounded-full border border-app-border bg-app-card p-1 text-left font-semibold text-app-primary outline-none hover:bg-white focus-visible:ring-2 focus-visible:ring-app-primary aria-pressed:border-app-primary aria-pressed:ring-2 aria-pressed:ring-app-primary"
                attr-data-workspace-switch="team.id"
              >
                <span
                  class="workspace-avatar ml-0.5 grid size-8 shrink-0 place-items-center rounded-full bg-app-panel text-app-primary shadow-sm"
                  ><template if="team.logoUrl"
                    ><img
                      attr-src="'/api/v1/workspaces/' + encodeURIComponent(team.id) + '/logo'"
                      attr-alt="team.name + ' logo'"
                      class="size-full rounded-full object-cover"
                  /></template>
                  <span class-hidden="team.logoUrl">{{ workspaceInitial(team.name) }}</span></span
                ><span class="workspace-name min-w-0 flex-1 overflow-hidden text-ellipsis whitespace-nowrap"
                  >{{ team.name }}</span
                >
              </button>
              <div
                popover="manual"
                attr-data-workspace-popover="team.id"
                attr-id="'workspace-name-' + team.id"
                role="tooltip"
                class="pointer-events-none fixed inset-auto z-50 m-0 max-w-[calc(100vw-5rem)] rounded-md border-0 bg-white px-3 py-2 text-sm font-medium text-gray-900 shadow-lg"
              >
                {{ team.name }}
              </div></template
            >
          </div>
          <template if="userAuthenticated"
            ><div class="user-card mt-auto flex w-full flex-col items-center gap-2 pt-3">
              <button
                type="button"
                on-click="toggleTheme()"
                attr-aria-label="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
                attr-title="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
                class="grid size-10 shrink-0 place-items-center rounded-sm border border-app-border bg-app-card text-app-foreground outline-none transition hover:bg-white/70 focus-visible:ring-2 focus-visible:ring-app-primary"
              >
                <lucide-icon bind-icon="isDarkTheme ? 'sun' : 'moon'" size="19" aria-hidden="true"></lucide-icon>
              </button>
              <a
                href="/ui/settings"
                aria-label="Open preferences"
                title="Preferences"
                class="user-avatar flex h-12 min-h-12 w-full min-w-0 shrink-0 items-center gap-2 overflow-hidden rounded-full border border-app-border bg-app-card p-1 text-left text-sm font-bold text-white outline-none focus-visible:ring-2 focus-visible:ring-app-primary"
              >
                <span
                  class="user-photo grid size-10 shrink-0 place-items-center overflow-hidden rounded-full bg-app-primary text-sm font-bold text-white"
                >
                  <template if="user.photo || user.picture"
                    ><img
                      attr-src="user.photo || user.picture"
                      referrerpolicy="no-referrer"
                      alt=""
                      class="size-full object-cover"
                  /></template>
                  <span aria-hidden="true" attr-class="(user.photo || user.picture) ? 'hidden' : ''"
                    >{{ userInitial }}</span
                  >
                </span>
                <span class="user-details min-w-0 flex-1 overflow-hidden"
                  ><span class="block truncate">{{ user.name }}</span
                  ><span class="block truncate text-xs font-normal opacity-80">{{ user.email }}</span></span
                >
              </a>
            </div></template
          >
        </aside>
        <aside
          id="primary-sidebar"
          class="col-start-2 row-start-1 flex max-h-[40dvh] min-w-0 flex-col items-stretch gap-2 overflow-y-auto border-b border-app-border px-2 py-2 md:col-start-2 md:row-span-1 md:max-h-dvh md:gap-0 md:border-b-0 md:sticky md:top-0 md:h-dvh md:w-56 md:px-3 md:py-5"
          aria-label="Primary navigation"
        >
          <nav
            aria-label="Global navigation"
            class="flex min-w-0 flex-wrap items-center gap-1 md:flex-col md:flex-nowrap md:items-stretch md:gap-1"
          >
            <a
              href="/ui/workspaces"
              on-click="setActive('workspaces')"
              attr-aria-current="activeSection === 'workspaces' ? 'page' : null"
              class="flex min-h-10 shrink-0 items-center gap-2 whitespace-nowrap rounded-full px-2 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary md:px-3"
              ><lucide-icon icon="users" size="17"></lucide-icon>Workspaces</a
            >
            <a
              href="/ui/recipes"
              on-click="setActive('recipes')"
              attr-aria-current="activeSection === 'recipes' ? 'page' : null"
              class="flex min-h-10 shrink-0 items-center gap-2 whitespace-nowrap rounded-full px-2 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary md:px-3"
              ><lucide-icon icon="book-open" size="17"></lucide-icon>Recipes</a
            >
          </nav>
          <div class="hidden shrink-0 border-t border-app-border md:my-4 md:block"></div>
          <nav
            aria-label="Workspace navigation"
            class="flex min-w-0 flex-wrap items-center gap-1 md:mt-1 md:flex-col md:flex-nowrap md:items-stretch md:gap-1"
          >
            <template for="team of teams"
              ><template if="team.isSelected"
                ><span
                  class="basis-full truncate px-3 py-1 text-sm font-semibold text-app-foreground md:basis-auto md:py-2"
                  >{{ team.name }}</span
                ><a
                  attr-href="workspacePath(team.id, 'workflows')"
                  on-click="selectWorkspace(team.id, 'workflows')"
                  class="flex min-h-10 shrink-0 items-center gap-2 whitespace-nowrap rounded-full px-2 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary md:px-3"
                  attr-aria-current="activeSection === 'workspace-workflows' ? 'page' : null"
                  ><lucide-icon icon="workflow" size="15"></lucide-icon>Workflows</a
                >
                <a
                  attr-href="workspacePath(team.id, 'runs')"
                  on-click="selectWorkspace(team.id, 'runs')"
                  class="flex min-h-10 shrink-0 items-center gap-2 whitespace-nowrap rounded-full px-2 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary md:px-3"
                  attr-aria-current="activeSection === 'workspace-runs' ? 'page' : null"
                  ><lucide-icon icon="activity" size="15"></lucide-icon>Runs</a
                >
                <span class="mt-3 basis-full px-3 pb-1 text-xs font-semibold text-app-secondary md:basis-auto"
                  >Streams</span
                >
                <template for="channel of workspaceChannels"
                  ><a
                    attr-href="workspacePath(team.id, 'channels') + '/' + encodeURIComponent(channel.id)"
                    class="flex min-h-10 min-w-0 max-w-full shrink-0 items-center gap-2 whitespace-nowrap rounded-full px-2 py-2 text-sm text-app-secondary no-underline outline-none hover:bg-white/70 hover:text-app-foreground focus-visible:ring-2 focus-visible:ring-app-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-app-primary md:px-3"
                    attr-aria-current="selectedChannelId === channel.id ? 'page' : null"
                    attr-title="channel.name"
                    ><lucide-icon class="shrink-0" icon="messages-square" size="15"></lucide-icon
                    ><span class="min-w-0 truncate">{{ channel.name }}</span></a
                  ></template
                >
                <template if="channelsEmpty"
                  ><a
                    attr-href="workspacePath(team.id, 'channels')"
                    class="flex min-h-10 shrink-0 items-center whitespace-nowrap rounded-full px-3 py-2 text-sm font-medium text-app-primary underline-offset-4 hover:underline focus-visible:ring-2 focus-visible:ring-app-primary"
                    >Create your first Stream</a
                  ></template
                ><template if="channelsStatus"
                  ><p role="status" class="px-3 py-2 text-xs text-app-secondary">{{ channelsStatus }}</p></template
                ></template
              ></template
            >
          </nav>
        </aside>
        <div
          class="col-start-2 row-start-2 grid min-h-0 min-w-0 grid-cols-[minmax(0,1fr)] grid-rows-[auto_minmax(0,1fr)] bg-app-background p-2 pt-0 sm:p-3 sm:pt-0 md:col-start-3 md:row-start-1 md:p-4 md:pt-0"
        >
          <header class="flex items-center gap-2 px-2 py-1 sm:gap-4 sm:px-3 md:px-4">
            <button
              type="button"
              data-quick-switch-open
              class="mx-auto flex min-h-10 w-full min-w-0 items-center gap-2 rounded-lg border border-app-border bg-app-card px-3 text-left text-sm text-app-secondary outline-none focus-visible:ring-2 focus-visible:ring-app-primary md:w-1/2"
              on-click="openQuickSwitch()"
              aria-keyshortcuts="Meta+K Control+K"
            >
              <span class="min-w-0 flex-1 truncate">Search workspaces, streams, routes…</span
              ><kbd class="ml-auto shrink-0 rounded border border-app-border px-1.5 text-xs">⌘K</kbd>
            </button>
          </header>
          <section class="max-h-full min-h-0 min-w-0 overflow-y-auto overscroll-y-auto rounded-2xl bg-app-card">
            <template if="quickSwitchOpen"
              ><div
                class="fixed inset-0 z-[70] grid place-items-start bg-black/50 p-4 pt-[12vh]"
                data-quick-switch-overlay
                on-click="closeQuickSwitch()"
              >
                <section
                  role="dialog"
                  aria-modal="true"
                  aria-labelledby="quick-switch-title"
                  class="mx-auto w-full max-w-xl rounded-xl border border-app-border bg-app-card p-4 shadow-2xl"
                  on-click="stopQuickSwitchClick(event)"
                >
                  <h2 id="quick-switch-title" class="mb-3 text-lg font-semibold">Quick switch</h2>
                  <label class="sr-only" for="quick-switch-search">Search workspaces, streams, and routes</label
                  ><input
                    id="quick-switch-search"
                    data-quick-switch-search
                    type="search"
                    autocomplete="off"
                    placeholder="Search workspaces, streams, and routes…"
                    class="w-full rounded-lg border border-app-border px-3 py-3 outline-none focus-visible:ring-2 focus-visible:ring-app-primary"
                    on-input="filterQuickSwitch(event.target.value)"
                  />
                  <div
                    data-quick-switch-results
                    role="group"
                    aria-label="Navigation results"
                    class="mt-3 max-h-[55vh] space-y-1 overflow-y-auto"
                  >
                    <template for="item of quickSwitchItems"
                      ><button
                        type="button"
                        role="option"
                        attr-data-quick-switch-index="item.index"
                        class="flex min-h-11 w-full items-center justify-between rounded-lg px-3 text-left text-sm hover:bg-app-panel focus-visible:ring-2 focus-visible:ring-app-primary"
                        on-click="selectQuickSwitchItem(item)"
                      >
                        <span>{{ item.label }}</span>
                        <span class="text-xs text-app-secondary">{{ item.type }}</span>
                      </button></template
                    >
                    <template if="quickSwitchItems.length === 0"
                      ><p class="px-3 py-4 text-sm text-app-secondary">No matching destinations.</p></template
                    >
                  </div>
                  <p class="mt-3 text-xs text-app-secondary">Use ↑ and ↓ to move, Enter to open, Esc to close.</p>
                </section>
              </div></template
            >
            <div id="main-content" tabindex="-1" class="min-h-full min-w-0 p-4 sm:p-6 lg:p-8">
              <app-router></app-router>
            </div>
          </section>
        </div>
      </div>
      <script setup src="/assets/app-shell.mjs"></script>
    </template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
