<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef2ec" />
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/on.css" />
    <script type="importmap">
      {
        "imports": {
          "@app/": "/assets/",
          "@li3/": "https://at-li3.static.apphor.de/",
          "ansi_up": "https://esm.sh/ansi_up@6.0.6",
          "diff": "https://unpkg.com/diff@9.0.0/libesm/index.js",
          "marked": "https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.esm.js"
        }
      }
    </script>
    <link rel="component" href="/assets/app-router.html" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <title>Flow · Runs</title>
  </head>
  <body data-teamless="checking" class="min-h-dvh bg-flow-background font-sans text-flow-foreground">
    <template app>
      <a
        href="#main-content"
        data-skip-to-content
        class="sr-only z-50 rounded-md bg-flow-foreground px-4 py-2 text-white focus:not-sr-only focus:fixed focus:left-4 focus:top-4"
      >
        Skip to content
      </a>
      <div data-app-layout class="min-h-dvh md:grid md:grid-cols-[16rem_minmax(0,1fr)]">
        <aside class="sticky top-0 hidden h-dvh self-start overflow-y-auto px-2 py-5 md:flex md:flex-col">
          <a
            href="/ui/workspaces"
            on-click="setActive('workspaces')"
            class="mb-8 flex items-center gap-3 rounded-lg p-2 text-flow-foreground no-underline outline-none focus-visible:ring-2 focus-visible:ring-flow-primary"
            aria-label="Flow home"
          >
            <span
              class="mr-0.5 flex h-[34px] w-[31px] -skew-y-[13deg] flex-col justify-center gap-[5px]"
              aria-hidden="true"
              ><i class="block h-[5px] w-[27px] rounded-[2px] bg-[#547d42]"></i
              ><i class="block h-[5px] w-5 rounded-[2px] bg-[#547d42]"></i
              ><i class="block h-[5px] w-[13px] rounded-[2px] bg-[#547d42]"></i
            ></span>
            <span class="text-[33px] font-bold leading-none tracking-[-1.9px] text-flow-foreground"
              >flow<span class="text-[#729b5b]">.</span></span
            >
          </a>
          <nav aria-label="Primary navigation" class="space-y-1">
            <a
              href="/ui/workspaces"
              on-click="setActive('workspaces')"
              attr-aria-current="activeSection === 'workspaces' ? 'page' : null"
              class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-flow-secondary no-underline outline-none hover:bg-white/70 hover:text-flow-foreground focus-visible:ring-2 focus-visible:ring-flow-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-flow-primary"
              ><lucide-icon icon="users" size="17"></lucide-icon>My workspaces</a
            >
            <a
              href="/ui/workflows"
              on-click="setActive('workflows')"
              attr-aria-current="activeSection === 'workflows' ? 'page' : null"
              class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-flow-secondary no-underline outline-none hover:bg-white/70 hover:text-flow-foreground focus-visible:ring-2 focus-visible:ring-flow-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-flow-primary"
              ><lucide-icon icon="workflow" size="17"></lucide-icon>Workflows</a
            >
            <a
              href="/ui/recipes"
              on-click="setActive('recipes')"
              attr-aria-current="activeSection === 'recipes' ? 'page' : null"
              class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-flow-secondary no-underline outline-none hover:bg-white/70 hover:text-flow-foreground focus-visible:ring-2 focus-visible:ring-flow-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-flow-primary"
              ><lucide-icon icon="book-open" size="17"></lucide-icon>Recipes</a
            >
            <a
              href="/ui/settings"
              on-click="setActive('settings')"
              attr-aria-current="activeSection === 'settings' ? 'page' : null"
              class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-flow-secondary no-underline outline-none hover:bg-white/70 hover:text-flow-foreground focus-visible:ring-2 focus-visible:ring-flow-primary aria-[current=page]:bg-white aria-[current=page]:font-semibold aria-[current=page]:text-flow-primary"
              ><lucide-icon icon="settings" size="17"></lucide-icon>Preferences</a
            >
          </nav>
          <div class="my-4 border-t border-flow-border"></div>
          <nav aria-label="Your workspaces" class="mt-3 space-y-1">
            <p class="px-3 pt-2 text-[10px] font-semibold uppercase tracking-wider text-flow-muted">Your workspaces</p>
            <template for="team of teams"
              ><a
                attr-href="'/ui/workspaces/' + encodeURIComponent(team.id) + '/runs'"
                on-click="selectWorkspace(team.id)"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-flow-secondary no-underline outline-none hover:bg-white/70 hover:text-flow-foreground focus-visible:ring-2 focus-visible:ring-flow-primary"
                attr-aria-current="activeSection === 'workspace-runs' && selectedWorkspaceId === team.id ? 'page' : null"
                ># {{ team.name }}</a
              ></template
            >
          </nav>
        </aside>
        <div class="min-h-dvh min-w-0 pb-20 md:pb-0">
          <header class="flex items-center justify-end gap-2 px-4 pt-4 sm:gap-4 sm:px-6 lg:px-8">
            <template if="userAuthenticated">
              <button
                type="button"
                on-click="toggleTheme()"
                attr-aria-label="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
                attr-title="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
                class="grid size-10 place-items-center rounded-full border border-flow-border bg-flow-card text-flow-foreground shadow-sm outline-none transition hover:shadow-md focus-visible:ring-2 focus-visible:ring-flow-primary"
              >
                <lucide-icon bind-icon="isDarkTheme ? 'sun' : 'moon'" size="19" aria-hidden="true"></lucide-icon>
              </button>
              <div
                class="flex min-w-0 max-w-[calc(100vw-4rem)] items-center sm:cursor-pointer sm:gap-4 sm:rounded-full sm:border sm:border-gray-200 sm:bg-white sm:px-1.5 sm:py-1.5 sm:shadow-sm sm:transition-shadow sm:hover:shadow-md sm:max-w-none sm:pr-4 dark:sm:border-[#303d34] dark:sm:bg-[#18231b]"
                role="group"
                aria-label="Signed-in user"
              >
                <div
                  class="relative grid size-8 shrink-0 place-items-center overflow-hidden rounded-full bg-flow-primary text-sm font-bold text-white"
                >
                  <img
                    attr-src="user.photo || user.picture || null"
                    referrerpolicy="no-referrer"
                    alt=""
                    class="absolute inset-0 size-full object-cover"
                  />
                  <span aria-hidden="true" attr-class="(user.photo || user.picture) ? 'hidden' : ''"
                    >{{ userInitial }}</span
                  >
                </div>
                <a
                  attr-href="oidcProviderUrl ? oidcProviderUrl + '/me' : null"
                  target="_blank"
                  rel="noopener"
                  class="hidden min-w-0 max-w-[calc(100vw-7rem)] flex-col justify-center text-flow-foreground no-underline outline-none focus-visible:ring-2 focus-visible:ring-flow-primary sm:flex sm:max-w-none"
                  aria-label="Open profile at identity provider in a new tab"
                >
                  <span class="truncate text-sm font-semibold leading-tight">{{ user.name || user.email }}</span>
                  <span class="truncate text-[10px] leading-tight text-flow-secondary">{{ user.email }}</span>
                </a>
              </div>
            </template>
          </header>
          <div id="main-content" tabindex="-1" class="min-h-full min-w-0 p-4 sm:p-6 lg:p-8">
            <app-router></app-router>
          </div>
        </div>
        <nav
          aria-label="Mobile navigation"
          class="fixed inset-x-0 bottom-0 z-50 grid grid-cols-4 border-t border-flow-border bg-flow-sidebar/95 px-2 pb-[calc(env(safe-area-inset-bottom)_+_0.5rem)] pt-2 backdrop-blur md:hidden"
        >
          <a
            href="/ui/workspaces"
            on-click="setActive('workspaces')"
            attr-aria-current="activeSection === 'workspaces' ? 'page' : null"
            class="flex min-h-12 flex-col items-center justify-center gap-1 rounded-lg text-xs text-flow-secondary no-underline outline-none focus-visible:ring-2 focus-visible:ring-flow-primary aria-[current=page]:font-semibold aria-[current=page]:text-flow-primary"
            ><lucide-icon icon="users" size="17"></lucide-icon>My workspaces</a
          >
          <a
            href="/ui/workflows"
            on-click="setActive('workflows')"
            attr-aria-current="activeSection === 'workflows' ? 'page' : null"
            class="flex min-h-12 flex-col items-center justify-center gap-1 rounded-lg text-xs text-flow-secondary no-underline outline-none focus-visible:ring-2 focus-visible:ring-flow-primary aria-[current=page]:font-semibold aria-[current=page]:text-flow-primary"
            ><lucide-icon icon="workflow" size="17"></lucide-icon>Workflows</a
          >
          <a
            href="/ui/recipes"
            on-click="setActive('recipes')"
            attr-aria-current="activeSection === 'recipes' ? 'page' : null"
            class="flex min-h-12 flex-col items-center justify-center gap-1 rounded-lg text-xs text-flow-secondary no-underline outline-none focus-visible:ring-2 focus-visible:ring-flow-primary aria-[current=page]:font-semibold aria-[current=page]:text-flow-primary"
            ><lucide-icon icon="book-open" size="17"></lucide-icon>Recipes</a
          >
          <a
            href="/ui/settings"
            on-click="setActive('settings')"
            attr-aria-current="activeSection === 'settings' ? 'page' : null"
            class="flex min-h-12 flex-col items-center justify-center gap-1 rounded-lg text-xs text-flow-secondary no-underline outline-none focus-visible:ring-2 focus-visible:ring-flow-primary aria-[current=page]:font-semibold aria-[current=page]:text-flow-primary"
            ><lucide-icon icon="settings" size="17"></lucide-icon>Preferences</a
          >
        </nav>
      </div>
      <script setup src="/assets/app-shell.mjs"></script>
    </template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
