<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team settings</title>
    <script type="importmap">
      { "imports": { "@app/": "/", "@li3/": "https://at-li3.static.apphor.de/" } }
    </script>
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <link rel="stylesheet" href="/on.css" />
  </head>
  <body class="min-h-screen bg-flow-background p-4 font-sans text-flow-foreground md:p-6">
    <template app
      ><main class="mx-auto max-w-6xl space-y-5 py-6">
        <a href="/settings" class="text-sm underline">Personal settings</a>
        <h1 class="text-2xl font-semibold">{{ teamName }} settings</h1>
        <section id="team-settings" class="scroll-mt-6 rounded-2xl border border-flow-border bg-white p-5">
          <h2 class="text-lg font-semibold">Team settings</h2>
          <p class="mt-1 text-sm text-flow-muted">
            Team members share workflows, runs, logs, artifacts, and secrets. Only team admins can invite members.
          </p>
          <div class="mt-4 flex flex-wrap gap-2">
            <input
              bind-value="newTeamName"
              on-input="newTeamName = $event.target.value"
              aria-label="New team name"
              placeholder="New team name"
              required
              maxlength="100"
              class="min-w-48 rounded-lg border border-flow-border px-3 py-2 text-sm"
            />
            <button
              type="button"
              on-click="createTeam()"
              class="rounded-lg bg-flow-primary px-4 py-2 text-sm font-medium text-white"
            >
              Create team
            </button>
          </div>
          <p class="mt-3 text-sm text-flow-muted" role="status">{{ message }}</p>
          <div class="mt-5 grid gap-4 md:grid-cols-2">
            <div class="rounded-xl border border-flow-border p-4" class-hidden="!isAdmin">
              <h3 class="font-medium">Invite a teammate</h3>
              <p class="mt-1 text-xs text-flow-muted">
                Invitation links expire after seven days and can be used once by the matching email account.
              </p>
              <input
                bind-value="inviteEmail"
                on-input="inviteEmail = $event.target.value"
                type="email"
                aria-label="Teammate email"
                placeholder="name@example.com"
                class="mt-3 w-full rounded-lg border border-flow-border px-3 py-2 text-sm"
              />
              <button
                type="button"
                on-click="createInvitation()"
                class="mt-3 rounded-lg border border-flow-border px-4 py-2 text-sm"
              >
                Create invite link
              </button>
              <template if="inviteLink"
                ><div class="mt-3 break-all rounded-lg bg-flow-panel p-3 text-xs">
                  <a attr-href="inviteLink">{{ inviteLink }}</a
                  ><button
                    type="button"
                    on-click="copyValue(inviteLink)"
                    aria-label="Copy invitation link"
                    class="ml-3 underline"
                  >
                    Copy
                  </button>
                </div></template
              >
            </div>
            <div class="rounded-xl border border-flow-border p-4" class-hidden="!isAdmin">
              <h3 class="font-medium">Team webhook URL</h3>
              <p class="mt-1 text-xs text-flow-muted">
                Use this unique URL for provider webhooks. Replace <code>{provider}</code> with the provider ID.
              </p>
              <button
                type="button"
                on-click="rotateWebhook()"
                class="mt-3 rounded-lg border border-flow-border px-4 py-2 text-sm"
              >
                Generate / rotate webhook URL
              </button>
              <template if="webhookPath"
                ><div class="mt-3 break-all rounded-lg bg-flow-panel p-3 text-xs">
                  <code>{{ webhookPath }}</code
                  ><button
                    type="button"
                    on-click="copyValue(webhookPath)"
                    aria-label="Copy team webhook URL"
                    class="ml-3 underline"
                  >
                    Copy
                  </button>
                </div></template
              >
            </div>
          </div>
          <h3 class="mt-6 text-xs font-semibold uppercase tracking-wider text-flow-muted">Current team members</h3>
          <ul class="mt-2 space-y-2">
            <template for="member of members"
              ><li
                class="flex items-center justify-between gap-3 rounded-lg border border-flow-border px-3 py-2 text-sm"
              >
                {{ member.name || member.email || member.subject }}
                <span class="text-xs text-flow-muted">· {{ member.role }}</span>
                <button
                  type="button"
                  class="text-xs underline"
                  class-hidden="!isAdmin"
                  on-click="toggleMemberRole(member)"
                >
                  {{ member.role === 'admin' ? 'Make member' : 'Make admin' }}
                </button>
                <button
                  type="button"
                  class="text-xs text-rose-700 underline"
                  class-hidden="!isAdmin || member.role !== 'member'"
                  on-click="removeMember(member)"
                >
                  Remove
                </button>
              </li></template
            >
          </ul>
        </section>
        <p class="text-sm text-rose-700" role="alert" class-hidden="!error">{{ error }}</p>
      </main>
      <script setup src="/team-settings-ui.mjs"></script
    ></template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
