<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace settings</title>
    <script type="importmap">
      { "imports": { "@app/": "/", "@li3/": "https://at-li3.static.apphor.de/" } }
    </script>
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <link rel="stylesheet" href="/on.css" />
  </head>
  <body class="min-h-screen bg-flow-background p-4 font-sans text-flow-foreground md:p-6">
    <template app
      ><main class="w-full space-y-5 py-2">
        <header
          class="sticky top-0 z-10 flex flex-wrap items-center justify-between gap-3 border-b border-flow-border bg-flow-background py-2"
        >
          <h1 class="text-2xl font-semibold">{{ teamName }} workspace</h1>
          <nav aria-label="Workspace settings sections" class="flex flex-wrap justify-end gap-1.5">
            <a
              href="#team-members"
              class="rounded-md border border-flow-border bg-white px-2.5 py-1.5 text-xs font-medium"
              >Members</a
            >
            <a
              href="#team-webhooks"
              class-hidden="!isAdmin"
              class="rounded-md border border-flow-border bg-white px-2.5 py-1.5 text-xs font-medium"
              >Webhooks</a
            >
            <a
              href="#team-runners"
              class="rounded-md border border-flow-border bg-white px-2.5 py-1.5 text-xs font-medium"
              >Task Runners</a
            >
            <a
              href="#workspace-secrets"
              class-hidden="!isAdmin"
              class="rounded-md border border-flow-border bg-white px-2.5 py-1.5 text-xs font-medium"
              >Task Runner Secrets</a
            >
            <a
              href="#workspace-api-keys"
              class-hidden="!isAdmin"
              class="rounded-md border border-flow-border bg-white px-2.5 py-1.5 text-xs font-medium"
              >API keys</a
            >
          </nav>
        </header>
        <div id="team-settings" class="space-y-5">
          <section
            id="team-members"
            class="scroll-mt-6 rounded-xl border border-flow-border bg-flow-card p-5"
            aria-labelledby="team-members-title"
          >
            <h2 id="team-members-title" class="text-lg font-semibold">Workspace members</h2>
            <p class="mt-1 text-sm text-flow-muted">
              Workspace members share workflows, runs, logs, artifacts, and secrets. Only workspace admins can invite
              members.
            </p>
            <p class="mt-3 text-sm text-flow-muted" role="status">{{ message }}</p>
            <h3 class="mt-6 text-xs font-semibold uppercase tracking-wider text-flow-muted">Current members</h3>
            <ul class="mt-2 space-y-2">
              <template for="member of members"
                ><li
                  class="flex items-center justify-between gap-3 rounded-lg border border-flow-border px-3 py-2 text-sm"
                >
                  {{ member.name || member.email || member.subject }}
                  <span
                    class="rounded border border-flow-warning/30 bg-flow-warning/10 px-1.5 py-0.5 text-xs font-medium text-flow-warning"
                    class-hidden="member.role !== 'admin'"
                    >admin</span
                  >
                  <button
                    type="button"
                    class="text-xs underline"
                    class-hidden="!isAdmin"
                    on-click="toggleMemberRole(member)"
                  >
                    {{ member.role === 'admin' ? 'Make member' : 'Make admin' }}
                  </button>
                  <button
                    type="button"
                    class="text-xs text-rose-700 underline"
                    class-hidden="!isAdmin || member.role !== 'member'"
                    on-click="removeMember(member)"
                  >
                    Remove
                  </button>
                </li></template
              >
            </ul>
            <div class="mt-6 border-t border-flow-border pt-5" class-hidden="!isAdmin">
              <h3 class="font-medium">Invite a workspace member</h3>
              <p class="mt-1 text-xs text-flow-muted">
                Invitation links expire after seven days and can be used once by the matching email account.
              </p>
              <form class="mt-3 flex gap-2" on-submit.prevent="createInvitation()">
                <label class="sr-only" for="invite-email">Teammate email</label>
                <input
                  id="invite-email"
                  bind-value="inviteEmail"
                  on-input="setInviteEmail($event)"
                  type="email"
                  aria-label="Teammate email"
                  placeholder="name@example.com"
                  class="min-w-0 flex-1 rounded-lg border border-flow-border px-3 py-2 text-sm"
                />
                <button type="submit" class="whitespace-nowrap rounded-lg border border-flow-border px-4 py-2 text-sm">
                  Get link
                </button>
              </form>
              <template if="inviteLink"
                ><div class="mt-3 break-all rounded-lg bg-flow-panel p-3 text-xs">
                  <a attr-href="inviteLink">{{ inviteLink }}</a
                  ><button
                    type="button"
                    on-click="copyValue(inviteLink)"
                    aria-label="Copy invitation link"
                    class="ml-3 underline"
                  >
                    Copy
                  </button>
                </div></template
              >
            </div>
          </section>
          <section
            id="team-webhooks"
            class="scroll-mt-6 rounded-xl border border-flow-border bg-flow-card p-5"
            class-hidden="!isAdmin"
            aria-labelledby="team-webhooks-title"
          >
            <h2 id="team-webhooks-title" class="text-lg font-semibold">Webhooks</h2>
            <p class="mt-1 text-sm text-flow-muted">
              Each registration has its own URL and signing secret. Copy both when created; the signing secret is only
              shown once.
            </p>
            <div class="mt-4 flex gap-2">
              <input
                bind-value="webhookProvider"
                on-input="setWebhookProvider($event)"
                aria-label="Webhook URL slug"
                placeholder="Webhook URL slug."
                maxlength="64"
                pattern="[a-z0-9-]+"
                class="min-w-0 flex-1 rounded-lg border border-flow-border px-3 py-2 text-sm"
              />
              <button
                type="button"
                on-click="createWebhook()"
                class="rounded-lg border border-flow-border px-4 py-2 text-sm"
              >
                Create webhook
              </button>
            </div>
            <ul class="mt-3 space-y-2">
              <template for="registration of webhooks"
                ><li class="flex items-center justify-between rounded-lg border border-flow-border px-3 py-2 text-sm">
                  <span>{{ registration.provider }} · created {{ registration.createdAt }}</span>
                  <button type="button" on-click="revokeWebhook(registration)" class="text-xs text-rose-700 underline">
                    Revoke
                  </button>
                </li></template
              >
            </ul>
            <template if="webhookUrl"
              ><div class="mt-3 space-y-2 break-all rounded-lg bg-flow-panel p-3 text-xs">
                <p>
                  URL: <code>{{ webhookUrl }}</code
                  ><button
                    type="button"
                    on-click="copyValue(webhookUrl)"
                    aria-label="Copy webhook URL"
                    class="ml-3 underline"
                  >
                    Copy
                  </button>
                </p>
                <p>
                  Signing secret: <code>{{ webhookSecret }}</code
                  ><button
                    type="button"
                    on-click="copyValue(webhookSecret)"
                    aria-label="Copy webhook signing secret"
                    class="ml-3 underline"
                  >
                    Copy
                  </button>
                </p>
              </div></template
            >
          </section>
          <section
            id="team-runners"
            class="scroll-mt-6 rounded-xl border border-flow-border bg-flow-card p-5"
            aria-labelledby="team-runners-title"
          >
            <h2 id="team-runners-title" class="text-lg font-semibold">Task Runners</h2>
            <p class="mt-1 text-sm text-flow-muted">
              Workspace-scoped runners and shared runners available to this workspace.
            </p>
            <button
              type="button"
              on-click="createRunnerEnrollment()"
              class-hidden="!isAdmin"
              class="mt-3 rounded-lg border border-flow-border px-4 py-2 text-sm"
            >
              Activate runner
            </button>
            <template if="enrollmentCode"
              ><p class="mt-2 break-all rounded-lg bg-flow-panel p-3 text-sm">
                One-time enrollment code: <code>{{ enrollmentCode }}</code>
                <span class="mt-1 block text-xs text-flow-muted"
                  >Expires {{ enrollmentExpiresAt }}. Copy it now; it cannot be viewed again.</span
                >
              </p></template
            >
            <h3 class="mt-5 text-xs font-semibold uppercase tracking-wider text-flow-muted">
              Workspace-scoped runners
            </h3>
            <ul class="mt-2 space-y-2">
              <template for="runner of teamRunners"
                ><li class="rounded-lg border border-flow-border px-3 py-2 text-sm">
                  {{ runner.name }}
                  <span class="text-xs text-flow-muted"
                    >· {{ runner.status }} · {{ runner.activeJobs }} / {{ runner.concurrency }} ·
                    <span>{{ runner.version }}</span></span
                  >
                </li></template
              >
            </ul>
            <h3 class="mt-5 text-xs font-semibold uppercase tracking-wider text-flow-muted">Active shared runners</h3>
            <ul class="mt-2 space-y-2">
              <template for="runner of sharedRunners"
                ><li class="flex items-center justify-between rounded-lg border border-flow-border px-3 py-2 text-sm">
                  <span
                    >{{ runner.name }}
                    <span class="text-xs text-flow-muted"
                      >· {{ runner.status }} · {{ runner.activeJobs }} / {{ runner.concurrency }}</span
                    ></span
                  >
                  <button
                    type="button"
                    on-click="setSharedRunner(runner, false)"
                    class-hidden="!isAdmin"
                    class="text-xs underline"
                  >
                    Deactivate
                  </button>
                </li></template
              >
            </ul>
            <h3 class="mt-5 text-xs font-semibold uppercase tracking-wider text-flow-muted">
              Available shared runners
            </h3>
            <ul class="mt-2 space-y-2">
              <template for="runner of availableRunners"
                ><li class="flex items-center justify-between rounded-lg border border-flow-border px-3 py-2 text-sm">
                  {{ runner.name }}
                  <button
                    type="button"
                    on-click="setSharedRunner(runner, true)"
                    class-hidden="!isAdmin"
                    class="text-xs underline"
                  >
                    Activate
                  </button>
                </li></template
              >
            </ul>
          </section>
          <section
            id="workspace-secrets"
            class="scroll-mt-6 rounded-xl border border-flow-border bg-flow-card p-5"
            class-hidden="!isAdmin"
            aria-labelledby="workspace-secrets-title"
          >
            <h2 id="workspace-secrets-title" class="text-lg font-semibold">Task Runner Secrets</h2>
            <p class="mt-1 text-sm text-flow-muted">
              Encrypted, write-only values available to workflows in this workspace.
            </p>
            <div class="mt-4 grid gap-3">
              <label class="sr-only" for="workspace-secret-name">Secret name</label>
              <input
                id="workspace-secret-name"
                bind-value="secretName"
                on-input="setSecretName($event)"
                placeholder="NPM_TOKEN"
                class="rounded-lg border border-flow-border px-3 py-2 font-mono text-sm uppercase"
              />
              <label class="flex items-center gap-2 text-sm"
                ><input type="checkbox" bind-checked="fileMode" on-change="setFileMode($event)" /> Binary file
                secret</label
              >
              <template if="!fileMode"
                ><label class="sr-only" for="workspace-secret-value">Secret value</label
                ><input
                  id="workspace-secret-value"
                  bind-value="secretValue"
                  on-input="setSecretValue($event)"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Secret value"
                  class="rounded-lg border border-flow-border px-3 py-2 font-mono text-sm"
              /></template>
              <template if="fileMode"
                ><label class="sr-only" for="workspace-secret-file">Secret file</label
                ><input
                  id="workspace-secret-file"
                  on-change="setSecretFile($event)"
                  type="file"
                  class="rounded-lg border border-flow-border px-3 py-2 text-sm"
                /><span class="text-xs text-flow-muted">{{ secretFileName }}</span></template
              >
              <div>
                <button
                  type="button"
                  on-click="saveSecret()"
                  class="rounded-lg border border-flow-primary/60 px-3 py-2 text-sm font-medium text-flow-primary"
                >
                  Save secret
                </button>
              </div>
            </div>
            <ul class="mt-4 space-y-2" aria-label="Workspace secrets">
              <template for="secret of secrets"
                ><li
                  class="flex items-center justify-between gap-3 rounded-lg border border-flow-border px-3 py-2 text-sm"
                >
                  <code>{{ secret }}</code
                  ><button type="button" on-click="deleteSecret(secret)" class="text-rose-700 underline">Delete</button>
                </li></template
              >
            </ul>
          </section>
          <section
            id="workspace-api-keys"
            class="scroll-mt-6 rounded-xl border border-flow-border bg-flow-card p-5"
            class-hidden="!isAdmin"
            aria-labelledby="workspace-api-keys-title"
          >
            <h2 id="workspace-api-keys-title" class="text-lg font-semibold">API keys</h2>
            <p class="mt-1 text-sm text-flow-muted">
              Keys are limited to this workspace. Give each key only the scopes its automation needs.
            </p>
            <div class="mt-4 grid gap-3 sm:grid-cols-[minmax(0,1fr)_auto]">
              <label class="sr-only" for="workspace-key-name">Key name</label>
              <input
                id="workspace-key-name"
                bind-value="keyName"
                on-input="setKeyName($event)"
                placeholder="API key name"
                class="rounded-lg border border-flow-border px-3 py-2 text-sm"
              />
              <button
                type="button"
                on-click="issueKey()"
                class="rounded-lg border border-flow-primary/60 px-3 py-2 text-sm font-medium text-flow-primary"
              >
                Generate key
              </button>
            </div>
            <fieldset class="mt-4 grid gap-2 sm:grid-cols-2">
              <legend class="mb-2 text-xs font-semibold uppercase tracking-wider text-flow-muted">Scopes</legend>
              <template for="scope of scopeOptions"
                ><label class="flex items-center gap-2 text-sm"
                  ><input type="checkbox" bind-checked="scope.selected" on-change="setScope(scope, $event)" />
                  <span>{{ scope.label }}</span></label
                ></template
              >
            </fieldset>
            <div
              class="mt-4 rounded-lg border border-flow-primary/20 bg-flow-panel p-3"
              role="alert"
              class-hidden="!keyToken"
            >
              <p class="text-sm font-semibold">Copy this key now. It cannot be shown again.</p>
              <code class="mt-2 block select-all break-all font-mono text-xs">{{ keyToken }}</code>
              <button type="button" on-click="keyToken = ''" class="mt-2 text-xs underline">Hide key</button>
            </div>
            <ul class="mt-4 space-y-2" aria-label="Workspace API keys">
              <template for="key of keys"
                ><li
                  class="flex items-center justify-between gap-3 rounded-lg border border-flow-border px-3 py-2 text-sm"
                >
                  <span class="min-w-0"
                    ><strong>{{ key.name }}</strong
                    ><span class="block break-words text-xs text-flow-muted">{{ key.scopes.join(', ') }}</span></span
                  ><button type="button" on-click="revokeKey(key)" class="shrink-0 text-rose-700 underline">
                    Revoke
                  </button>
                </li></template
              >
            </ul>
          </section>
        </div>
        <p class="text-sm text-rose-700" role="alert" class-hidden="!error">{{ error }}</p>
      </main>
      <script setup src="/team-settings-ui.mjs"></script
    ></template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
