<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef2ec" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/on.css" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <link rel="component" href="https://sodium.static.apphor.de/code-block.html" />
    <title>Workflow Run</title>
    <script type="importmap">
      {
        "imports": {
          "@app/": "/assets/",
          "@li3/": "https://at-li3.static.apphor.de/",
          "ansi_up": "https://esm.sh/ansi_up@6.0.6",
          "marked": "https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.esm.js"
        }
      }
    </script>
  </head>
  <body class="min-h-screen bg-app-background p-4 font-sans text-app-foreground md:p-6">
    <template app>
      <main class="w-full space-y-4 py-2 run-detail">
        <header class="run-heading flex flex-wrap items-center justify-between gap-3">
          <div>
            <a
              href="/ui/runs"
              class="mb-3 inline-flex items-center gap-2 text-sm text-app-secondary hover:text-app-primary"
            >
              <lucide-icon icon="arrow-left" size="15"></lucide-icon>All runs
            </a>
            <h1 class="flex flex-wrap items-center gap-x-2 text-2xl font-semibold text-app-foreground">
              <span>{{ report.workflowName }}</span><span class="text-app-secondary">#{{ report.jobId }}</span>
              <span
                class="px-3 py-1 rounded-full text-xs font-semibold border"
                bind-class="{'bg-emerald-100.text-emerald-800.border-emerald-300': report.status === 'success', 'bg-rose-100.text-rose-800.border-rose-300': report.status === 'failed', 'bg-blue-100.text-blue-800.border-blue-300': report.status === 'running', 'bg-amber-100.text-amber-900.border-amber-300': !['success', 'failed', 'running'].includes(report.status)}"
                >{{ upper(report.status) }}</span
              >
            </h1>
          </div>
          <div class="run-actions flex w-full flex-wrap items-center gap-2 shrink-0 sm:w-auto">
            <button
              type="button"
              on-click="copyRunUrl()"
              class="inline-flex items-center gap-2 rounded-full border border-app-border bg-white px-3 py-1.5 text-sm text-app-foreground hover:bg-app-panel"
              title="Copy URL"
              aria-label="Copy URL"
            >
              <lucide-icon icon="link" size="15"></lucide-icon><span class="hidden sm:inline">Copy URL</span>
            </button>
            <button
              type="button"
              on-click="downloadLogs()"
              class="inline-flex items-center gap-2 rounded-full border border-app-border bg-white px-3 py-1.5 text-sm text-app-foreground hover:bg-app-panel"
              class-hidden="!report.canViewLogs"
              title="Download logs"
              aria-label="Download logs"
            >
              <lucide-icon icon="download" size="15"></lucide-icon><span class="hidden sm:inline">Download Logs</span>
            </button>
            <template if="report.status === 'running' && report.canControl">
              <button
                class="inline-flex items-center gap-2 rounded-full border border-rose-300 bg-white px-3 py-1.5 text-sm text-rose-700 hover:border-rose-400 disabled:opacity-50"
                on-click="cancelJob()"
                bind-disabled.bool="cancelling"
                attr-aria-label="cancelling ? 'Cancelling run' : 'Cancel run'"
                title="Cancel run"
              >
                <lucide-icon bind-icon="cancelling ? 'loader-circle' : 'circle-stop'" size="15"></lucide-icon>
                <span class="hidden sm:inline">{{ cancelling ? 'Cancelling...' : 'Cancel' }}</span>
              </button>
            </template>
            <template if="report.status !== 'running' && report.canControl">
              <button
                class="inline-flex items-center gap-2 rounded-full border border-app-border bg-white px-3 py-1.5 text-sm text-app-foreground hover:bg-app-panel"
                on-click="restartJob()"
                bind-disabled.bool="restartLoading"
                aria-label="Restart run"
                title="Restart run"
              >
                <lucide-icon bind-icon="restartLoading ? 'loader-circle' : 'rotate-cw'" size="15"></lucide-icon>
                <span class="hidden sm:inline">{{ restartLoading ? 'Restarting...' : 'Restart' }}</span>
              </button>
              <details class="relative" data-restart-menu>
                <summary
                  class="flex w-fit cursor-pointer list-none rounded-full border border-app-border bg-white p-2 text-app-secondary outline-none hover:bg-app-panel focus-visible:ring-2 focus-visible:ring-app-primary/40"
                  aria-label="More restart options"
                >
                  <lucide-icon icon="chevron-down" size="14"></lucide-icon>
                </summary>
                <div
                  class="restart-menu-panel mt-2 w-full rounded-xl border border-app-border bg-white p-2 shadow-xl sm:absolute sm:right-0 sm:top-full sm:z-20 sm:mt-2 sm:w-56"
                >
                  <button
                    type="button"
                    on-click="openManualRestart($event)"
                    class="w-full rounded-lg px-3 py-2 text-left text-sm text-app-foreground hover:bg-app-panel"
                  >
                    Restart with inputs
                  </button>
                </div>
              </details>
            </template>
          </div>
          <template if="restartError">
            <p
              class="basis-full rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-800"
              role="alert"
            >
              {{ restartError }}
            </p>
          </template>
        </header>
        <section
          class="detail-meta grid divide-y divide-app-border rounded-xl border border-app-border bg-white sm:grid-cols-3 sm:divide-x sm:divide-y-0"
          aria-label="Run metadata"
        >
          <div class="flex min-w-0 items-center gap-3 p-3 sm:p-4">
            <lucide-icon icon="calendar-days" size="20" class="h-5 w-5 shrink-0 text-emerald-700"></lucide-icon>
            <div class="min-w-0">
              <span class="block text-[10px] font-semibold uppercase tracking-wider text-app-secondary sm:text-xs"
                >Started</span
              >
              <span class="mt-1 block text-xs text-app-foreground sm:text-sm">{{ formatDate(report.startedAt) }}</span>
            </div>
          </div>
          <div class="flex min-w-0 items-center gap-3 p-3 sm:p-4">
            <lucide-icon icon="timer" size="20" class="h-5 w-5 shrink-0 text-emerald-700"></lucide-icon>
            <div class="min-w-0">
              <span class="block text-[10px] font-semibold uppercase tracking-wider text-app-secondary sm:text-xs"
                >Duration</span
              >
              <span class="mt-1 block text-xs text-app-foreground sm:text-sm">{{ timing }}</span>
            </div>
          </div>
          <div class="flex min-w-0 items-center gap-3 p-3 sm:p-4">
            <lucide-icon icon="server" size="20" class="h-5 w-5 shrink-0 text-emerald-700"></lucide-icon>
            <div class="min-w-0">
              <span class="block text-[10px] font-semibold uppercase tracking-wider text-app-secondary sm:text-xs"
                >Worker</span
              >
              <span class="mt-1 block truncate text-xs text-app-foreground sm:text-sm"
                >{{ report.workerName || report.workerId || 'Awaiting worker' }}</span
              >
            </div>
          </div>
        </section>
        <template if="report.status === 'failed'">
          <aside
            class="failure-banner rounded-xl border border-rose-200 bg-rose-50 p-4 text-rose-800"
            role="status"
            aria-label="Run failed"
          >
            <strong>Run failed</strong>
            <p class="mt-1 text-sm text-rose-800">{{ failedStepMessage }}</p>
          </aside>
        </template>
        <template if="manualRestartOpen">
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950/80 p-4" role="presentation">
            <div
              class="w-full max-w-lg rounded-2xl border border-gray-700 bg-gray-900 p-5 shadow-2xl"
              role="dialog"
              aria-modal="true"
              aria-labelledby="manual-restart-title"
            >
              <div class="flex items-start justify-between gap-3">
                <div>
                  <h2 id="manual-restart-title" class="text-lg font-semibold text-white">Restart with inputs</h2>
                  <p class="mt-1 text-sm text-gray-400">
                    These values override the original trigger inputs for the new run.
                  </p>
                </div>
                <button
                  type="button"
                  on-click="closeManualRestart()"
                  aria-label="Close restart dialog"
                  class="rounded-lg p-2 text-gray-400 hover:bg-gray-800"
                >
                  <lucide-icon icon="x" size="17"></lucide-icon>
                </button>
              </div>
              <details class="mt-5 overflow-hidden rounded-xl border border-gray-800 bg-gray-950/60">
                <summary
                  class="cursor-pointer px-3 py-2 text-sm font-medium text-gray-300 outline-none hover:bg-gray-800 focus-visible:ring-2 focus-visible:ring-indigo-400/60"
                >
                  Original inputs
                </summary>
                <code-block
                  language="json"
                  theme="googlecode"
                  bind-source="originalInputsJson"
                  class="block max-h-64 overflow-auto p-3"
                ></code-block>
              </details>
              <div class="mt-4 space-y-3">
                <p class="text-xs text-gray-500">
                  Additional inputs override matching original values without changing the original payload.
                </p>
                <template for="entry of manualInputs">
                  <div class="grid grid-cols-[1fr_1fr_auto] gap-2">
                    <input
                      bind-value="entry.key"
                      on-input="setManualKey(entry, $event)"
                      placeholder="Key"
                      class="rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-sm text-gray-200"
                    /><input
                      bind-value="entry.value"
                      on-input="setManualValue(entry, $event)"
                      placeholder="Value"
                      class="rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-sm text-gray-200"
                    /><button
                      type="button"
                      on-click="removeManualInput(entry)"
                      aria-label="Remove input"
                      class="rounded-lg px-2 text-rose-300 hover:bg-rose-500/10"
                    >
                      <lucide-icon icon="x" size="15"></lucide-icon>
                    </button>
                  </div>
                </template>
                <button type="button" on-click="addManualInput()" class="text-sm text-indigo-300 hover:underline">
                  + Add input
                </button>
              </div>
              <div class="mt-6 flex justify-end gap-2">
                <button
                  type="button"
                  on-click="closeManualRestart()"
                  class="rounded-lg border border-gray-700 px-3 py-2 text-sm text-gray-300 hover:bg-gray-800"
                >
                  Cancel</button
                ><button
                  type="button"
                  on-click="restartWithInputs()"
                  bind-disabled="manualRestartLoading"
                  class="rounded-lg bg-indigo-500 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-400 disabled:opacity-50"
                >
                  {{ manualRestartLoading ? 'Restarting...' : 'Restart' }}
                </button>
              </div>
            </div>
          </div>
        </template>
        <section
          class="execution overflow-hidden rounded-xl border border-app-border bg-white"
          aria-label="Run details"
        >
          <nav
            class="grid grid-cols-5 gap-0.5 border-b border-app-border px-2 pt-2 sm:flex sm:flex-wrap sm:gap-1.5 sm:px-6 sm:pt-3"
            role="tablist"
            aria-label="Run details tabs"
          >
            <template for="tab of detailTabs">
              <button
                type="button"
                role="tab"
                on-click="selectDetailTab(tab.id)"
                class="inline-flex min-w-0 w-full cursor-pointer items-center justify-center gap-2 rounded-t-md border-b-2 border-transparent px-1 pb-2 pt-2 text-xs text-app-secondary transition-colors hover:bg-app-panel hover:text-app-primary aria-[selected=true]:border-app-primary aria-[selected=true]:bg-app-green-bg aria-[selected=true]:font-bold aria-[selected=true]:text-[#174522] sm:w-auto sm:justify-start sm:px-3 sm:pb-3 sm:text-sm"
                attr-aria-selected="tab.isActive ? 'true' : 'false'"
                attr-aria-label="tab.label"
                attr-title="tab.label"
                class-hidden="!tab.visible"
              >
                <lucide-icon bind-icon="tab.icon" size="15"></lucide-icon>
                <span class="sr-only">{{ tab.label }}</span>
              </button>
            </template>
          </nav>
          <div class-hidden="detailTab !== 'logs'">
            <div class="grid gap-0 lg:grid-cols-[226px_minmax(0,1fr)]">
              <aside class="steps-panel border-app-border bg-app-panel p-4 lg:border-r" aria-label="Execution steps">
                <div
                  class="steps-heading mb-3 flex items-center justify-between px-2 text-sm font-semibold text-app-foreground"
                >
                  <span>Execution steps</span>
                  <span>{{ successfulSteps }} / {{ totalSteps }}</span>
                </div>
                <template for="step of steps">
                  <button
                    class="mb-1 flex w-full cursor-pointer items-center gap-2 rounded-md border border-transparent px-3 py-2.5 text-left text-sm font-medium text-app-secondary transition-colors hover:bg-app-background aria-[pressed=true]:border-app-primary aria-[pressed=true]:bg-white aria-[pressed=true]:font-bold aria-[pressed=true]:text-[#174522] aria-[pressed=true]:shadow-[0_0_0_1px_#387045,0_1px_3px_#23351214]"
                    on-click="selectStep(step.index)"
                    attr-aria-pressed="step.isSelected ? 'true' : 'false'"
                    attr-aria-label="(step.name || step.id || 'Step') + ', ' + upper(step.status)"
                  >
                    <lucide-icon
                      class="h-4 w-4 shrink-0"
                      bind-icon="step.status === 'success' ? 'circle-check' : step.status === 'failed' ? 'circle-x' : step.status === 'running' ? 'loader-circle' : step.status === 'skipped' ? 'circle-minus' : 'circle'"
                      size="14"
                    ></lucide-icon>
                    <span class="block min-w-0 flex-1 truncate" attr-title="step.name || step.id || 'Step'"
                      >{{ step.name || step.id || 'Step' }}</span
                    >
                    <span class="shrink-0 font-mono text-xs text-app-secondary"
                      >{{ formatDuration(step.durationMs) }}</span
                    >
                  </button>
                </template>
              </aside>
              <div class="log-panel min-w-0 overflow-auto bg-[#1c211e] text-[#c9d0c5]" aria-label="Step log output">
                <template if="selectedStepReport">
                  <div
                    class="flex flex-wrap items-center justify-between gap-3 border-b border-[#3a423b] px-4 py-4 sm:px-6"
                  >
                    <h3 class="min-w-0 truncate text-base font-semibold text-[#e2e7df]">
                      {{ selectedStepReport.name || selectedStepReport.id || 'Step' }}
                      <small class="ml-2 text-xs font-normal text-[#98a393]">{{ stepStatusLabel }}</small>
                    </h3>
                    <div class="flex shrink-0 items-center gap-2">
                      <button
                        type="button"
                        on-click="toggleLogWrap()"
                        attr-aria-label="wrapLogs ? 'Disable log wrapping' : 'Enable log wrapping'"
                        title="Toggle text wrapping"
                        class="inline-flex h-8 items-center gap-2 rounded-md px-2 text-sm text-[#b4bdae] hover:bg-white/10 hover:text-white"
                      >
                        <lucide-icon bind-icon="wrapLogs ? 'text-wrap' : 'text'" size="16"></lucide-icon>
                        <span class="sr-only">{{ wrapLogs ? 'Unwrap logs' : 'Wrap logs' }}</span>
                      </button>
                      <button
                        type="button"
                        on-click="copyLogs()"
                        aria-label="Copy logs"
                        title="Copy logs"
                        class="inline-flex h-8 items-center gap-2 rounded-md px-2 text-sm text-[#b4bdae] hover:bg-white/10 hover:text-white"
                      >
                        <lucide-icon icon="copy" size="16"></lucide-icon><span class="sr-only">Copy logs</span>
                      </button>
                      <template if="report.status === 'failed'">
                        <button
                          type="button"
                          on-click="askAi(selectedStepReport, $event)"
                          aria-label="Get AI help for failed step"
                          title="Get AI help"
                          class="inline-flex h-8 items-center justify-center rounded-md px-2 text-[#b4bdae] hover:bg-white/10 hover:text-white"
                        >
                          <lucide-icon
                            bind-icon="aiLoading && aiStepId === selectedStepReport.id ? 'loader-circle' : 'sparkles'"
                            bind-class="aiLoading && aiStepId === selectedStepReport.id ? 'animate-spin' : ''"
                            size="16"
                          ></lucide-icon>
                        </button>
                      </template>
                    </div>
                  </div>
                  <label
                    class="flex items-center gap-3 border-b border-[#3a423b] bg-[#171c18] px-4 py-3 text-[#98a393] sm:px-6"
                  >
                    <lucide-icon icon="search" size="16"></lucide-icon>
                    <span class="sr-only">Search this step's logs</span>
                    <input
                      type="search"
                      aria-label="Search this step's logs"
                      placeholder="Find in this step..."
                      bind-value="logSearch"
                      on-input="setLogSearch($event)"
                      class="min-w-0 flex-1 bg-transparent font-mono text-sm text-[#e2e7df] outline-none placeholder:text-[#84907f]"
                    />
                  </label>
                  <pre
                    class="max-h-[70vh] min-h-72 overflow-auto px-4 py-3 font-mono text-[13px] leading-7 text-[#c9d0c5] sm:px-6 sm:py-4"
                    bind-class="wrapLogs ? 'whitespace-pre-wrap break-words' : 'whitespace-pre'"
                    bind-innerhtml="stepLog(selectedStepReport)"
                  ></pre>
                  <div
                    class="flex items-center justify-between border-t border-[#3a423b] px-4 py-3 text-xs text-[#98a393] sm:px-6"
                  >
                    <span>{{ successfulSteps }} / {{ totalSteps }} steps complete</span>
                    <span>Total duration {{ totalDuration }}</span>
                  </div>
                </template>
                <template if="!selectedStepReport">
                  <p class="p-6 text-sm text-[#98a393]">No steps are available for this run.</p>
                </template>
              </div>
            </div>
          </div>
          <div class-hidden="detailTab !== 'inputs' || !report.canViewInputs">
            <code-block
              language="json"
              theme="googlecode"
              bind-source="inputsJson"
              class="block max-h-[38rem] overflow-auto p-5 text-sm"
            ></code-block>
          </div>
          <div class-hidden="detailTab !== 'artifacts'">
            <div class-hidden="!report.canViewArtifacts || !report.artifacts.length">
              <ul class="divide-y divide-app-border">
                <template for="artifact of report.artifacts">
                  <li class="px-5 py-4">
                    <a
                      href="#"
                      on-click="downloadArtifact($event, artifact)"
                      class="font-mono text-sm text-app-primary hover:underline"
                      >{{ artifact }}</a
                    >
                  </li>
                </template>
              </ul>
            </div>
            <p class="p-6 text-sm text-app-secondary" class-hidden="report.canViewArtifacts && report.artifacts.length">
              {{ report.canViewArtifacts ? 'No artifacts available for this run.' : 'You do not have access to this
              run\'s artifacts.' }}
            </p>
          </div>
          <div class-hidden="detailTab !== 'history'">
            <div class-hidden="!previousRuns.length">
              <h3 class="sr-only">Previous runs</h3>
              <ul class="divide-y divide-app-border">
                <template for="run of previousRuns">
                  <li>
                    <a
                      attr-href="'/ui/runs/' + run.id"
                      class="flex items-center justify-between gap-3 px-5 py-4 text-sm text-app-foreground hover:bg-app-panel"
                    >
                      <span><span class="font-mono">#{{ run.id }}</span> · {{ formatDate(run.startedAt) }}</span>
                      <span class="text-xs font-semibold uppercase text-app-secondary">{{ upper(run.status) }}</span>
                    </a>
                  </li>
                </template>
              </ul>
            </div>
            <p class="p-6 text-sm text-app-secondary" class-hidden="previousRuns.length">No previous runs.</p>
          </div>
          <div class-hidden="detailTab !== 'source'">
            <div class="flex justify-end border-b border-app-border px-4 py-2" class-hidden="!report.canEditWorkflow">
              <a
                attr-href="'/ui/workflows/' + report.workflowId"
                class="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-app-primary outline-none transition hover:bg-app-panel focus-visible:ring-2 focus-visible:ring-app-primary/40"
              >
                <lucide-icon icon="pencil" size="15"></lucide-icon>Edit workflow
              </a>
            </div>
            <code-block
              language="yaml"
              theme="googlecode"
              bind-source="report.workflowSourceYaml"
              class="block max-h-[38rem] overflow-auto p-4"
              class-hidden="!report.workflowSourceYaml"
            ></code-block>
            <p class="p-6 text-sm text-app-secondary" class-hidden="report.workflowSourceYaml">
              Workflow source is unavailable.
            </p>
          </div>
        </section>
        <template if="report.canViewLogs && aiStepId">
          <aside
            class="fixed bottom-4 left-4 right-4 z-40 mt-4 flex max-h-[70vh] flex-col rounded-2xl border border-indigo-500/30 bg-gray-900/95 p-4 shadow-2xl backdrop-blur lg:left-auto lg:w-[28rem]"
            aria-labelledby="ai-help-title"
          >
            <div class="flex items-start justify-between gap-3 border-b border-gray-800 pb-3">
              <div>
                <h2 id="ai-help-title" class="font-semibold text-white">AI help</h2>
                <p class="mt-1 text-xs text-gray-500">Ask about a failed step.</p>
              </div>
              <lucide-icon icon="sparkles" size="18" class="text-indigo-300"></lucide-icon>
            </div>
            <div class="min-h-0 flex-1 space-y-3 overflow-y-auto py-3" aria-live="polite">
              <p class="flex items-center gap-2 text-sm text-indigo-300" class-hidden="!aiLoading">
                <lucide-icon icon="loader-circle" size="16" class="animate-spin"></lucide-icon>
                Thinking through the failed step...
              </p>
              <p class="text-sm text-gray-500" class-hidden="aiMessages.length > 0">
                Select the help icon beside a failed step to start.
              </p>
              <template for="message of aiMessages">
                <div
                  class="rounded-lg p-3 text-sm"
                  bind-class="message.role === 'assistant' ? 'bg-indigo-500/10.text-gray-200' : 'bg-gray-800.text-gray-300'"
                >
                  <p class="mb-1 text-[10px] font-semibold uppercase tracking-wider text-gray-500">
                    {{ message.role }}
                  </p>
                  <template if="message.html"
                    ><div class="ai-markdown text-sm leading-relaxed" bind-innerhtml="message.html"></div
                  ></template>
                  <template if="!message.html">
                    <pre class="whitespace-pre-wrap font-sans leading-relaxed">{{ message.content }}</pre>
                  </template>
                </div>
              </template>
              <p class="text-sm text-rose-300" class-hidden="!aiError">{{ aiError }}</p>
            </div>
            <form class="border-t border-gray-800 pt-3" on-submit.prevent="askFollowup()">
              <label class="sr-only" for="ai-question">Ask a follow-up question</label>
              <div class="flex gap-2">
                <input
                  id="ai-question"
                  bind-value="aiQuestion"
                  placeholder="Ask a follow-up..."
                  bind-disabled="!aiStepId || aiLoading"
                  class="min-w-0 flex-1 rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-sm text-gray-200 outline-none placeholder:text-gray-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 disabled:opacity-50"
                />
                <button
                  type="submit"
                  aria-label="Ask AI"
                  bind-disabled="!aiStepId || aiLoading"
                  class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-indigo-500 text-white outline-none hover:bg-indigo-400 focus-visible:ring-2 focus-visible:ring-indigo-400/60 disabled:opacity-50"
                >
                  <lucide-icon icon="arrow-up" size="16"></lucide-icon>
                </button>
              </div>
            </form>
          </aside>
        </template>
        <template if="report.canViewArtifacts && report.artifacts.length">
          <details class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
            <summary
              class="cursor-pointer px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-400 outline-none transition hover:bg-gray-800 focus-visible:ring-2 focus-visible:ring-indigo-400/60"
            >
              Artifacts
            </summary>
            <ul class="divide-y divide-gray-800 border-t border-gray-800">
              <template for="artifact of report.artifacts">
                <li class="px-4 py-3">
                  <a
                    href="#"
                    on-click="downloadArtifact($event, artifact)"
                    class="font-mono text-sm text-indigo-300 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400/60"
                    >{{ artifact }}</a
                  >
                </li>
              </template>
            </ul>
          </details>
        </template>
      </main>

      <script setup src="/assets/run.mjs"></script>
    </template>

    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
