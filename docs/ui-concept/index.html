<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f6" />
    <meta name="description" content="Flow — a quieter place to ship. An interactive CI dashboard design concept." />
    <title>Runs · Flow</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23244336'/%3E%3Cpath d='M9 10h14M9 16h10M9 22h6' stroke='%23c4efad' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <aside
      class="sidebar fixed inset-y-0 left-0 z-20 flex w-56 flex-col border-r border-flow-border bg-flow-sidebar px-[17px] pt-8 pb-[18px] max-[1180px]:w-48 max-[1180px]:px-3 max-[900px]:w-[72px] max-[900px]:items-center max-[900px]:px-[9px] max-[900px]:pt-[27px] max-[900px]:pb-[15px] max-[600px]:inset-x-0 max-[600px]:inset-y-auto max-[600px]:bottom-0 max-[600px]:h-[62px] max-[600px]:w-full max-[600px]:flex-row max-[600px]:items-center max-[600px]:border-r-0 max-[600px]:border-t max-[600px]:bg-[#fafbf8f5] max-[600px]:px-3 max-[600px]:pt-0 max-[600px]:pb-[env(safe-area-inset-bottom)] max-[600px]:backdrop-blur-[15px]"
      aria-label="Workspace navigation"
    >
      <a
        class="brand flex w-fit items-center px-[13px] text-[33px] font-bold tracking-[-1.9px] max-[900px]:p-0 max-[900px]:text-[0px] max-[600px]:hidden"
        href="#/runs"
        aria-label="Flow home"
        ><span
          class="brand-mark mr-[10px] flex h-[34px] w-[31px] -skew-y-[13deg] flex-col justify-center gap-[5px] max-[900px]:m-0"
          ><i class="block h-[5px] w-[27px] rounded-[2px] bg-[#547d42]"></i
          ><i class="block h-[5px] w-5 rounded-[2px] bg-[#547d42]"></i
          ><i class="block h-[5px] w-[13px] rounded-[2px] bg-[#547d42]"></i></span
        >flow<span class="brand-period text-[#729b5b]">.</span></a
      >
      <div
        class="workspace mx-[2px] my-[38px] flex items-center gap-[10px] rounded-[7px] border border-flow-border bg-flow-subtle px-[10px] py-3 max-[1180px]:gap-[7px] max-[900px]:hidden"
      >
        <span
          class="workspace-icon grid h-[31px] w-[30px] place-items-center rounded-[5px] border border-[#e2e7dc] bg-[#edf1e7] text-[19px] font-bold"
          >a</span
        >
        <div>
          <strong class="block text-[13px] font-semibold">Apphor</strong
          ><span class="mt-[3px] block text-[13px] text-flow-muted">Engineering workspace</span>
        </div>
        <span
          class="workspace-label ml-auto rounded-[3px] border border-flow-border px-1 py-[2px] text-[13px] text-flow-muted max-[1180px]:hidden"
          >PRO</span
        >
      </div>
      <div
        class="nav-caption mb-3 px-[13px] text-[13px] font-semibold tracking-[1.4px] text-flow-muted max-[900px]:hidden"
      >
        WORKSPACE
      </div>
      <nav
        class="grid gap-[5px] max-[900px]:mt-10 max-[900px]:w-full max-[600px]:mt-0 max-[600px]:flex max-[600px]:h-full max-[600px]:justify-around"
        id="navigation"
      ></nav>
      <div class="sidebar-bottom mt-auto max-[600px]:hidden">
        <div class="runner-health flex items-center gap-[7px] px-2 py-[18px] text-[13px] text-flow-muted">
          <span class="health-dot h-[6px] w-[6px] shrink-0 rounded-full bg-[#699d55]"></span
          ><span>Runners operational</span><span class="mono ml-auto text-[10px]">3/3</span>
        </div>
        <a
          id="profile-link"
          class="profile flex w-full items-center gap-[10px] border-t border-flow-border px-[5px] pt-[19px] text-left text-flow-foreground no-underline hover:bg-flow-subtle"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          aria-disabled="true"
          aria-label="Open identity profile in a new tab"
        >
          <span
            class="avatar grid h-[33px] w-[33px] shrink-0 place-items-center rounded-full bg-[#ebe6d9] text-[13px] font-semibold text-[#675c44]"
            id="profile-avatar"
            >JD</span
          ><span class="min-w-0 max-w-[138px] max-[900px]:hidden"
            ><strong id="profile-name" class="block truncate text-[13px] font-medium">Jamie Davis</strong
            ><small id="profile-email" class="mt-[3px] block truncate text-[12px] text-flow-muted">jamie@example.com</small
            ><span
              id="profile-role"
              class="mt-1 inline-flex w-fit rounded-full bg-flow-subtle px-1.5 py-0.5 text-[10px] font-medium text-flow-muted"
              >Admin</span
            ></span
          ><span class="ml-auto text-flow-muted max-[900px]:hidden" data-icon="external"></span>
        </a>
      </div>
    </aside>
    <div
      class="app-shell ml-56 flex min-h-screen flex-col max-[1180px]:ml-48 max-[900px]:ml-[72px] max-[600px]:ml-0 max-[600px]:pb-[62px]"
    >
      <main id="main" tabindex="-1"></main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status" class="toast" hidden></div>
  </body>
</html>
