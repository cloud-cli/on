<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f6" />
    <meta name="description" content="Flow — a quieter place to ship. An interactive CI dashboard design concept." />
    <title>Runs · Flow</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23244336'/%3E%3Cpath d='M9 10h14M9 16h10M9 22h6' stroke='%23c4efad' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <aside class="sidebar" aria-label="Workspace navigation">
      <a class="brand" href="#/runs" aria-label="Flow home"
        ><span class="brand-mark"><i></i><i></i><i></i></span>flow<span class="brand-period">.</span></a
      >
      <div class="workspace">
        <span class="workspace-icon">a</span>
        <div><strong>Apphor</strong><span>Engineering workspace</span></div>
        <span class="workspace-label">PRO</span>
      </div>
      <div class="nav-caption">WORKSPACE</div>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <div class="runner-health">
          <span class="health-dot"></span><span>Runners operational</span><span class="mono">3/3</span>
        </div>
        <button class="profile" data-action="preferences">
          <span class="avatar">JD</span><span><strong>Jamie Davis</strong><small>Workspace admin</small></span
          ><span data-icon="settings"></span>
        </button>
      </div>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="breadcrumbs" id="breadcrumbs"></div>
        <div class="topbar-right">
          <button
            class="icon-button"
            data-action="shortcuts"
            aria-label="Keyboard shortcuts"
            title="Keyboard shortcuts"
          >
            <span data-icon="keyboard"></span></button
          ><span class="avatar small">JD</span>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status" class="toast" hidden></div>
  </body>
</html>
