<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f6" />
    <meta name="description" content="Flow — a quieter place to ship. An interactive CI dashboard design concept." />
    <title>Runs · Flow</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23244336'/%3E%3Cpath d='M9 10h14M9 16h10M9 22h6' stroke='%23c4efad' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <aside
      class="fixed inset-y-0 left-0 z-20 flex w-64 flex-col border-r border-flow-sidebar px-4 pt-8 pb-8 max-w-sm max:w-[48px] max-[900px]:w-[72px] max-[900px]:items-center max-[900px]:px-3 max-[900px]:pt-7 max-[900px]:pb-3 max-[600px]:inset-x-0 max-[600px]:inset-y-auto max-[600px]:bottom-0 max-[600px]:h-[62px] max-[600px]:w-full max-[600px]:flex-row max-[600px]:items-center max-[600px]:border-0 max-[600px]:border-t max-[600px]:bg-flow-gray-100 max-[600px]:px-3 max-[600px]:pt-0 max-[600px]:pb-0 max-[600px]:backdrop-blur-sm"
      aria-label="Workspace navigation"
    >
      <a
        class="flex w-fit items-center px-2 text-3xl font-bold tracking[-1.9px] max:[900px]:p-0 max:[900px]:text-0 max:[600px]:hidden"
        href="#/runs"
        aria-label="Flow home"
        ><span
          class="brand-mark mr-[10px] flex h-[34px] w-[31px] -skew-y-[13deg] flex-col justify-center gap-[5px] max-[900px]:m-0"
          ><i class="block h-[5px] w-[27px] rounded-[2px] bg-[#547d42]"></i
          ><i class="block h-[5px] w-5 rounded-[2px] bg-[#547d42]"></i
          ><i class="block h-[5px] w-[13px] rounded-[2px] bg-[#547d42]"></i></span
        >flow<span class="brand-period text-[#729b5b]">.</span></a
      >
      <div
        class="workspace mx-[2px] my-[38px] flex items-center gap-[10px] rounded-[7px] border border-flow-border bg-flow-gray-50 px-[10px] py-3 max-[1180px]:gap-[7px] max-[900px]:hidden"
      >
        <span
          class="workspace-icon grid h-[31px] w-[30px] place-items-center rounded-[5px] border border-[#e2e7dc] bg-[#edf1e7] text-[19px] font-bold"
          >a</span
        >
        <div>
          <strong class="block text-[13px] font-semibold">Apphor</strong
          ><span class="mt-[3px] block text-[13px] text-flow-muted">Engineering workspace</span>
        </div>
        <span
          class="workspace-label ml-auto rounded-[3px] border border-flow-border px-1 py-[2px] text-[13px] text-flow-muted max:[1180x]:hidden"
          >PRO</span
        >
      </div>
      <div
        class="nav-caption mb-2 px-2 text-sm font-semibold tracking-[1.4px] text-flow-foreground max:[900px]:hidden"
      >
        WORKSPACE
      </div>
      <nav
        class="grid gap-[5px] max-[900px]:mt-10 max-[900px]:w-full max-[600px]:mt-0 max-[600px]:flex max-[600px]:h-full max-[600px]:justify-around"
        id="navigation"
      ></nav>
      <div class="sidebar-bottom mt-auto max-[600px]:hidden">
        <div class="runner-health flex items-center gap-[7px] px-2 py-[18px] text-[13px] text-flow-muted">
          <span class="health-dot h-[6px] w-[6px] shrink-0 rounded-full bg-[#699d55]"></span
          ><span>Runners operational</span><span class="mono ml-auto text-[10px]">3/3</span>
        </div>
        <button
          class="profile flex w-full items-center gap-[10px] border-t border-flow-border px-[5px] pt-[19px] text-left"
          data-action="preferences"
        >
          <span
            class="avatar grid h-[33px] w-[33px] shrink-0 place-items-center rounded-full bg-[#ebe6d9] text-[13px] font-semibold text-[#675c44]"
            >JD</span
          ><span class="max-[900px]:hidden"
            ><strong class="block text-[13px] font-medium">Jamie Davis</strong
            ><small class="mt-[3px] block text-[13px] text-flow-muted">Workspace admin</small></span
          ><span class="ml-auto text-flow-muted max-[900px]:hidden" data-icon="settings"></span>
        </button>
      </div>
    </aside>
    <div
      class="ml-56 flex min-h-screen flex-col max:[1180x]:ml-48 max:[900x]:ml-72 max:[600x]:ml-0 max:[600x]:pb-3"
    >
      <header
        class="topbar flex h-[72px] items-center justify-between gap-3 border-b border-flow-border px-7 max:[600x]:h-14 max:[600x]:px-2"
      >
        <div
          class="breadcrumbs flex items-center gap-3 text-[13px] text-[#737a70] max-[600px]:gap-[7px]"
          id="breadcrumbs"
        ></div>
        <div class="topbar-right flex items-center gap-4 max:[600x]:gap-2">
          <button
            class="icon-button flex items-center justify-center rounded-md px-2 py-1.5 text-flow-foreground hover:bg-flow-subtle max:[600x]:hidden"
            data-action="shortcuts"
            aria-label="Keyboard shortcuts"
            title="Keyboard shortcuts"
          >
            <span data-icon="keyboard"></span></button
          ><span
            class="avatar small grid h-8 w-8 rounded-full bg-flow-gray-100 text-[10px] font-semibold text-flow-foreground max:[600x]:hidden"
            >JD</span
          >
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status" class="toast" hidden></div>
  </body>
</html>
