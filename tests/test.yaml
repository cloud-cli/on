id: github-workflow-migration-fixture
name: GitHub workflow-owned payload migration fixture

on:
  github-test:
    if: inputs.request.headers['x-github-event'] == 'push' && inputs.body.repository.full_name == 'cloud-cli/on-github-workflow-migration-test' && inputs.body.ref == 'refs/heads/main'

env:
  GITHUB_TOKEN: "${secrets.GITHUB_TOKEN}"
  TEST_OWNER: "${inputs.body.repository.owner.login}"
  TEST_REPO: "${inputs.body.repository.name}"
  TEST_SHA: "${inputs.body.after}"

steps:
  - id: report-pending
    name: Report pending commit status
    run: |
      payload=$(jq -n --arg state "pending" --arg target_url "$CI_JOB_URL" --arg description "Workflow migration test started." --arg context "on-github-migration-test" '{state: $state, target_url: $target_url, description: $description, context: $context}')
      curl --fail --silent --show-error --max-time 10 \
        -X POST "https://api.github.com/repos/$TEST_OWNER/$TEST_REPO/statuses/$TEST_SHA" \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        -H "Content-Type: application/json" \
        -d "$payload" >/dev/null

  - id: report-payload
    name: Normalize GitHub payload without side effects
    eval: |
      ({
        event: inputs.request?.headers?.['x-github-event'] || '',
        repository: inputs.body?.repository?.full_name || '',
        owner: (inputs.body?.repository?.full_name || '').split('/')[0] || '',
        repo: (inputs.body?.repository?.full_name || '').split('/')[1] || '',
        ref: inputs.body?.ref || '',
        branch: (inputs.body?.ref || '').startsWith('refs/heads/') ? (inputs.body?.ref || '').slice(11) : '',
        commit_sha: inputs.body?.after || '',
        commit_message: inputs.body?.head_commit?.message || ''
      })

post:
  - id: report-final-status
    name: Report final commit status
    run: |
      case "$CI_JOB_STATUS" in
        success) state=success; description="Workflow migration test passed." ;;
        failed) state=failure; description="Workflow migration test failed." ;;
        *) state=error; description="Workflow migration test cancelled." ;;
      esac
      payload=$(jq -n --arg state "$state" --arg target_url "$CI_JOB_URL" --arg description "$description" --arg context "on-github-migration-test" '{state: $state, target_url: $target_url, description: $description, context: $context}')
      curl --fail --silent --show-error --max-time 10 \
        -X POST "https://api.github.com/repos/$TEST_OWNER/$TEST_REPO/statuses/$TEST_SHA" \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        -H "Content-Type: application/json" \
        -d "$payload" >/dev/null
