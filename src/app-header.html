<template component="app-header">
  <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
  <header class="mx-auto flex w-full max-w-[78rem] items-center justify-between gap-4 border-b border-gray-800 pb-5">
    <div class="flex min-w-0 items-start gap-3">
      <template if="back">
        <a class="mt-0.5 inline-flex h-9 w-9 items-center justify-center rounded-lg border border-gray-800 text-gray-400 no-underline outline-none hover:border-indigo-500 hover:text-indigo-200 focus-visible:ring-2 focus-visible:ring-indigo-400/60" attr-href="back" attr-aria-label="backLabel || 'Back'" attr-title="backLabel || 'Back'">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
        </a>
      </template>
      <div>
        <div class="text-[.7rem] font-bold uppercase tracking-[.16em] text-indigo-400">Runner engine</div>
        <h1 class="mt-1 text-2xl font-bold tracking-tight text-white">{{ title }}</h1>
        <template if="subtitle"><p class="mt-1 text-xs text-gray-400">{{ subtitle }}</p></template>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <template if="authConfigured && !authenticated">
        <a class="text-xs text-indigo-300 hover:text-white" href="/auth/login">Sign in</a>
      </template>
      <template if="authenticated">
        <span class="hidden text-xs text-gray-400 sm:inline">{{ userName }}</span>
        <a class="text-xs text-indigo-300 hover:text-white" href="/auth/logout">Sign out</a>
      </template>
      <a class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-gray-700 text-indigo-200 no-underline outline-none hover:border-indigo-500 hover:bg-gray-900 hover:text-white focus-visible:ring-2 focus-visible:ring-indigo-400/60" href="/help" aria-label="Help" title="Help">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.6 9a2.5 2.5 0 1 1 4.2 1.8c-1.2 1-1.8 1.4-1.8 2.7"></path><path d="M12 17h.01"></path></svg>
      </a>
      <a class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-gray-700 text-indigo-200 no-underline outline-none hover:border-indigo-500 hover:bg-gray-900 hover:text-white focus-visible:ring-2 focus-visible:ring-indigo-400/60" href="/settings" aria-label="Settings" title="Settings">
        <lucide-icon icon="settings" size="16"></lucide-icon>
      </a>
    </div>
  </header>
  <script setup>
    import { defineProp, onInit, ref } from '@li3/web';
    export default function () {
      if (!window.runnerApiFetch) {
        const rawFetch = window.fetch.bind(window);
        let token = sessionStorage.getItem('runner-api-token') || '';
        let expiresAt = token ? Number.MAX_SAFE_INTEGER : 0;
        const loadToken = async () => {
          if (token && expiresAt > Date.now() + 30_000) return token;
          const response = await rawFetch('/api/auth/token', { headers: { accept: 'application/json' } });
          if (!response.ok) return '';
          const data = await response.json();
          token = data.access_token || '';
          expiresAt = Number(data.expires_at || 0);
          return token;
        };
        const apiFetch = async (input, init = {}) => {
          const target = new URL(input, window.location.href);
          if (target.origin !== window.location.origin || (!target.pathname.startsWith('/api/') && !target.pathname.startsWith('/restart/'))) {
            return rawFetch(input, init);
          }
          const headers = new Headers(init.headers);
          const accessToken = await loadToken();
          if (accessToken) headers.set('authorization', `Bearer ${accessToken}`);
          return rawFetch(input, { ...init, headers });
        };
        apiFetch.setToken = (value) => {
          token = value || '';
          expiresAt = token ? Number.MAX_SAFE_INTEGER : 0;
          if (token) sessionStorage.setItem('runner-api-token', token);
          else sessionStorage.removeItem('runner-api-token');
        };
        window.runnerApiFetch = apiFetch;
      }
      const authConfigured = ref(false);
      const authenticated = ref(false);
      const userName = ref('');
      onInit(async () => {
        try {
          const response = await fetch('/api/auth/session');
          if (!response.ok) return;
          const session = await response.json();
          authConfigured.value = session.configured;
          authenticated.value = session.authenticated;
          userName.value = session.user?.name || session.user?.email || '';
        } catch {}
      });
      return { title: defineProp('title'), subtitle: defineProp('subtitle'), back: defineProp('back'), backLabel: defineProp('back-label'), authConfigured, authenticated, userName };
    }
  </script>
</template>
