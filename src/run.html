<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <link rel="component" href="https://sodium.static.apphor.de/code-block.html" />
    <link rel="component" href="/app-header.html" />
    <title>Workflow Run</title>
    <script type="importmap">
      {
        "imports": {
          "@li3/": "https://cdn.li3.dev/@li3/",
         "ansi_up": "https://esm.sh/ansi_up@6.0.6",
         "marked": "https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.esm.js"
        }
      }
  </script>
  <style>
  </style>
  </head>
  <body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-6 font-sans">
    <template app>
      <div class="max-w-7xl mx-auto space-y-4 py-6">
        <app-header bind-title="report.workflowName" bind-subtitle="'Run #' + report.jobId" back="/runs" back-label="Back to jobs"></app-header>
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-800 pb-4">
          <p class="text-xs text-gray-400">
            Started {{ report.startedAt }} · {{ timing }}
            <template if="report.workerId"> · worker: {{ report.workerId }}</template>
            <template if="report.parentId"> · from #{{ report.parentId }}</template>
          </p>
          <div class="flex items-center gap-2 shrink-0">
            <span
              class="px-4 py-1.5 rounded-full text-sm font-semibold border"
              bind-class="{
              'bg-emerald-500/10.text-emerald-400.border-emerald-500/20': report.status === 'success',
              'bg-rose-500/10.text-rose-400.border-rose-500/20': report.status === 'failed',
              'bg-indigo-500/10.text-indigo-400.border-indigo-500/20': report.status === 'running',
              'bg-amber-500/10.text-amber-400.border-amber-500/20': !['success', 'failed', 'running'].includes(report.status)
            }"
            >
              {{ upper(report.status) }}
            </span>
            <template if="report.status === 'running'">
              <button
                class="text-sm text-rose-300 px-4 py-1.5 border border-rose-500/50 hover:border-rose-400 rounded-full disabled:opacity-50"
                on-click="cancelJob()"
                bind-disabled.bool="cancelling"
              >
                {{ cancelling ? 'Cancelling...' : 'Cancel' }}
              </button>
            </template>
            <template if="report.status !== 'running'">
              <div class="relative flex items-center gap-1">
                <button class="text-sm text-white px-4 py-1.5 border border-gray-600 hover:border-gray-400 rounded-full" on-click="restartJob()">Restart</button>
                <details class="relative">
                  <summary class="cursor-pointer list-none rounded-full border border-gray-600 p-2 text-gray-300 outline-none hover:bg-gray-800 focus-visible:ring-2 focus-visible:ring-indigo-400/60" aria-label="More restart options">
                    <lucide-icon icon="chevron-down" size="14"></lucide-icon>
                  </summary>
                  <div class="absolute right-0 z-20 mt-2 w-56 rounded-xl border border-gray-700 bg-gray-900 p-2 shadow-2xl">
                    <button type="button" on-click="openManualRestart($event)" class="w-full rounded-lg px-3 py-2 text-left text-sm text-gray-200 hover:bg-gray-800">Restart with inputs</button>
                  </div>
                </details>
              </div>
            </template>
          </div>
        </div>
        <template if="manualRestartOpen">
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950/80 p-4" role="presentation">
            <div class="w-full max-w-lg rounded-2xl border border-gray-700 bg-gray-900 p-5 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="manual-restart-title">
              <div class="flex items-start justify-between gap-3"><div><h2 id="manual-restart-title" class="text-lg font-semibold text-white">Restart with inputs</h2><p class="mt-1 text-sm text-gray-400">These values override the original trigger inputs for the new run.</p></div><button type="button" on-click="closeManualRestart()" aria-label="Close restart dialog" class="rounded-lg p-2 text-gray-400 hover:bg-gray-800"><lucide-icon icon="x" size="17"></lucide-icon></button></div>
              <div class="mt-5 space-y-3">
                <template for="entry of manualInputs">
                  <div class="grid grid-cols-[1fr_1fr_auto] gap-2"><input bind-value="entry.key" placeholder="Key" class="rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-sm text-gray-200" /><input bind-value="entry.value" placeholder="Value" class="rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-sm text-gray-200" /><button type="button" on-click="removeManualInput(entry)" aria-label="Remove input" class="rounded-lg px-2 text-rose-300 hover:bg-rose-500/10"><lucide-icon icon="x" size="15"></lucide-icon></button></div>
                </template>
                <button type="button" on-click="addManualInput()" class="text-sm text-indigo-300 hover:underline">+ Add input</button>
              </div>
              <div class="mt-6 flex justify-end gap-2"><button type="button" on-click="closeManualRestart()" class="rounded-lg border border-gray-700 px-3 py-2 text-sm text-gray-300 hover:bg-gray-800">Cancel</button><button type="button" on-click="restartWithInputs()" bind-disabled="manualRestartLoading" class="rounded-lg bg-indigo-500 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-400 disabled:opacity-50">{{ manualRestartLoading ? 'Restarting...' : 'Restart' }}</button></div>
            </div>
          </div>
        </template>
        <template if="previousRuns.length">
          <details class="rounded-xl border border-gray-800 bg-gray-900/70">
            <summary class="cursor-pointer px-4 py-3 text-sm font-medium text-gray-300 outline-none hover:bg-gray-800 focus-visible:ring-2 focus-visible:ring-indigo-400/60">
              Previous runs
            </summary>
            <ul class="divide-y divide-gray-800 border-t border-gray-800">
              <template for="run of previousRuns">
                <li>
                  <a attr-href="'/runs/' + run.id" class="flex items-center justify-between gap-3 px-4 py-3 text-sm outline-none hover:bg-gray-800 focus-visible:ring-2 focus-visible:ring-indigo-400/60">
                    <span><span class="font-mono text-indigo-300">#{{ run.id }}</span><span class="ml-3 text-gray-400">{{ run.startedAt }}</span></span>
                    <span class="font-semibold uppercase text-xs text-gray-400">{{ upper(run.status) }}</span>
                  </a>
                </li>
              </template>
            </ul>
          </details>
        </template>

        <section class="rounded overflow-hidden border-b border-gray-800">
          <h2 class="sr-only">Execution Steps</h2>
          <template for="[step, index] of report.steps">
            <details class="border border-b-0 border-gray-800 bg-gray-900/50 text-sm">
              <summary
                class="flex flex-col md:flex-row md:items-center justify-between gap-2 p-3 bg-gray-800/40 border-b border-gray-800 cursor-pointer"
              >
                <div class="flex items-center gap-3 min-w-0">
                  <lucide-icon
                    class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-gray-700/70"
                    bind-class="{
                    'text-emerald-400': step.status === 'success',
                    'text-rose-400': step.status === 'failed',
                    'text-indigo-400.animate-spin': step.status === 'running',
                    'text-gray-400': !['success', 'failed', 'running'].includes(step.status)
                  }"
                    bind-icon="
                    step.status === 'success'
                      ? 'circle-check'
                      : step.status === 'failed'
                        ? 'circle-x'
                        : step.status === 'running'
                          ? 'loader-circle'
                          : 'circle'
                  "
                    size="15"
                  ></lucide-icon>
                  <template if="step.exitCode !== undefined && step.exitCode !== 0">
                    <span class="font-mono text-gray-500">({{ step.exitCode }})</span>
                  </template>
                  <h3 class="font-semibold text-gray-200 truncate min-w-0 flex-1">{{ step.name }}</h3>
                   <div class="font-mono text-gray-400 shrink-0">{{ step.durationMs }}ms</div>
                  <span
                    class="sr-only px-2.5 py-0.5 rounded-full font-medium"
                    bind-class="{
                    'text-emerald-400.bg-emerald-500/10': step.status === 'success',
                    'text-rose-400.bg-rose-500/10': step.status === 'failed',
                    'text-indigo-400.bg-indigo-500/10': step.status === 'running',
                    'text-gray-400.bg-gray-500/10': !['success', 'failed', 'running'].includes(step.status)
                  }"
                  >
                    {{ upper(step.status) }}
                  </span>
                </div>
              </summary>
              <template if="report.canViewLogs">
                 <div class="relative p-4 bg-gray-950 font-mono text-gray-300 leading-relaxed overflow-auto w-full">
                   <template if="step.status === 'failed'">
                     <button type="button" on-click="askAi(step, $event)" aria-label="Get AI help for failed step" title="Get AI help" class="absolute right-3 top-3 z-10 inline-flex h-7 w-7 items-center justify-center rounded-lg bg-gray-900 text-indigo-300 outline-none hover:bg-indigo-500/10 focus-visible:ring-2 focus-visible:ring-indigo-400/60">
                       <lucide-icon bind-icon="aiLoading && aiStepId === step.id ? 'loader-circle' : 'sparkles'" bind-class="aiLoading && aiStepId === step.id ? 'animate-spin' : ''" size="16"></lucide-icon>
                     </button>
                   </template>
                  <pre class="whitespace-pre-wrap" bind-innerhtml="stepLog(step)"></pre>
                </div>
              </template>
              <template if="!report.canViewLogs">
                <div class="p-4 bg-gray-950 text-sm text-gray-500">Logs are available to authenticated users.</div>
              </template>
            </details>
          </template>
        </section>

        <details class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
          <summary class="cursor-pointer px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-400 outline-none transition hover:bg-gray-800 focus-visible:ring-2 focus-visible:ring-indigo-400/60">
            Trigger Inputs
          </summary>
          <code-block
            language="json"
            theme="atom-one-dark"
            bind-source="inputsJson"
            class="block max-h-[38rem] overflow-auto border-t border-gray-800 bg-gray-950 p-4"
          ></code-block>
        </details>
        <template if="report.workflowSourceYaml">
          <details class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
            <summary class="cursor-pointer px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-400 outline-none transition hover:bg-gray-800 focus-visible:ring-2 focus-visible:ring-indigo-400/60">
              Workflow source YAML · revision {{ report.workflowRevision }}
            </summary>
            <code-block
              language="yaml"
              theme="atom-one-dark"
              bind-source="report.workflowSourceYaml"
              class="block max-h-[38rem] overflow-auto border-t border-gray-800 bg-gray-950 p-4"
            ></code-block>
          </details>
        </template>
        <template if="report.canViewLogs && aiStepId">
          <aside class="fixed bottom-4 left-4 right-4 z-40 mt-4 flex max-h-[70vh] flex-col rounded-2xl border border-indigo-500/30 bg-gray-900/95 p-4 shadow-2xl backdrop-blur lg:left-auto lg:w-[28rem]" aria-labelledby="ai-help-title">
            <div class="flex items-start justify-between gap-3 border-b border-gray-800 pb-3">
              <div><h2 id="ai-help-title" class="font-semibold text-white">AI help</h2><p class="mt-1 text-xs text-gray-500">Ask about a failed step.</p></div>
              <lucide-icon icon="sparkles" size="18" class="text-indigo-300"></lucide-icon>
            </div>
            <div class="min-h-0 flex-1 space-y-3 overflow-y-auto py-3" aria-live="polite">
              <p class="flex items-center gap-2 text-sm text-indigo-300" class-hidden="!aiLoading">
                <lucide-icon icon="loader-circle" size="16" class="animate-spin"></lucide-icon>
                Thinking through the failed step...
              </p>
              <p class="text-sm text-gray-500" class-hidden="aiMessages.length > 0">Select the help icon beside a failed step to start.</p>
              <template for="message of aiMessages">
                <div class="rounded-lg p-3 text-sm" bind-class="message.role === 'assistant' ? 'bg-indigo-500/10.text-gray-200' : 'bg-gray-800.text-gray-300'">
                  <p class="mb-1 text-[10px] font-semibold uppercase tracking-wider text-gray-500">{{ message.role }}</p>
                  <template if="message.html"><div class="ai-markdown text-sm leading-relaxed" bind-innerhtml="message.html"></div></template>
                  <template if="!message.html"><pre class="whitespace-pre-wrap font-sans leading-relaxed">{{ message.content }}</pre></template>
                </div>
              </template>
              <p class="text-sm text-rose-300" class-hidden="!aiError">{{ aiError }}</p>
            </div>
            <form class="border-t border-gray-800 pt-3" on-submit.prevent="askFollowup()">
              <label class="sr-only" for="ai-question">Ask a follow-up question</label>
              <div class="flex gap-2">
                <input id="ai-question" bind-value="aiQuestion" placeholder="Ask a follow-up..." bind-disabled="!aiStepId || aiLoading" class="min-w-0 flex-1 rounded-lg border border-gray-700 bg-gray-950 px-3 py-2 text-sm text-gray-200 outline-none placeholder:text-gray-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 disabled:opacity-50" />
                <button type="submit" aria-label="Ask AI" bind-disabled="!aiStepId || aiLoading" class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-indigo-500 text-white outline-none hover:bg-indigo-400 focus-visible:ring-2 focus-visible:ring-indigo-400/60 disabled:opacity-50"><lucide-icon icon="arrow-up" size="16"></lucide-icon></button>
              </div>
            </form>
          </aside>
        </template>
        <template if="report.canViewLogs && report.artifacts.length">
          <details class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
            <summary class="cursor-pointer px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-400 outline-none transition hover:bg-gray-800 focus-visible:ring-2 focus-visible:ring-indigo-400/60">
              Artifacts
            </summary>
            <ul class="divide-y divide-gray-800 border-t border-gray-800">
              <template for="artifact of report.artifacts">
                <li class="px-4 py-3">
                  <a
                    attr-href="artifactUrl(artifact)"
                    class="font-mono text-sm text-indigo-300 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400/60"
                  >{{ artifact }}</a>
                </li>
              </template>
            </ul>
          </details>
        </template>
      </div>

      <script setup>
         import { computed, onDestroy, onInit, ref } from '@li3/web';
         import { AnsiUp } from 'ansi_up';
         import { marked } from 'marked';

        export default function setup() {
          const jobId = window.location.pathname.split('/').filter(Boolean).pop() || '';
          const report = ref({ jobId });
          const previousRuns = ref([]);
          const aiMessages = ref([]);
          const aiStepId = ref('');
          const aiQuestion = ref('');
          const aiError = ref('');
          const aiLoading = ref(false);
          const manualRestartOpen = ref(false);
          const manualRestartLoading = ref(false);
          const manualInputs = ref([]);
          let previousRunsLoaded = false;
          const now = ref(Date.now());
          const ansiUp = new AnsiUp();
          ansiUp.use_classes = false;
          let eventSource;
          let refreshTimer;
          let clockTimer;
          let refreshing = false;
          let refreshPending = false;
          const cancelling = ref(false);

          const active = computed(() => ['pending', 'running'].includes(report.value.status));
          const inputsJson = computed(() => JSON.stringify(report.value.inputs || {}, null, 2));
          const timing = computed(() => {
            if (report.value.status === 'pending') return 'Waiting for a worker';
            if (report.value.status === 'running') {
              return `Running for ${Math.max(0, now.value - Date.parse(report.value.startedAt))}ms`;
            }
            return `Finished in ${report.value.durationMs}ms`;
          });

          const upper = (value) => String(value || '').toUpperCase();
          const artifactUrl = (path) => `/api/runs/${report.value.jobId}/artifacts/${encodeURIComponent(path)}`;
          const loadPreviousRuns = async () => {
            if (previousRunsLoaded || !report.value.parentId) return;
            const lineage = [];
            const visited = new Set();
            let parentId = report.value.parentId;
            while (parentId && !visited.has(String(parentId)) && lineage.length < 50) {
              visited.add(String(parentId));
              const response = await fetch(`/api/runs/${parentId}`, { headers: { accept: 'application/json' } });
              if (!response.ok) throw new Error(`Previous run request failed: ${response.status}`);
              const parent = await response.json();
              lineage.push({ id: parent.jobId, status: parent.status, startedAt: parent.startedAt });
              parentId = parent.parentId;
            }
            previousRuns.value = lineage;
            previousRunsLoaded = true;
          };
          const stepLog = (step) => {
            if (step.status === 'skipped') return '';
            if (step.status === 'running')
              return '<span class="text-indigo-400">Step is running. Logs will appear after it finishes.</span>';
            if (step.status === 'pending') return '<span class="text-gray-500">Waiting to run.</span>';
            if (step.logContent) return ansiUp.ansi_to_html(step.logContent);
            return '<span class="text-gray-500">(No terminal log output recorded for this step)</span>';
          };
          const sanitizeAiHtml = (html) => {
            const parsed = new DOMParser().parseFromString(html, 'text/html');
            parsed.querySelectorAll('script,style,iframe,object,embed,form').forEach((node) => node.remove());
            parsed.querySelectorAll('*').forEach((element) => {
              [...element.attributes].forEach((attribute) => {
                if (attribute.name.toLowerCase().startsWith('on')) element.removeAttribute(attribute.name);
                if (['href', 'src'].includes(attribute.name.toLowerCase()) && /^(javascript|data):/i.test(attribute.value)) element.removeAttribute(attribute.name);
              });
            });
            return parsed.body.innerHTML;
          };
          const renderAiMarkdown = (content) => sanitizeAiHtml(marked.parse(content));
          const askAi = async (step, event) => {
            event.stopPropagation();
            aiStepId.value = step.id;
            aiMessages.value = [];
            aiQuestion.value = '';
            await requestAiHelp(step.id, 'Please explain why this step failed and what I should do next.');
          };
          const requestAiHelp = async (stepId, question) => {
            aiLoading.value = true;
            aiError.value = '';
            try {
              const response = await fetch(`/api/runs/${report.value.jobId}/ai-help`, {
                method: 'POST',
                headers: { accept: 'application/json', 'content-type': 'application/json' },
                body: JSON.stringify({ stepId, question, conversation: aiMessages.value }),
              });
              if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error || `AI help failed: ${response.status}`);
              }
              aiMessages.value = [...aiMessages.value, { role: 'user', content: question }, { role: 'assistant', content: '' }];
              const reader = response.body.getReader();
              const decoder = new TextDecoder();
              let buffer = '';
              while (true) {
                const chunk = await reader.read();
                if (chunk.done) break;
                buffer += decoder.decode(chunk.value, { stream: true });
                const events = buffer.split('\n\n');
                buffer = events.pop() || '';
                for (const event of events) {
                  const line = event.split('\n').find((value) => value.startsWith('data: '));
                  if (!line) continue;
                  const data = JSON.parse(line.slice(6));
                  if (data.delta) {
                    const messages = [...aiMessages.value];
                    messages[messages.length - 1] = { ...messages[messages.length - 1], content: messages[messages.length - 1].content + data.delta };
                    aiMessages.value = messages;
                  }
                  if (data.error) throw new Error(data.error);
                }
              }
              const messages = [...aiMessages.value];
              const answer = messages.at(-1);
              if (answer) messages[messages.length - 1] = { ...answer, html: renderAiMarkdown(answer.content) };
              aiMessages.value = messages;
            } catch (error) {
              aiError.value = error.message;
            } finally {
              aiLoading.value = false;
            }
          };
          const askFollowup = async () => {
            const question = aiQuestion.value.trim();
            if (!question || !aiStepId.value) return;
            aiQuestion.value = '';
            await requestAiHelp(aiStepId.value, question);
          };
          const restartJob = async () => {
            const response = await fetch(`/restart/${report.value.jobId}`, { method: 'POST' });
            if (response.ok) {
              const { id } = await response.json();
              location.href = `/runs/${id}`;
            }
          };
          const openManualRestart = (event) => {
            event.preventDefault();
            event.stopPropagation();
            manualInputs.value = Object.entries(report.value.inputs || {}).map(([key, value]) => ({ key, value: typeof value === 'string' ? value : JSON.stringify(value) }));
            if (!manualInputs.value.length) manualInputs.value = [{ key: '', value: '' }];
            manualRestartOpen.value = true;
          };
          const closeManualRestart = () => { manualRestartOpen.value = false; };
          const addManualInput = () => { manualInputs.value = [...manualInputs.value, { key: '', value: '' }]; };
          const removeManualInput = (entry) => { manualInputs.value = manualInputs.value.filter((item) => item !== entry); };
          const restartWithInputs = async () => {
            const inputs = Object.fromEntries(manualInputs.value.filter((entry) => entry.key.trim()).map((entry) => [entry.key.trim(), entry.value]));
            manualRestartLoading.value = true;
            try {
              const response = await fetch(`/restart/${report.value.jobId}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ inputs }) });
              if (!response.ok) throw new Error(`Restart failed: ${response.status}`);
              const { id } = await response.json();
              location.href = `/runs/${id}`;
            } catch (error) {
              aiError.value = error.message;
            } finally {
              manualRestartLoading.value = false;
            }
          };
          const cancelJob = async () => {
            if (cancelling.value || report.value.status !== 'running') return;
            cancelling.value = true;
            try {
              const response = await fetch(`/api/jobs/${report.value.jobId}/cancel`, { method: 'POST' });
              if (!response.ok) throw new Error(`Cancel failed: ${response.status}`);
              await refreshRun();
            } catch (error) {
              console.error(error);
            } finally {
              cancelling.value = false;
            }
          };
          const refreshRun = async () => {
            if (refreshing) {
              refreshPending = true;
              return;
            }
            refreshing = true;

            try {
              const response = await fetch(`/api/runs/${jobId}`, {
                headers: { accept: 'application/json' },
              });
              if (!response.ok) throw new Error(`Run refresh failed: ${response.status}`);
              const previousStatus = report.value.status;
              const nextReport = await response.json();
              report.value = nextReport;
              document.title = `Run #${nextReport.jobId} - ${nextReport.workflowName}`;
              void loadPreviousRuns();
              if (
                ['pending', 'running'].includes(previousStatus) &&
                ['success', 'failed'].includes(nextReport.status) &&
                'Notification' in window &&
                'serviceWorker' in navigator &&
                Notification.permission === 'granted' &&
                localStorage.getItem('runner-notifications') === 'enabled'
              ) {
                const registration = await navigator.serviceWorker.ready;
                await registration.showNotification(
                  nextReport.status === 'success'
                    ? `Job #${nextReport.jobId} succeeded`
                    : `Job #${nextReport.jobId} failed`,
                  {
                    body: `${nextReport.workflowName} finished with status ${nextReport.status}.`,
                    icon: '/app-icon.svg',
                    badge: '/app-icon.svg',
                    tag: `runner-job-${nextReport.jobId}`,
                    renotify: true,
                    data: { url: `/runs/${nextReport.jobId}` },
                  },
                );
              }
            } catch (error) {
              console.error(error);
            } finally {
              refreshing = false;
              if (refreshPending) {
                refreshPending = false;
                void refreshRun();
              }
            }
          };
          const handleJobChange = (event) => {
            const data = JSON.parse(event.data || '{}');
            if (!data.jobId || String(data.jobId) === String(report.value.jobId)) void refreshRun();
          };

          onInit(() => {
            void refreshRun();
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.register('/service-worker.js').catch((error) => {
                console.error('Service worker registration failed', error);
              });
            }
            eventSource = new EventSource('/api/events');
            eventSource.addEventListener('jobs.changed', handleJobChange);
            refreshTimer = setInterval(() => {
              if (active.value) void refreshRun();
            }, 60000);
            clockTimer = setInterval(() => {
              now.value = Date.now();
            }, 1000);
          });
          onDestroy(() => {
            eventSource?.close();
            clearInterval(refreshTimer);
            clearInterval(clockTimer);
          });

           return { report, previousRuns, manualRestartOpen, manualRestartLoading, manualInputs, aiMessages, aiStepId, aiQuestion, aiError, aiLoading, inputsJson, timing, upper, artifactUrl, stepLog, askAi, askFollowup, restartJob, openManualRestart, closeManualRestart, addManualInput, removeManualInput, restartWithInputs, cancelJob, cancelling };
        }
      </script>
