<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <title>Workflow Engine Dashboard</title>
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
  </head>
  <body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-6 font-sans">
    <template app>
      <main class="max-w-6xl mx-auto space-y-6">
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-gray-800 pb-4">
          <div>
            <h1 class="text-2xl font-bold text-white">Runner Engine Status</h1>
            <p class="text-xs text-gray-400">Live Job Queue &amp; Execution Traces</p>
          </div>
          <div class="flex flex-wrap items-center gap-3 text-xs font-mono">
            <a href="/workflows" class="text-indigo-400 hover:text-indigo-300 hover:underline">Manage workflows</a>
            <template if="notificationsSupported">
              <button
                class="inline-flex h-9 w-9 items-center justify-center rounded-full border"
                bind-class="notificationsEnabled ? 'border-emerald-500/30.bg-emerald-500/10.text-emerald-300' : 'border-indigo-500/40.bg-indigo-500/10.text-indigo-300'"
                on-click="toggleNotifications()"
              >
                <lucide-icon bind-icon="notificationsEnabled ? 'bell-ring' : 'bell-off'" size="16"></lucide-icon>
                <span class="sr-only">{{ notificationsEnabled ? 'Notifications on' : 'Enable notifications' }}</span>
              </button>
            </template>
            <span class="text-gray-500">Updated {{ lastUpdated }}</span>
            <template if="refreshError">
              <span class="rounded border border-rose-500/20 bg-rose-500/10 px-3 py-1 text-rose-400"
                >Refresh failed</span
              >
            </template>
          </div>
        </header>

        <form class="flex items-center gap-2" on-submit.prevent="applyFilter()">
          <div class="relative min-w-0 flex-1">
            <label class="sr-only" for="job-filter">Filter jobs</label>
            <input
              id="job-filter"
              bind-value="filter"
              on-input="setFilter($event)"
              class="w-full rounded-lg border border-gray-800 bg-gray-900 px-3 py-2 pr-10 text-sm text-gray-200 outline-none placeholder:text-gray-600 focus:border-indigo-500"
              placeholder="Filter: name: cloud-cli/* or search JSON"
            />
            <template if="filter">
              <button
                type="button"
                on-click="clearFilter()"
                class="absolute right-1 top-1/2 -translate-y-1/2 rounded-md p-1 text-gray-500 hover:bg-gray-800 hover:text-gray-200"
              >
                <lucide-icon icon="x" size="15"></lucide-icon>
                <span class="sr-only">Clear job filter</span>
              </button>
            </template>
          </div>
          <button
            type="submit"
            aria-label="Search jobs"
            class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-indigo-500/40 bg-indigo-500/10 text-indigo-200 hover:bg-indigo-500/20"
          >
            <lucide-icon icon="search" size="16"></lucide-icon>
          </button>
        </form>

        <template if="activeFilter">
          <p class="text-xs text-gray-400">
            Showing {{ jobs.length }} jobs matching <span class="font-mono text-indigo-300">{{ activeFilter }}</span>
          </p>
        </template>

         <template if="notificationNotice">
          <button
            class="w-full rounded-lg border border-gray-700 bg-gray-900 px-4 py-3 text-left text-sm text-gray-300"
            on-click="notificationNotice = ''"
          >
            {{ notificationNotice }}
          </button>
        </template>

        <section class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden hidden md:block">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-800/50 text-gray-400 text-xs uppercase font-mono border-b border-gray-800">
              <tr>
                <th class="py-3 px-4">Job ID</th>
                <th class="py-3 px-4">Workflow</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4 hidden xl:table-cell">Worker</th>
                <th class="py-3 px-4 hidden lg:table-cell">Created At</th>
                <th class="py-3 px-4 text-right">Action</th>
              </tr>
            </thead>
            <tbody>
              <template for="job of jobs">
                <tr class="border-b border-gray-800 hover:bg-gray-800/40 transition">
                  <td class="py-3 px-4 font-mono text-indigo-400">
                    <a attr-href="'/runs/' + job.id" class="hover:underline">#{{ job.id }}</a>
                  </td>
                  <td class="py-3 px-4 font-medium text-white">{{ job.workflowId }}</td>
                  <td class="py-3 px-4">
                    <span
                      class="px-2.5 py-0.5 rounded-full text-xs font-semibold"
                      bind-class="{
                      'bg-emerald-500/10.text-emerald-400': job.status === 'success',
                      'bg-rose-500/10.text-rose-400': job.status === 'failed',
                      'bg-indigo-500/10.text-indigo-400.animate-pulse': job.status === 'running',
                      'bg-gray-500/10.text-gray-400': !['success', 'failed', 'running'].includes(job.status)
                    }"
                    >
                      {{ upper(job.status) }}
                    </span>
                  </td>
                  <td class="py-3 px-4 hidden xl:table-cell text-xs font-mono text-gray-400">
                    {{ job.workerId || '-' }}
                  </td>
                  <td class="py-3 px-4 hidden lg:table-cell text-xs text-gray-400">{{ job.createdAt }}</td>
                  <td class="py-3 px-4 text-right whitespace-nowrap">
                    <a
                      attr-href="'/runs/' + job.id"
                      class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1 rounded border border-gray-700"
                      >View Trace</a
                    >
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
         <template if="!jobs.length">
             <div class="p-8 text-center text-gray-500">
               {{ activeFilter ? 'No jobs match the current filter.' : 'No jobs recorded yet.' }}
             </div>
           </template>
        </section>

        <section
          class="md:hidden bg-gray-900 border border-gray-800 rounded-xl divide-y divide-gray-800 overflow-hidden"
        >
          <template for="job of jobs">
            <a
              attr-href="'/runs/' + job.id"
              class="block p-4 bg-gray-900/60 hover:bg-gray-800/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-indigo-400"
            >
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="flex items-center gap-2">
                    <span
                      class="w-2.5 h-2.5 rounded-full shrink-0"
                      bind-class="{
                      'bg-emerald-400': job.status === 'success',
                      'bg-rose-400': job.status === 'failed',
                      'bg-indigo-400.animate-pulse': job.status === 'running',
                      'bg-gray-500': !['success', 'failed', 'running'].includes(job.status)
                    }"
                    ></span>
                    <h2 class="font-medium text-white truncate">{{ job.workflowId }}</h2>
                  </div>
                  <p class="mt-1 pl-[18px] text-xs font-mono text-gray-400">#{{ job.id }} · {{ upper(job.status) }}</p>
                </div>
              </div>
            </a>
          </template>
          <template if="!jobs.length">
             <div class="p-8 text-center text-gray-500">
               {{ activeFilter ? 'No jobs match the current filter.' : 'No jobs recorded yet.' }}
             </div>
          </template>
        </section>

        <template if="hasMore">
          <div class="flex justify-center">
            <button
              class="px-4 py-2 text-sm text-gray-200 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg"
              on-click="loadMore()"
            >
              {{ loadingMore ? 'Loading...' : 'Load more' }}
            </button>
          </div>
        </template>
      </main>

      <script setup>
        import { onDestroy, onInit, ref } from '@li3/web';

        export default function setup() {
          const jobs = ref([]);
          const lastUpdated = ref('now');
          const refreshError = ref(false);
          const hasMore = ref(false);
          const loadingMore = ref(false);
          const filter = ref('');
          const activeFilter = ref('');
          const pushConfigured = ref(false);
          const notificationsSupported = ref('Notification' in window && 'serviceWorker' in navigator);
          const notificationsEnabled = ref(
            notificationsSupported.value &&
              Notification.permission === 'granted' &&
              localStorage.getItem('runner-notifications') === 'enabled',
          );
          const notificationNotice = ref('');
          let refreshTimer;
          let eventSource;
          let refreshing = false;
          let refreshPending = false;
          let searchInProgress = false;
          let refreshGeneration = 0;

          const upper = (value) => String(value || '').toUpperCase();
          const terminalStatuses = new Set(['success', 'failed', 'cancelled']);
          const notifyCompletedJob = async (job) => {
             if (!notificationsEnabled.value || pushConfigured.value || !['success', 'failed'].includes(job.status)) return;
            try {
              const registration = await navigator.serviceWorker.ready;
              await registration.showNotification(
                job.status === 'success' ? `Job #${job.id} succeeded` : `Job #${job.id} failed`,
                {
                  body: `${job.workflowId} finished with status ${job.status}.`,
                  icon: '/app-icon.svg',
                  badge: '/app-icon.svg',
                  tag: `runner-job-${job.id}`,
                  renotify: true,
                  data: { url: `/runs/${job.id}` },
                },
              );
            } catch (error) {
              console.error('Unable to show job notification', error);
            }
          };
          const toggleNotifications = async () => {
            if (notificationsEnabled.value) {
              notificationsEnabled.value = false;
              localStorage.removeItem('runner-notifications');
              await disablePushNotifications();
              notificationNotice.value = 'Job notifications are paused on this device.';
              return;
            }
            if (Notification.permission === 'denied') {
              notificationNotice.value =
                'Notifications are blocked. Allow them in this site’s Android browser settings.';
              return;
            }
            const permission = await Notification.requestPermission();
            notificationsEnabled.value = permission === 'granted';
            if (notificationsEnabled.value) {
              localStorage.setItem('runner-notifications', 'enabled');
              await enablePushNotifications();
              notificationNotice.value =
                'Notifications enabled. Background delivery is available when server push is configured.';
            } else {
              notificationNotice.value = 'Notification permission was not granted.';
            }
          };
          const urlBase64ToUint8Array = (value) => {
            const padding = '='.repeat((4 - (value.length % 4)) % 4);
            const raw = atob((value + padding).replace(/-/g, '+').replace(/_/g, '/'));
            return Uint8Array.from([...raw].map((character) => character.charCodeAt(0)));
          };
          const enablePushNotifications = async () => {
            try {
              if (!notificationsSupported.value) return;
              const response = await fetch('/api/push/public-key', { headers: { accept: 'application/json' } });
              if (!response.ok) return;
              const { publicKey } = await response.json();
              pushConfigured.value = true;
              const registration = await navigator.serviceWorker.ready;
              const subscription =
                (await registration.pushManager.getSubscription()) ||
                (await registration.pushManager.subscribe({
                  userVisibleOnly: true,
                  applicationServerKey: urlBase64ToUint8Array(publicKey),
                }));
              const saveResponse = await fetch('/api/push/subscriptions', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(subscription),
              });
              if (!saveResponse.ok) throw new Error(`Push subscription failed: ${saveResponse.status}`);
            } catch (error) {
              console.error('Unable to enable background notifications', error);
            }
          };
          const disablePushNotifications = async () => {
            try {
              const registration = await navigator.serviceWorker.ready;
              const subscription = await registration.pushManager.getSubscription();
              if (!subscription) return;
              await fetch('/api/push/subscriptions', {
                method: 'DELETE',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ endpoint: subscription.endpoint }),
              });
              await subscription.unsubscribe();
            } catch (error) {
              console.error('Unable to disable background notifications', error);
            }
          };
          const refreshJobs = async (isSearch = false) => {
            if (searchInProgress && !isSearch) return;
            if (refreshing && !isSearch) {
              refreshPending = true;
              return;
            }
            refreshing = true;
            const generation = refreshGeneration;

            try {
              const activeIds = jobs.value
                .filter((job) => !terminalStatuses.has(job.status))
                .map((job) => Number(job.id));
              const knownIds = jobs.value.map((job) => Number(job.id));
              const afterId = activeIds.length
                ? Math.max(0, Math.min(...activeIds) - 1)
                : knownIds.length
                  ? Math.max(...knownIds)
                  : null;
              const filterQuery = activeFilter.value ? `&filter=${encodeURIComponent(activeFilter.value)}` : '';
              const url =
                afterId === null
                  ? `/api/jobs?limit=500${filterQuery}`
                  : `/api/jobs?afterId=${afterId}&limit=500${filterQuery}`;
               const response = await fetch(url, { headers: { accept: 'application/json' } });
               if (!response.ok) throw new Error(`Dashboard refresh failed: ${response.status}`);

               const data = await response.json();
               if (generation !== refreshGeneration) return;
              const previousStatuses = new Map(jobs.value.map((job) => [job.id, job.status]));
              const merged = new Map(jobs.value.map((job) => [job.id, job]));
              for (const job of data.jobs) {
                const previousStatus = previousStatuses.get(job.id);
                merged.set(job.id, job);
                if (previousStatus && !terminalStatuses.has(previousStatus) && terminalStatuses.has(job.status)) {
                  void notifyCompletedJob(job);
                }
              }
               jobs.value = Array.from(merged.values()).sort((a, b) => Number(b.id) - Number(a.id));
              lastUpdated.value = new Date().toLocaleTimeString();
              refreshError.value = false;
            } catch (error) {
              console.error(error);
              refreshError.value = true;
            } finally {
              refreshing = false;
               if (refreshPending && !searchInProgress) {
                 refreshPending = false;
                 void refreshJobs();
               }
            }
          };

          const loadMore = async () => {
            if (loadingMore.value || !hasMore.value || !jobs.value.length) return;
            loadingMore.value = true;

            try {
              const beforeId = Math.min(...jobs.value.map((job) => Number(job.id)));
              const filterQuery = activeFilter.value ? `&filter=${encodeURIComponent(activeFilter.value)}` : '';
              const response = await fetch(`/api/jobs?beforeId=${beforeId}${filterQuery}`, {
                headers: { accept: 'application/json' },
              });
              if (!response.ok) throw new Error(`Loading older jobs failed: ${response.status}`);

             const data = await response.json();
              const merged = new Map(jobs.value.map((job) => [job.id, job]));
              for (const job of data.jobs) merged.set(job.id, job);
             jobs.value = Array.from(merged.values()).sort((a, b) => Number(b.id) - Number(a.id));
              hasMore.value = data.hasMore;
            } catch (error) {
              console.error(error);
              refreshError.value = true;
            } finally {
              loadingMore.value = false;
            }
          };
          const applyFilter = async () => {
            searchInProgress = true;
            refreshGeneration++;
            activeFilter.value = filter.value.trim();
            jobs.value = [];
            hasMore.value = false;
            try {
              await refreshJobs(true);
            } finally {
              searchInProgress = false;
              refreshPending = false;
            }
          };
          const setFilter = (event) => {
            filter.value = event.target.value;
          };
          const clearFilter = async () => {
            searchInProgress = true;
            refreshGeneration++;
            filter.value = '';
            activeFilter.value = '';
            jobs.value = [];
            hasMore.value = false;
            try {
              await refreshJobs(true);
            } finally {
              searchInProgress = false;
              refreshPending = false;
            }
          };

          onInit(() => {
            if (notificationsSupported.value) {
              navigator.serviceWorker
                .register('/service-worker.js')
                .then(() => {
                  if (notificationsEnabled.value) void enablePushNotifications();
                })
                .catch((error) => {
                  console.error('Service worker registration failed', error);
                });
            }
            eventSource = new EventSource('/api/events');
            eventSource.addEventListener('jobs.available', refreshJobs);
            eventSource.addEventListener('jobs.changed', refreshJobs);
            eventSource.onerror = () => {
              refreshError.value = true;
            };
            refreshTimer = setInterval(refreshJobs, 60000);
          });
          onDestroy(() => {
            eventSource?.close();
            clearInterval(refreshTimer);
          });

          return {
            jobs,
            lastUpdated,
            refreshError,
            hasMore,
            loadingMore,
            filter,
            activeFilter,
            pushConfigured,
            setFilter,
            loadMore,
            applyFilter,
            clearFilter,
            upper,
            notificationsSupported,
            notificationsEnabled,
            notificationNotice,
            toggleNotifications,
          };
        }
      </script>
      <script state>
        __DASHBOARD_STATE__
      </script>
    </template>

    <script type="module">
      import '@li3/web';
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
  </body>
</html>
