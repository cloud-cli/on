<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/on.css" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <link rel="component" href="/app-header.html" />
    <title>Runs · Flow</title>
    <script type="importmap">
      { "imports": { "@app/": "/", "@li3/": "https://at-li3.static.apphor.de/" } }
    </script>
  </head>
  <body class="bg-flow-background text-flow-foreground min-h-screen p-4 md:p-6 font-sans">
    <template app>
      <main class="mx-auto max-w-6xl space-y-6 py-6">
        <section class="space-y-4 rounded-2xl border border-flow-border bg-white p-4 md:p-5">
          <template if="refreshError"
            ><p role="status" class="text-sm text-rose-700">Could not refresh runs</p></template
          >
          <form class="grid gap-3 md:grid-cols-[minmax(12rem,1fr)_12rem_12rem_auto]" on-submit.prevent="applyFilter()">
            <label class="sr-only" for="job-filter">Search runs</label>
            <input
              id="job-filter"
              bind-value="filter"
              on-input="setFilter($event)"
              class="min-w-0 rounded-lg border border-flow-border bg-white px-3 py-2 text-sm outline-none focus:border-flow-primary"
              placeholder="Search runs, workflows, or workers"
            />
            <label class="sr-only" for="workflow-filter">Workflow</label>
            <select
              id="workflow-filter"
              bind-value="workflowFilter"
              on-change="setWorkflowFilter($event)"
              class="rounded-lg border border-flow-border bg-white px-3 py-2 text-sm"
            >
              <option value="">All workflows</option>
              <template for="workflow of workflows"
                ><option attr-value="workflow.id">{{ workflow.name }}</option></template
              >
            </select>
            <label class="sr-only" for="worker-filter">Worker</label>
            <select
              id="worker-filter"
              bind-value="workerFilter"
              on-change="setWorkerFilter($event)"
              class="rounded-lg border border-flow-border bg-white px-3 py-2 text-sm"
            >
              <option value="">All workers</option>
              <template for="worker of workers"><option attr-value="worker.id">{{ worker.name }}</option></template>
            </select>
            <button type="submit" class="rounded-lg bg-flow-primary px-4 py-2 text-sm font-medium text-white">
              Search
            </button>
          </form>
          <nav class="flex flex-wrap gap-2" aria-label="Filter runs by status">
            <template for="tab of statusTabs()"
              ><button
                type="button"
                on-click="setStatusFilter(tab.status)"
                attr-aria-pressed="statusFilter === tab.status ? 'true' : 'false'"
                class="relative rounded-full border border-flow-border bg-white px-3 py-1.5 text-sm text-flow-secondary aria-pressed:border-flow-primary aria-pressed:bg-flow-primary aria-pressed:font-semibold aria-pressed:text-white"
                attr-aria-label="'Filter by ' + tab.label + ' (' + tab.count + ')'"
              >
                {{ tab.label }}
                <span
                  class-hidden="statusFilter !== tab.status"
                  class="ml-1 inline-flex h-4 w-4 items-center justify-center rounded-full bg-white/20 text-[10px]"
                  aria-hidden="true"
                  >✓</span
                >
                <span
                  class="ml-2 inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-semibold"
                  bind-class="'bg-flow-panel text-flow-foreground'"
                  ><span>{{ tab.count }}</span></span
                >
              </button></template
            >
          </nav>
          <div class="overflow-x-auto">
            <table class="w-full min-w-[680px] text-left text-sm">
              <thead class="border-b border-flow-border text-xs text-flow-secondary">
                <tr>
                  <th class="px-3 py-3 font-medium">Workflow</th>
                  <th class="px-3 py-3 font-medium">Status</th>
                  <th class="px-3 py-3 font-medium">Worker / queued</th>
                  <th class="px-3 py-3 font-medium">Created</th>
                  <th class="px-3 py-3 font-medium">Updated</th>
                </tr>
              </thead>
              <tbody>
                <template for="job of visibleJobs()"
                  ><tr class="border-b border-flow-border last:border-0 hover:bg-flow-panel">
                    <td class="px-3 py-3">
                      <a attr-href="'/runs/' + job.id" class="font-medium text-flow-foreground hover:underline"
                        >{{ workflowName(job.workflowId) }}</a
                      >
                    </td>
                    <td class="px-3 py-3">
                      <span
                        class="inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs font-semibold"
                        bind-class="statusClass(job.status)"
                        role="status"
                        ><lucide-icon bind-icon="statusIcon(job.status)" size="14"></lucide-icon
                        ><span>{{ job.statusLabel }}</span></span
                      >
                    </td>
                    <td class="px-3 py-3 text-flow-secondary">{{ job.workerId || 'Queued' }}</td>
                    <td class="px-3 py-3 text-flow-secondary">{{ formatDate(job.createdAt) }}</td>
                    <td class="px-3 py-3 text-flow-secondary">{{ formatDate(job.updatedAt) }}</td>
                  </tr></template
                >
              </tbody>
            </table>
            <template if="visibleJobs().length === 0"
              ><p class="p-8 text-center text-sm text-flow-secondary">No runs match these filters.</p></template
            >
          </div>
          <div class="flex items-center justify-between gap-3 border-t border-flow-border pt-3">
            <button
              type="button"
              on-click="previousPage()"
              bind-disabled="page <= 1"
              aria-label="Previous runs"
              class="rounded-lg border border-flow-border bg-white px-3 py-2 text-sm text-flow-foreground disabled:opacity-50"
            >
              Previous
            </button>
            <span class="text-xs text-flow-secondary">Page {{ page }}</span>
            <button
              type="button"
              on-click="nextPage()"
              bind-disabled="!hasNextPage() || loadingMore"
              aria-label="Next runs"
              class="rounded-lg border border-flow-border bg-white px-3 py-2 text-sm text-flow-foreground disabled:opacity-50"
            >
              {{ loadingMore ? 'Loading…' : 'Next' }}
            </button>
          </div>
        </section>
      </main>
      <script setup src="/dashboard.mjs"></script>
    </template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
