<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your workspaces</title>
    <script type="importmap">
      { "imports": { "@app/": "/assets/", "@li3/": "https://at-li3.static.apphor.de/" } }
    </script>
    <link rel="stylesheet" href="/assets/on.css" />
  </head>
  <body class="min-h-screen bg-app-background p-4 font-sans text-app-foreground md:p-6">
    <template app>
      <main class="w-full space-y-5 py-2">
        <section class="flex flex-wrap items-center gap-3 rounded-xl border border-app-border bg-white p-5">
          <h1 class="text-2xl font-semibold">Your workspaces</h1>
          <form
            class="flex w-full flex-wrap items-center gap-2 sm:ml-auto sm:w-auto"
            on-submit.prevent="createTeam($event)"
          >
            <label class="sr-only" for="new-team-name">New workspace name</label>
            <input
              id="new-team-name"
              bind-value="newTeamName"
              on-input="newTeamName = $event.target.value"
              placeholder="New workspace name"
              maxlength="100"
              class="min-w-0 flex-1 rounded-lg border border-app-border px-3 py-2 text-sm sm:min-w-48"
            />
            <button
              type="submit"
              class="whitespace-nowrap rounded-lg bg-app-primary px-4 py-2 text-sm font-medium text-white"
            >
              Create workspace
            </button>
            <p class="w-full text-sm text-app-muted" role="status">{{ message }}</p>
          </form>
        </section>
        <section class="rounded-xl border border-app-border bg-white p-5" aria-label="Workspace list">
          <ul class="grid grid-cols-1 gap-3">
            <template for="team of teams"
              ><li>
                <div
                  class="relative flex min-h-24 items-center gap-4 rounded-xl border border-app-border bg-white p-4 transition hover:border-app-primary/50 hover:shadow-sm sm:p-5"
                >
                  <a
                    attr-href="'/ui/workspaces/' + encodeURIComponent(team.id) + '/runs'"
                    attr-aria-label="'Open ' + team.name + ' recent runs'"
                    class="absolute inset-0 rounded-xl outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-app-primary"
                  ></a>
                  <div class="pointer-events-none min-w-0 flex-1">
                    <span class="block truncate text-lg font-semibold">{{ team.name }}</span>
                    <span class="mt-1 block text-sm text-app-muted">{{ team.role }} · Recent runs</span>
                  </div>
                  <a
                    attr-href="'/ui/workspaces/' + encodeURIComponent(team.id) + '/settings'"
                    attr-aria-label="'Edit ' + team.name + ' settings'"
                    class="relative z-10 inline-flex min-h-10 shrink-0 items-center justify-center rounded-lg border border-app-border bg-white px-3 text-sm font-semibold text-app-secondary outline-none hover:border-app-primary hover:text-app-primary focus-visible:ring-2 focus-visible:ring-app-primary"
                  >
                    Edit
                  </a>
                </div>
              </li></template
            >
          </ul>
        </section>
      </main>
      <script setup src="/assets/teams-landing.mjs"></script>
    </template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
