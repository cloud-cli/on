<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your workspaces</title>
    <script type="importmap">
      { "imports": { "@app/": "/assets/", "@li3/": "https://at-li3.static.apphor.de/" } }
    </script>
    <link rel="stylesheet" href="/assets/on.css" />
  </head>
  <body class="min-h-screen bg-app-background p-4 font-sans text-app-foreground md:p-6">
    <template app>
      <main class="w-full space-y-5 py-2">
        <section
          class="overflow-hidden rounded-2xl border border-app-border bg-white p-4 shadow-sm sm:p-5"
          aria-label="Workspace list"
        >
          <header class="flex flex-wrap items-center justify-between gap-3 border-b border-app-border pb-4">
            <h1 class="text-2xl font-semibold">Workspaces</h1>
            <div class="flex flex-wrap items-center justify-end gap-2">
              <form
                class="flex flex-wrap items-center gap-2"
                on-submit.prevent="createTeam($event)"
                class-hidden="!newTeamFormOpen"
              >
                <label class="sr-only" for="new-team-name">New workspace name</label>
                <input
                  id="new-team-name"
                  ref="newTeamInput"
                  bind-value="newTeamName"
                  on-input="newTeamName = $event.target.value"
                  placeholder="Workspace name"
                  maxlength="100"
                  required
                  class="min-h-11 w-full rounded-lg border border-app-border px-3 py-2 text-sm sm:w-56"
                />
                <button
                  type="submit"
                  class="min-h-11 whitespace-nowrap rounded-lg bg-app-primary px-4 py-2 text-sm font-semibold text-white"
                >
                  Create
                </button>
                <button
                  type="button"
                  on-click="closeCreateForm()"
                  class="min-h-11 rounded-lg border border-app-border px-3 py-2 text-sm font-medium text-app-secondary"
                >
                  Cancel
                </button>
              </form>
              <button
                type="button"
                on-click="toggleCreateForm()"
                class-hidden="newTeamFormOpen"
                aria-controls="new-team-name"
                attr-aria-expanded="newTeamFormOpen ? 'true' : 'false'"
                class="min-h-11 whitespace-nowrap rounded-lg bg-app-primary px-4 py-2 text-sm font-semibold text-white outline-none hover:opacity-90 focus-visible:ring-2 focus-visible:ring-app-primary focus-visible:ring-offset-2"
              >
                <span aria-hidden="true" class="mr-1 text-lg leading-none">+</span>New workspace
              </button>
            </div>
            <p class="w-full text-sm text-app-muted" role="status" aria-live="polite">{{ message }}</p>
          </header>
          <ul class="mt-2 grid grid-cols-1">
            <template for="team of teams"
              ><li>
                <div
                  class="relative flex min-h-14 items-center gap-3 border-b border-app-border px-2 py-2 last:border-b-0 sm:px-4"
                >
                  <a
                    attr-href="'/ui/workspaces/' + encodeURIComponent(team.id) + '/runs'"
                    attr-aria-label="'Open ' + team.name + ' recent runs'"
                    class="absolute inset-0 rounded-lg outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-app-primary"
                  ></a>
                  <div class="pointer-events-none min-w-0 flex-1">
                    <a
                      attr-href="'/ui/workspaces/' + encodeURIComponent(team.id) + '/settings'"
                      class="relative z-10 inline-flex max-w-full items-center gap-2 truncate text-lg font-semibold text-app-foreground hover:text-app-primary sm:text-xl"
                    >
                      {{ team.name }}
                      <span
                        if="team.role === 'admin'"
                        class="h-2 w-2 rounded-full bg-orange-500"
                        role="img"
                        aria-label="Workspace admin"
                        title="Workspace admin"
                      ></span>
                    </a>
                  </div>
                </div></li
            ></template>
          </ul>
        </section>
      </main>
      <script setup src="/assets/teams-landing.mjs"></script>
    </template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
