<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030712" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/", "ansi_up": "https://esm.sh/ansi_up@6.0.6", "diff": "https://unpkg.com/diff@9.0.0/libesm/index.js", "marked": "https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.esm.js" } }
    </script>
    <link rel="component" href="/app-router.html" />
    <link rel="component" href="/app-header.html" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <link rel="component" href="https://sodium.static.apphor.de/code-editor.html" />
    <link rel="component" href="https://sodium.static.apphor.de/code-block.html" />
    <title>On Workflow Runner</title>
  </head>
  <body class="min-h-screen bg-gray-950 text-gray-100 font-sans">
    <script>
      window.runnerApiFetch = (() => {
        const rawFetch = window.fetch.bind(window);
        let token = sessionStorage.getItem('runner-api-token') || '';
        let expiresAt = token ? Number.MAX_SAFE_INTEGER : 0;
        const loadToken = async () => {
          if (token && expiresAt > Date.now() + 30_000) return token;
          const response = await rawFetch('/api/auth/token', { headers: { accept: 'application/json' } });
          if (!response.ok) return '';
          const data = await response.json();
          token = data.access_token || '';
          expiresAt = Number(data.expires_at || 0);
          return token;
        };
        const apiFetch = async (input, init = {}) => {
          const target = new URL(input, window.location.href);
          if (target.origin !== window.location.origin || (!target.pathname.startsWith('/api/') && !target.pathname.startsWith('/restart/'))) {
            return rawFetch(input, init);
          }
          const headers = new Headers(init.headers);
          const accessToken = await loadToken();
          if (accessToken) headers.set('authorization', `Bearer ${accessToken}`);
          return rawFetch(input, { ...init, headers });
        };
        apiFetch.setToken = (value) => {
          token = value || '';
          expiresAt = token ? Number.MAX_SAFE_INTEGER : 0;
          if (token) sessionStorage.setItem('runner-api-token', token);
          else sessionStorage.removeItem('runner-api-token');
        };
        return apiFetch;
      })();
    </script>
    <template app>
      <app-router></app-router>
    </template>
    <script type="module">import '@li3/web';</script>
    <script src="https://cdn.tailwindcss.com"></script>
  </body>
</html>
