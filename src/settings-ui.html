<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runner settings</title>
    <script type="importmap">
      { "imports": { "@app/": "/", "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <link rel="component" href="/app-header.html" />
  </head>
  <body data-page="__SETTINGS_PAGE__" class="min-h-screen bg-gray-950 p-4 font-sans text-gray-100 md:p-6">
    <template app>
      <main class="mx-auto max-w-6xl space-y-5 py-6">
        <app-header title="Settings" subtitle="Human-admin controls and automation credentials" back="/runs" back-label="Back to jobs"></app-header>
        <nav class="flex flex-wrap gap-1 rounded-xl border border-gray-800 bg-gray-900/70 p-1" aria-label="Settings navigation">
          <a href="/settings/workflows" class="rounded-lg px-3 py-2 text-sm text-gray-300 hover:bg-gray-800">Workflows</a>
          <a href="/settings/secrets" class="rounded-lg px-3 py-2 text-sm text-gray-300 hover:bg-gray-800">Secrets</a>
          <a href="/settings/tokens" bind-class="page === 'tokens' ? 'bg-gray-800.text-white' : ''" class="rounded-lg px-3 py-2 text-sm text-gray-300 hover:bg-gray-800">API tokens</a>
          <a href="/settings/notifications" bind-class="page === 'notifications' ? 'bg-gray-800.text-white' : ''" class="rounded-lg px-3 py-2 text-sm text-gray-300 hover:bg-gray-800">Notifications</a>
          <a href="/settings/workers" bind-class="page === 'workers' ? 'bg-gray-800.text-white' : ''" class="rounded-lg px-3 py-2 text-sm text-gray-300 hover:bg-gray-800">Workers</a>
        </nav>

        <template if="page === 'tokens'">
        </template>
        <template if="page === 'notifications'">
          <section class="rounded-2xl border border-gray-800 bg-gray-900/80 p-5" aria-labelledby="notifications-title">
            <h2 id="notifications-title" class="text-lg font-semibold text-white">Notifications</h2>
            <p class="mt-1 text-sm text-gray-400">Receive job completion notifications on this device.</p>
            <button type="button" on-click="toggleNotifications()" class="mt-5 inline-flex items-center gap-2 rounded-lg border border-indigo-500/60 px-4 py-2.5 text-sm font-medium text-indigo-200 outline-none hover:bg-indigo-500/10 focus-visible:ring-2 focus-visible:ring-indigo-400/60">
              <lucide-icon bind-icon="notificationsEnabled ? 'bell-off' : 'bell-ring'" size="16"></lucide-icon>
              {{ notificationsEnabled ? 'Disable notifications' : 'Enable notifications' }}
            </button>
            <p class="mt-3 text-sm text-gray-400" role="status">{{ notificationMessage }}</p>
          </section>
        </template>

        <template if="page === 'workers'">
          <section class="rounded-2xl border border-gray-800 bg-gray-900/80 p-5" aria-labelledby="workers-title">
            <h2 id="workers-title" class="text-lg font-semibold text-white">Workers</h2>
            <p class="mt-1 text-sm text-gray-400">Connected runner status, versions, tags, and load.</p>
            <div class="mt-5 overflow-hidden rounded-xl border border-gray-800"><table class="w-full text-left text-sm"><thead class="bg-gray-950 text-xs uppercase text-gray-500"><tr><th class="px-4 py-3">Worker</th><th class="px-4 py-3">Version</th><th class="px-4 py-3">Tags</th><th class="px-4 py-3">Load</th><th class="px-4 py-3">Last seen</th></tr></thead><tbody><template for="worker of workers"><tr class="border-t border-gray-800"><td class="px-4 py-3 font-mono text-gray-200">{{ worker.workerId }} <span class="ml-2 rounded-full px-2 py-0.5 text-xs" bind-class="worker.online ? 'bg-emerald-500/10.text-emerald-300' : 'bg-gray-800.text-gray-500'">{{ worker.online ? 'online' : 'offline' }}</span></td><td class="px-4 py-3 font-mono text-gray-400">{{ worker.version }}</td><td class="px-4 py-3 text-gray-400">{{ worker.tags.join(', ') }}</td><td class="px-4 py-3 text-gray-400">{{ worker.activeJobs }} / {{ worker.concurrency }}</td><td class="px-4 py-3 text-gray-500">{{ worker.lastSeen }}</td></tr></template></tbody></table><p class="p-5 text-sm text-gray-500" class-hidden="workers.length > 0">No worker heartbeats received yet.</p></div>
          </section>
        </template>

        <template if="page === 'tokens'">
        <section class="rounded-2xl border border-gray-800 bg-gray-900/80 p-5" aria-labelledby="keys-title">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h2 id="keys-title" class="text-lg font-semibold text-white">API keys</h2>
              <p class="mt-1 text-sm text-gray-400">Issue narrowly scoped credentials for automation tools. Keys are shown only once.</p>
            </div>
          </div>
          <div class="mt-5 grid gap-3 rounded-xl border border-gray-800 bg-gray-950/50 p-4 md:grid-cols-[1fr_auto]">
            <label class="sr-only" for="key-name">Key name</label>
            <input id="key-name" bind-value="keyName" on-input="setKeyName($event)" placeholder="Documentation bot" class="rounded-lg border border-gray-700 bg-gray-900 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30" />
            <button type="button" on-click="issueKey()" class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-500 px-4 py-2.5 text-sm font-semibold text-white outline-none hover:bg-indigo-400 focus-visible:ring-2 focus-visible:ring-indigo-400/60"><lucide-icon icon="key-round" size="16"></lucide-icon>Issue key</button>
            <fieldset class="md:col-span-2">
              <legend class="mb-2 text-xs font-semibold uppercase tracking-wider text-gray-500">Scopes</legend>
              <div class="space-y-2">
                <template for="scope of scopeOptions">
                  <label class="group flex cursor-pointer items-center gap-3 text-sm text-gray-300">
                    <input type="checkbox" bind-checked="scope.selected" on-change="toggleScope(scope)" class="peer sr-only" />
                    <span aria-hidden="true" class="flex h-5 w-5 shrink-0 items-center justify-center rounded-md border border-gray-600 bg-gray-900 text-transparent transition peer-checked:border-indigo-400 peer-checked:bg-indigo-500 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400/70 peer-disabled:opacity-50">
                      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3 3 7-7"></path></svg>
                    </span>
                    <span class="group-hover:text-white">{{ scope.label }}</span>
                  </label>
                </template>
              </div>
            </fieldset>
          </div>
          <template if="newToken">
            <div class="mt-4 rounded-xl border border-amber-500/40 bg-amber-500/10 p-4" role="alert">
              <p class="text-sm font-semibold text-amber-200">Copy this key now. It cannot be shown again.</p>
              <code class="mt-2 block select-all break-all rounded bg-gray-950 p-3 font-mono text-xs text-amber-100">{{ newToken }}</code>
            </div>
          </template>
          <h3 class="mt-5 text-xs font-semibold uppercase tracking-wider text-gray-500">Active tokens</h3>
          <ul class="mt-2 space-y-2" aria-label="Active API keys">
            <template for="key of keys">
              <li class="flex items-center justify-between gap-3 rounded-xl border border-gray-800 bg-gray-950/60 px-4 py-3">
                <div class="min-w-0"><p class="truncate text-sm font-medium text-gray-200">{{ key.name }}</p><p class="text-xs text-gray-500">{{ key.scopes.join(', ') }} · created {{ key.created_at }}</p></div>
                <button type="button" on-click="revokeKey(key)" class="shrink-0 rounded-lg p-2 text-rose-300 outline-none hover:bg-rose-500/10 focus-visible:ring-2 focus-visible:ring-rose-400/60" aria-label="Revoke {{ key.name }}" title="Revoke key"><lucide-icon icon="trash" size="16"></lucide-icon></button>
              </li>
            </template>
          </ul>
        </section>
        </template>
        <p class="text-sm text-rose-300" role="alert" class-hidden="!error">{{ error }}</p>
      </main>
      <script setup>
         import { onInit, ref } from '@li3/web';
         import { apiFetch, setApiToken } from '/api-client.mjs';
        export default function () {
          const page = document.body.dataset.page;
           const keys = ref([]);
           const workers = ref([]);
          const keyName = ref('');
          const newToken = ref('');
          const error = ref('');
          const notificationsSupported = ref('Notification' in window && 'serviceWorker' in navigator);
          const notificationsEnabled = ref(notificationsSupported.value && Notification.permission === 'granted' && localStorage.getItem('runner-notifications') === 'enabled');
          const notificationMessage = ref('');
          const scopeOptions = ref([
            { name: 'workflows:read', label: 'Read workflows', selected: true },
            { name: 'workflows:write', label: 'Modify workflows', selected: false },
            { name: 'logs:read', label: 'Read logs', selected: false },
            { name: 'artifacts:read', label: 'Read artifacts', selected: false },
            { name: 'runs:control', label: 'Control runs', selected: false },
            { name: 'runs:dispatch', label: 'Dispatch runs', selected: false },
          ]);
           const api = async (url, options = {}) => { const response = await apiFetch(url, { headers: { accept: 'application/json', ...(options.body ? { 'content-type': 'application/json' } : {}) }, ...options }); const body = await response.json().catch(() => ({})); if (!response.ok) throw new Error(body.error || `Request failed: ${response.status}`); return body; };
           const load = async () => { keys.value = (await api('/api/api-keys')).keys; };
           const loadWorkers = async () => { workers.value = (await api('/api/workers')).workers; };
           const issueKey = async () => { try { error.value = ''; const result = await api('/api/api-keys', { method: 'POST', body: JSON.stringify({ name: keyName.value, scopes: scopeOptions.value.filter((scope) => scope.selected).map((scope) => scope.name) }) }); newToken.value = result.token; setApiToken(result.token); keyName.value = ''; await load(); } catch (reason) { error.value = reason.message; } };
          const revokeKey = async (key) => { if (!confirm(`Revoke ${key.name}?`)) return; try { await api(`/api/api-keys/${key.id}`, { method: 'DELETE' }); await load(); } catch (reason) { error.value = reason.message; } };
          const setKeyName = (event) => { keyName.value = event.target.value; };
          const toggleScope = (scope) => { scope.selected = !scope.selected; };
          const toggleNotifications = async () => {
            if (notificationsEnabled.value) {
              notificationsEnabled.value = false;
              localStorage.removeItem('runner-notifications');
              notificationMessage.value = 'Notifications disabled on this device.';
              return;
            }
            if (!notificationsSupported.value) { notificationMessage.value = 'Notifications are not supported by this browser.'; return; }
            const permission = await Notification.requestPermission();
            notificationsEnabled.value = permission === 'granted';
            if (notificationsEnabled.value) { localStorage.setItem('runner-notifications', 'enabled'); notificationMessage.value = 'Notifications enabled.'; }
            else notificationMessage.value = 'Notification permission was not granted.';
          };
          onInit(() => { if (page === 'tokens') load().catch((reason) => { error.value = reason.message; }); if (page === 'workers') loadWorkers().catch((reason) => { error.value = reason.message; }); });
          return { page, keys, workers, keyName, newToken, error, scopeOptions, issueKey, revokeKey, setKeyName, toggleScope, notificationsEnabled, notificationMessage, toggleNotifications };
        }
      </script>
    </template>
    <script type="module">import '@li3/web';</script>
    <script src="https://cdn.tailwindcss.com"></script>
  </body>
</html>
