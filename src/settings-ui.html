<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runner settings</title>
    <script type="importmap">
      { "imports": { "@app/": "/", "@li3/": "https://at-li3.static.apphor.de/" } }
    </script>
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <link rel="stylesheet" href="/on.css" />
  </head>
  <body data-page="__SETTINGS_PAGE__" class="min-h-screen bg-flow-background p-4 font-sans text-flow-foreground md:p-6">
    <template app>
      <main class="mx-auto max-w-6xl space-y-5 py-6">
        <h1 class="sr-only">Settings</h1>
        <nav
          class="sticky top-0 z-20 mb-6 flex flex-wrap gap-2 rounded-xl border border-flow-border bg-flow-card/95 p-1 shadow-sm backdrop-blur"
          aria-label="Settings section navigation"
        >
          <a href="#section-timezone" class="rounded-lg px-3 py-2 text-sm text-flow-secondary hover:bg-flow-background"
            >Timezone</a
          >
          <a href="#section-keys" class="rounded-lg px-3 py-2 text-sm text-flow-secondary hover:bg-flow-background"
            >API keys</a
          >
          <a
            href="#section-notifications"
            class="rounded-lg px-3 py-2 text-sm text-flow-secondary hover:bg-flow-background"
            >Notifications</a
          >
          <a
            href="#section-workers"
            class="rounded-lg px-3 py-2 text-sm text-flow-secondary hover:bg-flow-background"
            class-hidden="!workersLoaded || workersForbidden"
            >Workers</a
          >
          <a
            href="#section-runners"
            class="rounded-lg px-3 py-2 text-sm text-flow-secondary hover:bg-flow-background"
            class-hidden="!runnersLoaded || runnersForbidden"
            >Runners</a
          >
          <a
            href="#section-users"
            class="rounded-lg px-3 py-2 text-sm text-flow-secondary hover:bg-flow-background"
            class-hidden="!usersLoaded || usersForbidden"
            >Users</a
          >
          <a href="#section-secrets" class="rounded-lg px-3 py-2 text-sm text-flow-secondary hover:bg-flow-background"
            >Secrets</a
          >
        </nav>
        <section
          id="section-timezone"
          class="scroll-mt-6 rounded-xl border border-flow-border bg-white p-5"
          aria-labelledby="timezone-title"
        >
          <h2 id="timezone-title" class="text-lg font-semibold">Your timezone</h2>
          <p class="mt-1 text-sm text-flow-muted">Used to display worker and API token timestamps.</p>
          <label for="timezone" class="mt-4 block text-sm font-medium">Timezone</label>
          <input
            id="timezone"
            type="text"
            list="timezone-options"
            bind-value="timezone"
            on-change="saveTimezone($event)"
            placeholder="Search or type an IANA timezone"
            autocomplete="off"
            class="mt-2 w-full max-w-md rounded-lg border border-flow-border bg-white px-3 py-2 text-sm"
          />
          <datalist id="timezone-options">
            <template for="zone of timezones"><option attr-value="zone"></option></template>
          </datalist>
          <p class="mt-2 text-sm text-flow-muted" role="status">{{ preferenceMessage }}</p>
        </section>
        <section
          id="section-keys"
          class="scroll-mt-6 rounded-xl border border-flow-border bg-white p-5"
          aria-labelledby="keys-title"
        >
          <h2 id="keys-title" class="text-lg font-semibold">API keys</h2>
          <p class="mt-1 text-sm text-flow-muted">
            Issue narrowly scoped credentials for automation tools. Keys are shown only once.
          </p>
          <details
            ref="apiKeyForm"
            class="mb-5 mt-5 overflow-hidden rounded-lg border border-flow-border bg-flow-panel"
          >
            <summary
              class="flex cursor-pointer list-none items-center justify-between px-4 py-3 text-sm font-medium text-flow-secondary outline-none hover:bg-flow-panel focus-visible:ring-2 focus-visible:ring-flow-primary/40"
            >
              <span>New API key</span>
              <lucide-icon icon="plus" size="17"></lucide-icon>
            </summary>
            <div class="space-y-3 border-t border-flow-border p-4">
              <label class="sr-only" for="key-name">Key name</label>
              <input
                id="key-name"
                bind-value="keyName"
                on-input="setKeyName($event)"
                placeholder="Documentation bot"
                class="w-full rounded-lg border border-flow-border bg-flow-panel px-3 py-2.5 text-sm outline-none transition placeholder:text-flow-secondary focus:border-flow-primary focus:ring-2 focus:ring-flow-primary/20"
              />
              <fieldset>
                <legend class="mb-2 text-xs font-semibold uppercase tracking-wider text-flow-muted">Scopes</legend>
                <div class="space-y-2">
                  <template for="scope of scopeOptions"
                    ><label class="flex cursor-pointer items-center gap-3 text-sm"
                      ><input type="checkbox" bind-checked="scope.selected" on-change="toggleScope(scope)" /><span
                        >{{ scope.label }}</span
                      ></label
                    ></template
                  >
                </div>
              </fieldset>
              <div>
                <button
                  type="button"
                  on-click="issueKey()"
                  class="inline-flex items-center justify-center gap-2 rounded-lg border border-flow-primary/60 px-3 py-2.5 text-sm font-medium text-flow-primary outline-none transition hover:bg-flow-primary/10 focus-visible:ring-2 focus-visible:ring-flow-primary/40"
                >
                  <lucide-icon icon="key-round" size="16"></lucide-icon>Generate API key
                </button>
              </div>
            </div>
          </details>
          <h3 class="mt-5 text-xs font-semibold uppercase tracking-wider text-flow-muted" class-hidden="!keys.length">
            Active tokens
          </h3>
          <ul class="mt-2 space-y-2" aria-label="Active API keys">
            <template for="key of keys"
              ><li
                class="rounded-lg border border-flow-border px-4 py-3"
                bind-class="key.isNew ? 'border-[#38704566].bg-[#e8f0e580].shadow-sm' : ''"
              >
                <div class="flex items-center justify-between gap-3">
                  <div>
                    <p class="text-sm font-medium">{{ key.name }}</p>
                    <p class="text-xs text-flow-muted">
                      {{ key.scopes.join(', ') }} · created {{ formatTimestamp(key.created_at) }}
                    </p>
                  </div>
                  <button
                    type="button"
                    on-click="revokeKey(key)"
                    class="rounded-lg p-2 text-rose-700"
                    attr-aria-label="'Revoke ' + key.name"
                  >
                    Revoke
                  </button>
                </div>
                <template if="key.token"
                  ><div class="mt-3 rounded-lg border border-flow-primary/20 bg-white p-3" role="alert">
                    <p class="text-xs font-semibold text-flow-primary">Copy this key now. It cannot be shown again.</p>
                    <code class="mt-2 block select-all break-all rounded bg-flow-panel p-2 font-mono text-xs"
                      >{{ key.token }}</code
                    >
                  </div></template
                >
              </li></template
            >
          </ul>
        </section>
        <section id="section-notifications" class="scroll-mt-6 rounded-xl border border-flow-border bg-white p-5">
          <h2 class="text-lg font-semibold">Notifications</h2>
          <p class="mt-1 text-sm text-flow-muted">Receive job completion notifications on this device.</p>
          <button
            type="button"
            on-click="toggleNotifications()"
            class="mt-5 rounded-lg border border-flow-border px-4 py-2.5 text-sm font-medium"
          >
            {{ notificationsEnabled ? 'Disable notifications' : 'Enable notifications' }}
          </button>
          <p class="mt-3 text-sm text-flow-muted" role="status">{{ notificationMessage }}</p>
        </section>
        <section
          id="section-workers"
          class="scroll-mt-6 rounded-xl border border-flow-border bg-white p-5"
          class-hidden="!workersLoaded || workersForbidden"
        >
          <h2 class="text-lg font-semibold">Workers</h2>
          <p class="mt-1 text-sm text-flow-muted">Connected runner status, versions, tags, and load.</p>
          <div class="mt-5 overflow-x-auto rounded-xl border border-flow-border">
            <table class="w-full text-left text-sm">
              <thead class="bg-flow-background text-xs uppercase text-flow-muted">
                <tr>
                  <th class="w-1/5 px-4 py-3">Worker</th>
                  <th class="w-1/6 px-4 py-3">Version</th>
                  <th class="w-1/5 px-4 py-3">Tags</th>
                  <th class="w-1/6 px-4 py-3">Load</th>
                  <th class="w-[27%] px-4 py-3">Last seen</th>
                </tr>
              </thead>
              <tbody>
                <template for="worker of workers"
                  ><tr class="border-t border-flow-border">
                    <td class="max-w-0 truncate px-4 py-3 font-mono" attr-title="worker.workerId">
                      {{ worker.workerId }} · {{ worker.online ? 'online' : 'offline' }}
                    </td>
                    <td class="truncate px-4 py-3">{{ worker.version }}</td>
                    <td class="truncate px-4 py-3" attr-title="worker.tags.join(', ')">{{ worker.tags.join(', ') }}</td>
                    <td class="whitespace-nowrap px-4 py-3">{{ worker.activeJobs }} / {{ worker.concurrency }}</td>
                    <td class="whitespace-nowrap px-4 py-3">{{ formatTimestamp(worker.lastSeen) }}</td>
                  </tr></template
                >
              </tbody>
            </table>
            <p class="p-5 text-sm text-flow-muted" class-hidden="workers.length > 0">
              No worker heartbeats received yet.
            </p>
          </div>
        </section>
        <section
          id="section-runners"
          class="scroll-mt-6 rounded-xl border border-flow-border bg-white p-5"
          class-hidden="!runnersLoaded || runnersForbidden"
        >
          <h2 class="text-lg font-semibold">Runner management</h2>
          <p class="mt-1 text-sm text-flow-muted">
            Enroll and manage registered runners. Refresh to see current status and capacity.
          </p>
          <div class="mt-4 flex flex-wrap items-center gap-3">
            <button
              type="button"
              on-click="createEnrollment()"
              class="rounded-lg border border-flow-primary/60 px-3 py-2 text-sm font-medium text-flow-primary"
            >
              Create shared enrollment code
            </button>
            <button
              type="button"
              on-click="loadRunners()"
              class="rounded-lg border border-flow-border px-3 py-2 text-sm"
            >
              Refresh runners
            </button>
          </div>
          <div
            class="mt-4 rounded-lg border border-flow-primary/20 bg-flow-panel p-3"
            role="alert"
            class-hidden="!enrollmentCode"
          >
            <p class="text-sm font-semibold">Copy this enrollment code now. It is shown only once.</p>
            <code class="mt-2 block select-all break-all font-mono text-sm">{{ enrollmentCode }}</code>
            <p class="mt-2 text-xs text-flow-muted">Expires {{ formatTimestamp(enrollmentExpiresAt) }}</p>
          </div>
          <p class="mt-3 text-sm text-flow-muted" role="status">{{ runnerMessage }}</p>
          <div class="mt-4 overflow-x-auto rounded-xl border border-flow-border">
            <table class="w-full text-left text-sm">
              <thead class="bg-flow-background text-xs uppercase text-flow-muted">
                <tr>
                  <th class="px-4 py-3">Runner</th>
                  <th class="px-4 py-3">Status</th>
                  <th class="px-4 py-3">Capacity</th>
                  <th class="px-4 py-3">Runtime</th>
                  <th class="px-4 py-3">Version</th>
                  <th class="px-4 py-3">Tags</th>
                  <th class="px-4 py-3">Action</th>
                </tr>
              </thead>
              <tbody>
                <template for="runner of runners"
                  ><tr class="border-t border-flow-border">
                    <td class="px-4 py-3">{{ runner.name }}</td>
                    <td class="px-4 py-3">{{ runner.status }}</td>
                    <td class="px-4 py-3">{{ runner.activeJobs }} / {{ runner.concurrency }}</td>
                    <td class="px-4 py-3">{{ runner.runtime }}</td>
                    <td class="px-4 py-3">{{ runner.version }}</td>
                    <td class="px-4 py-3">{{ runner.capabilities.join(', ') }}</td>
                    <td class="px-4 py-3">
                      <button
                        type="button"
                        on-click="revokeRunner(runner)"
                        attr-aria-label="'Revoke ' + runner.name"
                        class="rounded-lg border border-rose-300 px-3 py-1.5 text-rose-700"
                      >
                        Revoke
                      </button>
                    </td>
                  </tr></template
                >
              </tbody>
            </table>
            <p class="p-5 text-sm text-flow-muted" class-hidden="runners.length > 0">No registered runners.</p>
          </div>
        </section>
        <section
          id="section-users"
          class="scroll-mt-6 rounded-xl border border-flow-border bg-white p-5"
          class-hidden="!usersLoaded || usersForbidden"
        >
          <h2 class="text-lg font-semibold">Users</h2>
          <p class="mt-1 text-sm text-flow-muted">Manage access for this runner.</p>
          <ul class="mt-4 space-y-2">
            <template for="user of users"
              ><li class="flex items-center justify-between gap-3 rounded-lg border border-flow-border p-4">
                <span
                  ><span class="block text-sm font-medium">{{ user.name || user.email || 'Account' }}</span
                  ><span class="block text-xs text-flow-muted"
                    >{{ user.name && user.email ? user.email : user.role }}</span
                  ></span
                ><button
                  type="button"
                  on-click="toggleRole(user)"
                  attr-aria-label="'Change role for ' + (user.name || user.email || 'account')"
                  class="rounded-lg border border-flow-border px-3 py-2 text-sm"
                >
                  {{ user.role === 'admin' ? 'Remove admin' : 'Make admin' }}
                </button>
              </li></template
            >
          </ul>
        </section>
        <section
          id="section-secrets"
          class="scroll-mt-6 secrets-panel rounded-xl border border-flow-border bg-flow-card p-4 shadow-sm shadow-flow-foreground/5 sm:p-5"
          aria-labelledby="secrets-title"
        >
          <div class="mb-5 flex items-start justify-between gap-3">
            <div class="flex items-start gap-3">
              <div>
                <h2 id="secrets-title" class="text-lg font-semibold text-flow-foreground">Secrets</h2>
                <p class="mt-0.5 text-sm text-flow-secondary">Write-only credentials available to workflows.</p>
              </div>
            </div>
          </div>
          <details ref="secretForm" class="mb-5 overflow-hidden rounded-lg border border-flow-border bg-flow-panel">
            <summary
              class="flex cursor-pointer list-none items-center justify-between px-4 py-3 text-sm font-medium text-flow-secondary outline-none hover:bg-flow-panel focus-visible:ring-2 focus-visible:ring-flow-primary/40"
            >
              <span>Add a secret</span>
              <lucide-icon icon="plus" size="17"></lucide-icon>
            </summary>
            <div class="space-y-3 border-t border-flow-border p-4">
              <p class="text-xs text-flow-secondary">Saving an existing name replaces its encrypted value.</p>
              <label class="sr-only" for="secret-name">Secret name</label>
              <input
                id="secret-name"
                bind-value="secretName"
                on-input="setSecretName($event)"
                class="rounded-lg border border-flow-border bg-flow-panel px-3 py-2.5 font-mono text-sm uppercase outline-none transition placeholder:text-flow-secondary focus:border-flow-primary focus:ring-2 focus:ring-flow-primary/20"
                placeholder="NPM_TOKEN"
              />
              <label class="inline-flex items-center gap-2 text-sm text-flow-secondary">
                <input
                  type="checkbox"
                  bind-checked="fileMode"
                  on-change="setFileMode($event)"
                  class="h-4 w-4 rounded border-flow-border bg-flow-panel text-indigo-500 focus:ring-2 focus:ring-flow-primary/20"
                />
                Binary file secret
              </label>
              <template if="!fileMode">
                <label class="sr-only" for="secret-value">Text secret value</label>
                <input
                  id="secret-value"
                  ref="secretValueInput"
                  bind-value="secretValue"
                  on-input="setSecretValue($event)"
                  type="password"
                  class="rounded-lg border border-flow-border bg-flow-panel px-3 py-2.5 font-mono text-sm outline-none transition placeholder:text-flow-secondary focus:border-flow-primary focus:ring-2 focus:ring-flow-primary/20"
                  placeholder="New secret value"
                />
              </template>
              <template if="fileMode">
                <label class="sr-only" for="secret-file">Binary secret file</label>
                <input
                  id="secret-file"
                  ref="secretFileInput"
                  on-change="setSecretFile($event)"
                  type="file"
                  class="rounded-lg border border-flow-border bg-flow-panel px-3 py-2 text-xs text-flow-secondary file:mr-3 file:rounded file:border-0 file:bg-flow-secondary file:px-2 file:py-1 file:text-xs file:text-flow-foreground focus:border-flow-primary focus:outline-none focus:ring-2 focus:ring-flow-primary/20"
                />
              </template>
              <div>
                <button
                  type="button"
                  aria-label="Save secret value"
                  title="Save secret value"
                  on-click="saveSecret()"
                  bind-disabled="busy"
                  class="inline-flex items-center justify-center gap-2 rounded-lg border border-flow-primary/60 px-3 py-2.5 text-sm font-medium text-flow-primary outline-none transition hover:bg-flow-primary/10 focus-visible:ring-2 focus-visible:ring-flow-primary/40 disabled:opacity-50"
                >
                  <lucide-icon icon="lock-keyhole" size="16"></lucide-icon>Save secret
                </button>
              </div>
            </div>
          </details>
          <ul class="grid gap-2" aria-label="Saved secrets">
            <template for="name of secrets">
              <li>
                <div
                  class="grid min-h-14 grid-cols-[minmax(0,1fr)_2rem] items-center gap-2 rounded-lg border border-flow-border bg-flow-panel px-3.5 py-3"
                >
                  <button
                    type="button"
                    on-click="selectSecret(name)"
                    class="group grid min-w-0 grid-cols-[2rem_minmax(0,1fr)_auto_1rem] items-center gap-3 text-left outline-none focus-visible:ring-2 focus-visible:ring-flow-primary/40"
                    attr-aria-label="'Edit secret ' + name"
                  >
                    <span
                      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-flow-sidebar text-flow-secondary group-hover:text-flow-primary"
                      ><lucide-icon icon="key-round" size="15"></lucide-icon
                    ></span>
                    <span class="min-w-0 flex-1 truncate font-mono text-sm text-flow-foreground">{{ name }}</span>
                    <span class="text-xs text-flow-secondary">Select</span>
                    <lucide-icon
                      icon="chevron-right"
                      size="16"
                      class="text-flow-secondary transition group-hover:text-flow-primary"
                    ></lucide-icon>
                  </button>
                  <button
                    type="button"
                    on-click="removeSecret(name)"
                    attr-aria-label="'Delete secret ' + name"
                    title="Delete secret"
                    class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-flow-error outline-none transition hover:bg-flow-error/10 focus-visible:ring-2 focus-visible:ring-flow-error/40"
                  >
                    <lucide-icon icon="trash" size="15"></lucide-icon>
                  </button>
                </div>
              </li>
            </template>
          </ul>
          <div
            class="rounded-xl border border-dashed border-flow-border px-4 py-8 text-center"
            class-hidden="secrets.length > 0"
          >
            <lucide-icon icon="key-round" size="22" class="mx-auto text-flow-secondary"></lucide-icon>
            <p class="mt-2 text-sm font-medium text-flow-secondary">No secrets configured</p>
            <p class="mt-1 text-xs text-flow-secondary">Add one above to make it available to a workflow.</p>
          </div>
        </section>
        <p class="text-sm text-rose-700" role="alert" class-hidden="!error">{{ error }}</p>
      </main>
      <script setup src="/settings-ui.mjs"></script>
    </template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
