<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runner settings</title>
    <script type="importmap">
      { "imports": { "@app/": "/", "@li3/": "https://at-li3.static.apphor.de/" } }
    </script>
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <link rel="stylesheet" href="/on.css" />
    <link rel="component" href="/app-header.html" />
  </head>
  <body data-page="__SETTINGS_PAGE__" class="min-h-screen bg-flow-background p-4 font-sans text-flow-foreground md:p-6">
    <template app>
      <main class="mx-auto max-w-6xl space-y-5 py-6">
        <app-header
          title="Settings"
          subtitle="Account and automation settings"
          back="/runs"
          back-label="Back to jobs"
        ></app-header>
        <nav
          class="flex flex-wrap gap-1 rounded-xl border border-flow-border bg-white p-1"
          aria-label="Settings navigation"
        >
          <a href="/settings/secrets" class="rounded-lg px-3 py-2 text-sm text-flow-muted hover:bg-flow-background"
            >Secrets</a
          >
          <a
            href="/settings/tokens"
            bind-class="page === 'tokens' ? 'bg-flow-background.text-flow-foreground' : ''"
            class="rounded-lg px-3 py-2 text-sm text-flow-muted hover:bg-flow-background"
            >API tokens</a
          >
          <a
            href="/settings/notifications"
            bind-class="page === 'notifications' ? 'bg-flow-background.text-flow-foreground' : ''"
            class="rounded-lg px-3 py-2 text-sm text-flow-muted hover:bg-flow-background"
            >Notifications</a
          >
          <a
            href="/settings/workers"
            bind-class="page === 'workers' ? 'bg-flow-background.text-flow-foreground' : ''"
            class="rounded-lg px-3 py-2 text-sm text-flow-muted hover:bg-flow-background"
            >Workers</a
          >
          <a
            href="/settings/admin"
            bind-class="page === 'admin' ? 'bg-flow-background.text-flow-foreground' : ''"
            class="rounded-lg px-3 py-2 text-sm text-flow-muted hover:bg-flow-background"
            >Admin</a
          >
          <a
            href="/settings/timezone"
            bind-class="page === 'timezone' ? 'bg-flow-background.text-flow-foreground' : ''"
            class="rounded-lg px-3 py-2 text-sm text-flow-muted hover:bg-flow-background"
            >Timezone</a
          >
        </nav>
        <section class="rounded-2xl border border-flow-border bg-white p-5" aria-labelledby="timezone-title">
          <h2 id="timezone-title" class="text-lg font-semibold">Your timezone</h2>
          <p class="mt-1 text-sm text-flow-muted">Used to display worker and API token timestamps.</p>
          <label for="timezone" class="mt-4 block text-sm font-medium">Timezone</label>
          <select
            id="timezone"
            bind-value="timezone"
            on-change="saveTimezone($event)"
            class="mt-2 max-w-md rounded-lg border border-flow-border bg-white px-3 py-2 text-sm"
          >
            <template for="zone of timezones"><option attr-value="zone">{{ zone }}</option></template>
          </select>
          <p class="mt-2 text-sm text-flow-muted" role="status">{{ preferenceMessage }}</p>
        </section>
        <template if="page === 'tokens'"
          ><section class="rounded-2xl border border-flow-border bg-white p-5" aria-labelledby="keys-title">
            <h2 id="keys-title" class="text-lg font-semibold">API keys</h2>
            <p class="mt-1 text-sm text-flow-muted">
              Issue narrowly scoped credentials for automation tools. Keys are shown only once.
            </p>
            <div
              class="mt-5 grid gap-3 rounded-xl border border-flow-border bg-flow-background p-4 md:grid-cols-[1fr_auto]"
            >
              <label class="sr-only" for="key-name">Key name</label
              ><input
                id="key-name"
                bind-value="keyName"
                on-input="setKeyName($event)"
                placeholder="Documentation bot"
                class="rounded-lg border border-flow-border bg-white px-3 py-2.5 text-sm"
              />
              <button
                type="button"
                on-click="issueKey()"
                class="rounded-lg bg-flow-primary px-4 py-2.5 text-sm font-semibold text-white"
              >
                Issue key
              </button>
              <fieldset class="md:col-span-2">
                <legend class="mb-2 text-xs font-semibold uppercase tracking-wider text-flow-muted">Scopes</legend>
                <div class="space-y-2">
                  <template for="scope of scopeOptions"
                    ><label class="flex cursor-pointer items-center gap-3 text-sm"
                      ><input type="checkbox" bind-checked="scope.selected" on-change="toggleScope(scope)" />{{
                      scope.label }}</label
                    ></template
                  >
                </div>
              </fieldset>
            </div>
            <template if="newToken"
              ><div class="mt-4 rounded-xl border border-amber-300 bg-amber-50 p-4" role="alert">
                <p class="text-sm font-semibold">Copy this key now. It cannot be shown again.</p>
                <code class="mt-2 block select-all break-all rounded bg-white p-3 font-mono text-xs"
                  >{{ newToken }}</code
                >
              </div></template
            >
            <h3 class="mt-5 text-xs font-semibold uppercase tracking-wider text-flow-muted">Active tokens</h3>
            <ul class="mt-2 space-y-2" aria-label="Active API keys">
              <template for="key of keys"
                ><li class="flex items-center justify-between gap-3 rounded-xl border border-flow-border px-4 py-3">
                  <div>
                    <p class="text-sm font-medium">{{ key.name }}</p>
                    <p class="text-xs text-flow-muted">
                      {{ key.scopes.join(', ') }} · created {{ formatTimestamp(key.created_at) }}
                    </p>
                  </div>
                  <button
                    type="button"
                    on-click="revokeKey(key)"
                    class="rounded-lg p-2 text-rose-700"
                    aria-label="Revoke {{ key.name }}"
                  >
                    Revoke
                  </button>
                </li></template
              >
            </ul>
          </section></template
        >
        <template if="page === 'notifications'"
          ><section class="rounded-2xl border border-flow-border bg-white p-5">
            <h2 class="text-lg font-semibold">Notifications</h2>
            <p class="mt-1 text-sm text-flow-muted">Receive job completion notifications on this device.</p>
            <button
              type="button"
              on-click="toggleNotifications()"
              class="mt-5 rounded-lg border border-flow-border px-4 py-2.5 text-sm font-medium"
            >
              {{ notificationsEnabled ? 'Disable notifications' : 'Enable notifications' }}
            </button>
            <p class="mt-3 text-sm text-flow-muted" role="status">{{ notificationMessage }}</p>
          </section></template
        >
        <template if="page === 'workers'"
          ><section class="rounded-2xl border border-flow-border bg-white p-5">
            <h2 class="text-lg font-semibold">Workers</h2>
            <p class="mt-1 text-sm text-flow-muted">Connected runner status, versions, tags, and load.</p>
            <div class="mt-5 overflow-x-auto rounded-xl border border-flow-border">
              <table class="w-full text-left text-sm">
                <thead class="bg-flow-background text-xs uppercase text-flow-muted">
                  <tr>
                    <th class="w-1/5 px-4 py-3">Worker</th>
                    <th class="w-1/6 px-4 py-3">Version</th>
                    <th class="w-1/5 px-4 py-3">Tags</th>
                    <th class="w-1/6 px-4 py-3">Load</th>
                    <th class="w-[27%] px-4 py-3">Last seen</th>
                  </tr>
                </thead>
                <tbody>
                  <template for="worker of workers"
                    ><tr class="border-t border-flow-border">
                      <td class="max-w-0 truncate px-4 py-3 font-mono" title="{{ worker.workerId }}">
                        {{ worker.workerId }} · {{ worker.online ? 'online' : 'offline' }}
                      </td>
                      <td class="truncate px-4 py-3">{{ worker.version }}</td>
                      <td class="truncate px-4 py-3" title="{{ worker.tags.join(', ') }}">
                        {{ worker.tags.join(', ') }}
                      </td>
                      <td class="whitespace-nowrap px-4 py-3">{{ worker.activeJobs }} / {{ worker.concurrency }}</td>
                      <td class="whitespace-nowrap px-4 py-3">{{ formatTimestamp(worker.lastSeen) }}</td>
                    </tr></template
                  >
                </tbody>
              </table>
              <p class="p-5 text-sm text-flow-muted" class-hidden="workers.length > 0">
                No worker heartbeats received yet.
              </p>
            </div>
          </section></template
        >
        <template if="page === 'tokens'"
          ><section class="rounded-2xl border border-flow-border bg-white p-5">
            <h2 class="text-lg font-semibold">Users</h2>
            <p class="mt-1 text-sm text-flow-muted">Manage access for this runner.</p>
            <p class="mt-4 text-sm text-rose-700" class-hidden="!usersForbidden" role="status">
              User management is available to administrators only.
            </p>
            <ul class="mt-4 space-y-2">
              <template for="user of users"
                ><li class="flex items-center justify-between gap-3 rounded-xl border border-flow-border p-4">
                  <span
                    ><span class="block text-sm font-medium">{{ user.name || user.email || 'Account' }}</span
                    ><span class="block text-xs text-flow-muted"
                      >{{ user.name && user.email ? user.email : user.role }}</span
                    ></span
                  ><button
                    type="button"
                    on-click="toggleRole(user)"
                    attr-aria-label="'Change role for ' + (user.name || user.email || 'account')"
                    class="rounded-lg border border-flow-border px-3 py-2 text-sm"
                  >
                    {{ user.role === 'admin' ? 'Remove admin' : 'Make admin' }}
                  </button>
                </li></template
              >
            </ul>
          </section></template
        >
        <p class="text-sm text-rose-700" role="alert" class-hidden="!error">{{ error }}</p>
      </main>
      <script setup src="/settings-ui.mjs"></script>
    </template>
    <script type="module">
      import "@li3/web";
    </script>
  </body>
</html>
