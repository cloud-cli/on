<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <title>Runner Workflow Management</title>
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <style>
      body[data-page='list'] .editor-panel {
        display: none;
      }
      body[data-page='editor'] .workflow-list,
      body[data-page='editor'] .secrets-panel {
        display: none;
      }
    </style>
  </head>
  <body data-page="__WORKFLOW_PAGE__" class="min-h-screen bg-gray-950 p-4 font-sans text-gray-100 md:p-6">
    <link rel="component" href="https://sodium.static.apphor.de/code-editor.html" />
    <link rel="component" href="https://sodium.static.apphor.de/code-block.html" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />

    <template app>
      <main class="mx-auto max-w-6xl space-y-5">
        <header class="flex flex-col gap-4 border-b border-gray-800 pb-5 sm:flex-row sm:items-end sm:justify-between">
          <div class="flex items-start gap-3">
            <a
              href="/runs"
              aria-label="Back to dashboard"
              class="mt-1 rounded-lg border border-gray-800 bg-gray-900 p-2 text-gray-400 transition hover:border-indigo-500/60 hover:text-indigo-300"
            >
              <lucide-icon icon="arrow-left" size="17"></lucide-icon>
            </a>
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.18em] text-indigo-400">Runner engine</p>
              <h1 class="mt-1 text-2xl font-bold tracking-tight text-white">Workflow control room</h1>
              <p class="mt-1 text-sm text-gray-400">Draft, validate, and publish revisioned YAML definitions.</p>
            </div>
          </div>
          <a
            href="/help"
            class="inline-flex items-center justify-center gap-2 rounded-lg border border-gray-800 bg-gray-900 px-3 py-2.5 text-sm font-medium text-gray-300 outline-none transition hover:border-indigo-500/50 hover:text-indigo-200 focus-visible:ring-2 focus-visible:ring-indigo-400/60"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M9.6 9a2.5 2.5 0 1 1 4.2 1.8c-1.2 1-1.8 1.4-1.8 2.7"></path>
              <path d="M12 17h.01"></path>
            </svg>
            Help
          </a>
        </header>

        <template if="notice">
          <div
            role="status"
            class="flex items-center gap-2 rounded-lg border px-3 py-2.5 text-sm"
            bind-class="noticeError ? 'border-rose-500/40 bg-rose-500/10 text-rose-100' : 'border-emerald-500/40 bg-emerald-500/10 text-emerald-100'"
          >
            <lucide-icon bind-icon="noticeError ? 'circle-alert' : 'circle-check'" size="17"></lucide-icon>
            <span>{{ notice }}</span>
          </div>
        </template>

        <section id="workflow-layout" class="space-y-5">
          <nav
            class="workflow-list rounded-2xl border border-gray-800 bg-gray-900/80 p-4 shadow-xl shadow-black/10"
            aria-labelledby="workflow-list-title"
          >
            <div class="mb-4 flex items-end justify-between gap-3 border-b border-gray-800 pb-4">
              <div>
                <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-indigo-400">Definitions</p>
                <h2 id="workflow-list-title" class="mt-1 text-lg font-semibold text-white">Workflows</h2>
              </div>
              <a
                href="/workflows/new"
                class="inline-flex items-center gap-2 rounded-lg bg-indigo-500 px-3 py-2 text-sm font-semibold text-white outline-none transition hover:bg-indigo-400 focus-visible:ring-2 focus-visible:ring-indigo-400/60"
              >
                <lucide-icon icon="plus" size="16"></lucide-icon>
                New workflow
              </a>
            </div>
            <ul class="grid gap-2" aria-label="Workflow definitions">
              <template for="workflow of workflows">
                <li>
                  <a
                    attr-href="'/workflows/' + workflow.id"
                    class="group flex min-h-16 items-center gap-3 rounded-xl border border-gray-800 bg-gray-950/50 px-3.5 py-3 text-left text-sm text-gray-300 outline-none transition hover:border-indigo-500/50 hover:bg-indigo-500/10 focus-visible:border-indigo-400 focus-visible:ring-2 focus-visible:ring-indigo-400/50"
                  >
                    <span
                      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-gray-800 text-gray-400 transition group-hover:bg-indigo-500/15 group-hover:text-indigo-300"
                    >
                      <lucide-icon icon="workflow" size="17"></lucide-icon>
                    </span>
                    <span class="min-w-0 flex-1">
                      <span class="block truncate text-base font-semibold text-gray-100">{{ workflow.name }}</span>
                      <span class="mt-0.5 block truncate font-mono text-[11px] text-gray-500">{{ workflow.id }}</span>
                    </span>
                    <span
                      class="rounded-full border px-2 py-1 text-[10px] font-semibold uppercase tracking-wide"
                      bind-class="workflow.status === 'published' ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-300' : workflow.status === 'archived' ? 'border-gray-700 bg-gray-800 text-gray-500' : 'border-amber-500/30 bg-amber-500/10 text-amber-300'"
                      >{{ workflow.status }}</span
                    >
                    <lucide-icon
                      icon="arrow-up-right"
                      size="16"
                      class="shrink-0 text-gray-600 transition group-hover:text-indigo-300"
                    ></lucide-icon>
                  </a>
                </li>
              </template>
            </ul>
            <div
              class="rounded-xl border border-dashed border-gray-700 px-4 py-8 text-center"
              class-hidden="workflows.length > 0"
            >
              <lucide-icon icon="workflow" size="22" class="mx-auto text-gray-600"></lucide-icon>
              <p class="mt-2 text-sm font-medium text-gray-300">No workflows yet</p>
              <p class="mt-1 text-xs text-gray-500">Create a definition to start automating jobs.</p>
            </div>
          </nav>

          <section
            class="editor-panel overflow-hidden rounded-xl border border-gray-800 bg-gray-900/80 shadow-xl shadow-black/10"
          >
            <div class="border-b border-gray-800 px-4 pt-3 sm:px-5">
              <a
                href="/workflows"
                class="inline-flex items-center gap-1.5 rounded-md px-2 py-1.5 text-xs font-medium text-gray-400 outline-none transition hover:bg-gray-800 hover:text-gray-100 focus-visible:ring-2 focus-visible:ring-indigo-400/60"
              >
                <lucide-icon icon="arrow-left" size="14"></lucide-icon>
                Back to workflows
              </a>
            </div>
            <div class="border-b border-gray-800 bg-gray-900 px-4 py-4 sm:px-5">
              <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
                <label class="block max-w-xl flex-1 text-xs font-semibold uppercase tracking-wider text-gray-400"
                  >Workflow ID
                  <input
                    bind-value="workflowId"
                    on-input="setWorkflowId($event)"
                    bind-disabled="selectedId"
                    aria-describedby="workflow-id-help"
                    class="mt-2 w-full rounded-lg border border-gray-700 bg-gray-950 px-3 py-2.5 font-mono text-sm normal-case tracking-normal text-white outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
                    placeholder="derived-from-workflow-name"
                  />
                  <span
                    id="workflow-id-help"
                    class="mt-1 block text-[11px] font-normal normal-case tracking-normal text-gray-500"
                    >The ID becomes permanent after the first save.</span
                  >
                </label>
                <label class="inline-flex items-center gap-2 text-sm text-gray-300">
                  <input
                    type="checkbox"
                    bind-checked="enabled"
                    on-change="setEnabled($event)"
                    class="h-4 w-4 rounded border-gray-700 bg-gray-950 text-indigo-500 focus:ring-2 focus:ring-indigo-500/30"
                  />
                  Enabled
                </label>
                <div class="flex flex-wrap gap-2" class-hidden="readOnly">
                  <button
                    type="button"
                    aria-label="Save workflow draft"
                    title="Save workflow draft"
                    on-click="save()"
                    bind-disabled="busy"
                    class="inline-flex items-center gap-2 rounded-lg bg-indigo-500 px-3 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-400 disabled:cursor-not-allowed disabled:opacity-50"
                  >
                    <lucide-icon icon="save" size="16"></lucide-icon>
                    <span class="hidden sm:inline">Save draft</span>
                  </button>
                  <button
                    type="button"
                    aria-label="Publish workflow"
                    title="Publish workflow"
                    on-click="publish()"
                    bind-disabled="busy"
                    class="inline-flex items-center gap-2 rounded-lg border border-emerald-500/50 px-3 py-2.5 text-sm font-medium text-emerald-300 transition hover:bg-emerald-500/10 disabled:cursor-not-allowed disabled:opacity-50"
                  >
                    <lucide-icon icon="rocket" size="16"></lucide-icon>
                    <span class="hidden sm:inline">Publish</span>
                  </button>
                  <button
                    type="button"
                    aria-label="Delete workflow"
                    title="Delete workflow"
                    on-click="remove()"
                    bind-disabled="busy"
                    class="inline-flex items-center gap-2 rounded-lg border border-rose-500/50 px-3 py-2.5 text-sm font-medium text-rose-300 transition hover:bg-rose-500/10 disabled:cursor-not-allowed disabled:opacity-50"
                  >
                    <lucide-icon icon="trash" size="16"></lucide-icon>
                    <span class="hidden sm:inline">Delete</span>
                  </button>
                </div>
              </div>
            </div>
            <div class="p-3 sm:p-5">
              <div class="mb-2 flex items-center justify-between px-1 text-xs text-gray-500">
                <div class="flex items-center gap-2">
                  <button
                    type="button"
                    aria-label="Validate workflow"
                    title="Validate workflow"
                    on-click="validate(1)"
                    bind-disabled="validation.running"
                    bind-class="{ 'hidden': readOnly, 'text-emerald-400': validation.valid, 'text-rose-400': !validation.valid }"
                    class="disabled:cursor-not-allowed disabled:opacity-50"
                  >
                    <lucide-icon
                      class="inline-block"
                      bind-icon="validation.running ? 'loader-circle' : (validation.valid ? 'circle-check' : 'circle-alert')"
                      bind-class="validation.running ? 'animate-spin' : ''"
                      size="16"
                    ></lucide-icon>
                  </button>
                  <span class="font-medium" bind-class="validation.error ? 'bg-rose-500/10 text-rose-100' : ''"
                    >{{ validation.error || '' }}</span
                  >
                </div>
                <span class="font-mono">{{ source.length }} characters</span>
              </div>
              <template if="readOnly">
                <code-block
                  language="yaml"
                  theme="atom-one-dark"
                  class="block h-[calc(100vh-23rem)] min-h-[28rem] overflow-auto rounded-lg border border-gray-700 bg-gray-950 p-4"
                  bind-source="source"
                ></code-block>
              </template>
              <template if="!readOnly">
                <code-editor
                  id="source-yaml"
                  language="yaml"
                  theme="atom-one-dark"
                  nostatus="true"
                  class="block h-[calc(100vh-23rem)] min-h-[28rem] overflow-hidden rounded-lg border border-gray-700 bg-gray-950"
                  bind-value="source"
                  on-change="setSource($event.detail)"
                ></code-editor>
              </template>
              <details
                class="mt-4 overflow-hidden rounded-xl border border-gray-800 bg-gray-950/50"
                on-toggle="loadHelp($event)"
              >
                <summary
                  class="cursor-pointer list-none px-4 py-3 text-sm font-medium text-gray-300 outline-none transition hover:bg-gray-900 focus-visible:ring-2 focus-visible:ring-indigo-400/60"
                >
                  <span class="inline-flex items-center gap-2"
                    ><lucide-icon icon="circle-question-mark" size="16"></lucide-icon>Syntax</span
                  >
                  <span class="ml-2 text-xs font-normal text-gray-500">Reference, tutorials, and examples</span>
                </summary>
                <div
                  ref="helpContent"
                  class="max-h-[38rem] overflow-y-auto border-t border-gray-800 bg-gray-950 px-4 py-5"
                  role="region"
                  aria-label="Workflow syntax help"
                  aria-live="polite"
                >
                  <p class="text-sm text-gray-500">Expand to load the workflow syntax reference.</p>
                </div>
              </details>
            </div>
          </section>
        </section>

        <section
          class="secrets-panel rounded-2xl border border-gray-800 bg-gray-900/80 p-4 shadow-xl shadow-black/10 sm:p-5"
          aria-labelledby="secrets-title"
        >
          <div class="mb-5 flex items-start justify-between gap-3">
            <div class="flex items-start gap-3">
              <span class="rounded-lg bg-indigo-500/10 p-2 text-indigo-300"
                ><lucide-icon icon="key-round" size="18"></lucide-icon
              ></span>
              <div>
                <h2 id="secrets-title" class="text-lg font-semibold text-white">Secrets</h2>
                <p class="mt-0.5 text-sm text-gray-400">Write-only credentials available to workflows.</p>
              </div>
            </div>
            <span
              class="rounded-full border border-gray-700 bg-gray-950 px-2.5 py-1 text-xs font-mono text-gray-400"
              aria-label="Secret count"
              >{{ secrets.length }}</span
            >
          </div>
          <div class="mb-5 rounded-xl border border-gray-800 bg-gray-950/50 p-3">
            <p class="mb-3 text-xs text-gray-500">Saving an existing name replaces its encrypted value.</p>
            <div class="grid gap-3 md:grid-cols-[14rem_1fr_auto_auto]">
              <label class="sr-only" for="secret-name">Secret name</label>
              <input
                id="secret-name"
                bind-value="secretName"
                on-input="setSecretName($event)"
                class="rounded-lg border border-gray-700 bg-gray-900 px-3 py-2.5 font-mono text-sm uppercase outline-none transition placeholder:text-gray-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30"
                placeholder="NPM_TOKEN"
              />
              <label class="sr-only" for="secret-value">Secret value</label>
              <input
                id="secret-value"
                ref="secretValueInput"
                bind-value="secretValue"
                on-input="setSecretValue($event)"
                type="password"
                class="rounded-lg border border-gray-700 bg-gray-900 px-3 py-2.5 font-mono text-sm outline-none transition placeholder:text-gray-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30"
                placeholder="New secret value"
              />
              <label class="sr-only" for="secret-file">Secret file</label>
              <input
                id="secret-file"
                ref="secretFileInput"
                on-change="setSecretFile($event)"
                type="file"
                class="rounded-lg border border-gray-700 bg-gray-900 px-3 py-2 text-xs text-gray-400 file:mr-3 file:rounded file:border-0 file:bg-gray-700 file:px-2 file:py-1 file:text-xs file:text-gray-200 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30"
              />
              <button
                type="button"
                aria-label="Save secret value"
                title="Save secret value"
                on-click="saveSecret()"
                bind-disabled="busy"
                class="inline-flex items-center justify-center gap-2 rounded-lg border border-indigo-500/60 px-3 py-2.5 text-sm font-medium text-indigo-200 outline-none transition hover:bg-indigo-500/10 focus-visible:ring-2 focus-visible:ring-indigo-400/60 disabled:opacity-50"
              >
                <lucide-icon icon="lock-keyhole" size="16"></lucide-icon><span class="hidden sm:inline">Save</span>
              </button>
              <button
                type="button"
                aria-label="Delete secret"
                title="Delete secret"
                on-click="removeSecret()"
                bind-disabled="busy"
                class="inline-flex items-center justify-center gap-2 rounded-lg border border-rose-500/50 px-3 py-2.5 text-sm font-medium text-rose-300 outline-none transition hover:bg-rose-500/10 focus-visible:ring-2 focus-visible:ring-rose-400/60 disabled:opacity-50"
              >
                <lucide-icon icon="trash" size="16"></lucide-icon><span class="hidden sm:inline">Delete</span>
              </button>
            </div>
          </div>
          <ul class="grid gap-2" aria-label="Saved secrets">
            <template for="name of secrets">
              <li>
                <button
                  type="button"
                  on-click="selectSecret(name)"
                  class="group flex min-h-14 w-full items-center gap-3 rounded-xl border border-gray-800 bg-gray-950/50 px-3.5 py-3 text-left outline-none transition hover:border-indigo-500/50 hover:bg-indigo-500/10 focus-visible:border-indigo-400 focus-visible:ring-2 focus-visible:ring-indigo-400/50"
                  aria-label="Edit secret {{ name }}"
                >
                  <span
                    class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-gray-800 text-gray-500 group-hover:text-indigo-300"
                    ><lucide-icon icon="key-round" size="15"></lucide-icon
                  ></span>
                  <span class="min-w-0 flex-1 truncate font-mono text-sm text-gray-200">{{ name }}</span>
                  <span class="text-xs text-gray-500">Select</span>
                  <lucide-icon
                    icon="chevron-right"
                    size="16"
                    class="text-gray-600 transition group-hover:text-indigo-300"
                  ></lucide-icon>
                </button>
              </li>
            </template>
          </ul>
          <div
            class="rounded-xl border border-dashed border-gray-700 px-4 py-8 text-center"
            class-hidden="secrets.length > 0"
          >
            <lucide-icon icon="key-round" size="22" class="mx-auto text-gray-600"></lucide-icon>
            <p class="mt-2 text-sm font-medium text-gray-300">No secrets configured</p>
              <p class="mt-1 text-xs text-gray-500">Add one above to make it available to a workflow.</p>
          </div>
        </section>
      </main>

      <script setup>
        import { onDestroy, onInit, ref, templateRef } from '@li3/web';

        export default function () {
          const page = document.body.dataset.page;
          const initialId = __WORKFLOW_ID__;
          const initialRevision = __WORKFLOW_REVISION__;
          const readOnly = Boolean(initialRevision);
          const workflows = ref([]);
          const secrets = ref([]);
          const source = ref('');
          const validation = ref({ valid: true });
          const savedSource = ref('');
          const workflowId = ref('');
          const enabled = ref(true);
          const savedEnabled = ref(true);
          const selectedId = ref('');
           const secretName = ref('');
           const secretValue = ref('');
           const secretFileName = ref('');
           const secretFileData = ref('');
          const notice = ref('');
          const noticeError = ref(false);
          const busy = ref(false);
           const secretValueInput = templateRef('secretValueInput');
           const secretFileInput = templateRef('secretFileInput');
          const helpContent = templateRef('helpContent');
          const helpLoaded = ref(false);
          const helpLoading = ref(false);
          let validationTimer;

          const showNotice = (message, error = false) => {
            notice.value = message;
            noticeError.value = error;
          };

          const api = async (url, options = {}) => {
            const response = await fetch(url, {
              headers: { accept: 'application/json', ...(options.body ? { 'content-type': 'application/json' } : {}) },
              ...options,
            });
            const body = response.status === 204 ? null : await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(body.error || `Request failed: ${response.status}`);
            return body;
          };

          const derivedId = () =>
            source.value
              .match(/^\s*(?:id:\s*([^\n]+)|name:\s*([^\n]+))/m)
              ?.slice(1)
              .find(Boolean)
              ?.trim()
              .toLowerCase()
              .replace(/[^a-z0-9]/g, '-')
              .replace(/(^-|-$)/g, '') || '';

          const run = async (action) => {
            if (busy.value) return;

            busy.value = true;

            try {
              await action();
            } catch (error) {
              showNotice(error.message, true);
            } finally {
              busy.value = false;
            }
          };

          const loadWorkflows = async () => {
            workflows.value = (await api('/api/workflows')).workflows;
          };

          const loadSecrets = async () => {
            secrets.value = (await api('/api/secrets')).secrets;
          };

          const openWorkflow = async (id) => {
            const workflowUrl = initialRevision
              ? `/api/workflows/${id}?revision=${initialRevision}`
              : `/api/workflows/${id}`;
            const workflow = await api(workflowUrl);
            selectedId.value = workflow.id;
            workflowId.value = workflow.id;
            source.value = workflow.sourceYaml;
            savedSource.value = workflow.sourceYaml;
            enabled.value = workflow.enabled;
            savedEnabled.value = workflow.enabled;
          };

           const validateSource = async () => {
             return api('/api/workflows/validate', {
               method: 'POST',
               body: JSON.stringify({ sourceYaml: source.value }),
             });
           };

           const validate = (ms = 1000) => {
             if (page !== 'editor') return;

             clearTimeout(validationTimer);
             validationTimer = setTimeout(() => {
               validation.value = { ...validation.value, running: true, error: '' };
               void validateSource()
                 .then((result) => {
                   validation.value = { ...result, running: false };
                 })
                 .catch((error) => {
                   validation.value = { valid: false, running: false, error: error.message };
                   showNotice(error.message, true);
                 });
             }, ms);
           };

          const save = () =>
            run(async () => {
              const id = workflowId.value.trim() || derivedId();
              if (!id) throw new Error('Set an ID or add a workflow name first.');
              if (
                initialId &&
                id === selectedId.value &&
                source.value === savedSource.value &&
                enabled.value === savedEnabled.value
              ) {
                showNotice('No changes to save.');
                return;
              }
              const workflow = await api(`/api/workflows/${id}`, {
                method: 'PUT',
                body: JSON.stringify({ sourceYaml: source.value, enabled: enabled.value }),
              });
              selectedId.value = workflow.id;
              workflowId.value = workflow.id;
              savedSource.value = source.value;
              savedEnabled.value = enabled.value;
              showNotice(`Saved ${workflow.id} as draft revision ${workflow.revision}.`);
              if (!initialId) history.replaceState(null, '', `/workflows/${workflow.id}`);
            });
          const publish = () =>
            run(async () => {
              const id = workflowId.value.trim() || selectedId.value;
              if (!id) throw new Error('Save a workflow before publishing it.');
              const workflow = await api(`/api/workflows/${id}/publish`, { method: 'POST' });
              selectedId.value = workflow.id;
              showNotice(`Published ${workflow.id} revision ${workflow.revision}.`);
            });
          const remove = () =>
            run(async () => {
              const id = workflowId.value.trim() || selectedId.value;
              if (!id || !confirm(`Delete ${id} and all of its revisions?`)) return;
              await api(`/api/workflows/${id}`, { method: 'DELETE' });
              window.location.href = '/workflows';
            });
           const saveSecret = () =>
             run(async () => {
               const name = secretName.value.trim();
               if (!name || (!secretValue.value && !secretFileData.value)) throw new Error('Set a secret name and value or choose a file first.');
               await api(`/api/secrets/${name}`, {
                 method: 'PUT',
                 body: JSON.stringify(secretFileData.value ? { value: secretFileData.value, encoding: 'base64', originalName: secretFileName.value } : { value: secretValue.value, encoding: 'utf8' }),
               });
               secretValue.value = '';
               secretFileName.value = '';
               secretFileData.value = '';
               if (secretFileInput.value) secretFileInput.value.value = '';
              await loadSecrets();
              showNotice(`Saved ${name}.`);
            });
          const removeSecret = () =>
            run(async () => {
              const name = secretName.value.trim();
              if (!name || !confirm(`Delete ${name}?`)) return;
              await api(`/api/secrets/${name}`, { method: 'DELETE' });
               secretName.value = '';
               secretValue.value = '';
               secretFileName.value = '';
               secretFileData.value = '';
               if (secretFileInput.value) secretFileInput.value.value = '';
              await loadSecrets();
              showNotice(`Deleted ${name}.`);
            });
          const setSource = (value) => {
            source.value = value;
            validate();
          };
          const setWorkflowId = (event) => {
            workflowId.value = event.target.value;
          };
          const setEnabled = (event) => {
            enabled.value = event.target.checked;
          };
          const setSecretName = (event) => {
            secretName.value = event.target.value;
          };
           const setSecretValue = (event) => {
             secretValue.value = event.target.value;
             if (secretValue.value) {
               secretFileName.value = '';
               secretFileData.value = '';
               if (secretFileInput.value) secretFileInput.value.value = '';
             }
           };
           const setSecretFile = async (event) => {
             const file = event.target.files?.[0];
             if (!file) return;
             const bytes = new Uint8Array(await file.arrayBuffer());
             let binary = '';
             for (let index = 0; index < bytes.length; index += 0x8000) {
               binary += String.fromCharCode(...bytes.subarray(index, index + 0x8000));
             }
             secretFileName.value = file.name;
             secretFileData.value = btoa(binary);
             secretValue.value = '';
          };
          const selectSecret = (name) => {
            secretName.value = name;
            secretValueInput.value?.focus();
          };
          const visitWorkflow = (id) => {
            window.location.href = `/workflows/${id}`;
          };
          const loadHelp = async (event) => {
            if (!event.target.open || helpLoaded.value || helpLoading.value || !helpContent.value) return;
            helpLoading.value = true;
            helpContent.value.textContent = 'Loading workflow syntax help...';
            try {
              const response = await fetch('/help?embed=1', { headers: { accept: 'text/html' } });
              if (!response.ok) throw new Error(`Help request failed: ${response.status}`);
              const html = await response.text();
              const parsed = new DOMParser().parseFromString(html, 'text/html');
              const sourceNodes = [
                ...Array.from(parsed.head.querySelectorAll('style')),
                ...Array.from(parsed.body.childNodes),
              ];
              const nodes = sourceNodes.map((node) => document.importNode(node, true));
              helpContent.value.replaceChildren(...nodes);
              helpLoaded.value = true;
            } catch (error) {
              helpContent.value.textContent = 'Unable to load workflow syntax help.';
              console.error(error);
            } finally {
              helpLoading.value = false;
            }
          };

          onDestroy(() => clearTimeout(validationTimer));

          onInit(() => {
            const loadPage =
              page === 'editor'
                ? initialId
                  ? openWorkflow(initialId)
                  : Promise.resolve()
                : Promise.all([loadWorkflows(), loadSecrets()]);
            loadPage.catch((error) => showNotice(error.message, true));
          });

          return {
            workflows,
            secrets,
            source,
            validation,
            workflowId,
            enabled,
            readOnly,
            selectedId,
             secretName,
             secretValue,
             secretFileName,
             secretFileData,
            notice,
            noticeError,
            busy,
            validate,
            save,
            publish,
            remove,
            saveSecret,
            removeSecret,
            setSource,
            setWorkflowId,
            setEnabled,
            setSecretName,
             setSecretValue,
             setSecretFile,
            selectSecret,
            visitWorkflow,
            loadHelp,
          };
        }
      </script>
    </template>

    <script type="module">
      import '@li3/web';
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
  </body>
</html>
